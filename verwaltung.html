            (b.dokumentId ? ' <span title="Belegdatei hinterlegt">▢</span>' : "") + "</td>" +
          "<td>" + h(b.buchungstext) + (b.partner ? '<br><span class="hint">' + h(b.partner) + "</span>" : "") + "</td>" +
          '<td class="mono" title="' + h(b.sollText || "") + '">' + h(b.sollKonto) + "</td>" +
          '<td class="mono" title="' + h(b.habenText || "") + '">' + h(b.habenKonto) + "</td>" +
          '<td style="text-align:right;white-space:nowrap"><b>' + fmtEuro(b.bruttoCent, true) + "</b></td>" +
          "<td>" + (b.steuersatz ? b.steuersatz + " %<br><span class=\"hint\">" + fmtEuro(b.steuerCent, true) + "</span>" : "–") + "</td>" +
          "<td>" + kennz + "</td>" +
          '<td style="white-space:nowrap"><button class="ghost sm" data-beleg="' + h(b.id) + '">Ansehen</button></td>' +
          "</tr>";
      }).join("") +
      "</tbody></table></div>" +
      '<div class="hint" style="margin-top:10px">' + zeilen.length + " Buchung(en), Summe " + fmtEuro(summe) +
      " (Stornierungen abgezogen).</div>";
  }

  function belegAktionenBinden(belege, konten, partner) {
    document.querySelectorAll("[data-beleg]").forEach((b) => b.addEventListener("click", () =>
      belegDialog(belege.find((x) => String(x.id) === String(b.dataset.beleg)), konten, partner)));
  }

  /* ------------------------------------------------- Beleg erfassen */

  /**
   * Erfassungsmaske.
   *
   * Die Buchung wird in beiden Richtungen sichtbar gemacht: oben die
   * Belegart als Vorlage, darunter die beiden Konten im Klartext und
   * darunter, was daraus an Netto und Umsatzsteuer wird. Wer die Maske
   * ausfüllt, muss keine Buchführung können — soll aber sehen, was gebucht wird.
   */
  async function belegDialog(beleg, konten, partner, vorgabe) {
    if (!konten) konten = await buchKonten();
    if (!partner) partner = await buchPartner();
    const einst = await buchEinstellungen();
    const steuerpflichtig = (einst.ustArt || "steuerpflichtig") === "steuerpflichtig";
    const neu = !beleg;
    const gesperrt = !neu && (beleg.festgeschrieben || beleg.stornoVon || beleg.storniertDurch);

    if (!konten.length) {
      return modal("Noch keine Konten", null,
        '<div class="msg warn">Der Kontenrahmen ist leer. Bitte zuerst unter „Konten“ die Vorlage laden ' +
        "oder die Kontenliste der Kanzlei einlesen.</div>",
        [{ label: "Schließen", kind: "ghost", onClick: null },
         { label: "Zu den Konten", onClick: async () => { closeModal(); go("konten"); } }]);
    }

    // Ohne Umsatzsteuerpflicht wären 19 % als Vorgabe die häufigste
    // Fehlerquelle - auf der Erlös- wie auf der Aufwandsseite.
    const b = beleg || Object.assign({ art: "Ausgangsrechnung", datum: todayISO(),
      steuersatz: steuerpflichtig ? 19 : 0, bruttoCent: 0 }, vorgabe);
    const kontoOptionen = (auswahl) => {
      const gruppe = (titel, liste) => liste.length
        ? '<optgroup label="' + h(titel) + '">' + liste.map((k) =>
            '<option value="' + h(k.nummer) + '"' + (String(k.nummer) === String(auswahl) ? " selected" : "") + ">" +
            h(k.nummer + "  " + k.bezeichnung) + "</option>").join("") + "</optgroup>"
        : "";
      const aktive = konten.filter((k) => k.aktiv);
      return '<option value="">— bitte wählen —</option>' +
        gruppe("Erlöse", aktive.filter((k) => k.art === "Ertrag")) +
        gruppe("Aufwand", aktive.filter((k) => k.art === "Aufwand")) +
        gruppe("Bestand (Aktiv)", aktive.filter((k) => k.art === "Aktiv")) +
        gruppe("Bestand (Passiv)", aktive.filter((k) => k.art === "Passiv")) +
        gruppe("Kunden (Debitoren)", partner.filter((p) => p.typ === "Debitor" && p.aktiv)
          .map((p) => ({ nummer: p.konto, bezeichnung: p.name }))) +
        gruppe("Lieferanten (Kreditoren)", partner.filter((p) => p.typ === "Kreditor" && p.aktiv)
          .map((p) => ({ nummer: p.konto, bezeichnung: p.name })));
    };

    const koerper =
      (gesperrt ? '<div class="msg info">' + (beleg.festgeschrieben
        ? "Dieser Beleg wurde an den Steuerberater übergeben und ist festgeschrieben. Er lässt sich nicht mehr " +
          "ändern — das verlangt eine ordnungsgemäße Buchführung. Falsches wird storniert und neu erfasst."
        : beleg.stornoVon ? "Dies ist eine Stornobuchung. Sie bleibt unverändert stehen."
        : "Dieser Beleg wurde storniert. Er bleibt zur Nachvollziehbarkeit stehen.") + "</div>" : "") +
      '<div class="field"><label for="bArt">Vorgang</label><select id="bArt"' + (gesperrt ? " disabled" : "") + ">" +
        BELEGARTEN.map((a) => '<option value="' + a.k + '"' + (a.k === b.art ? " selected" : "") + ">" +
          h(a.l) + "</option>").join("") + "</select></div>" +
      '<p class="hint" id="bHilfe" style="margin:6px 0 12px"></p>' +

      '<div class="row">' +
        fieldHtml("bDatum", "Belegdatum", "date", b.datum) +
        fieldHtml("bNummer", "Belegnummer", "text", b.belegnummer || "",
          ' placeholder="z. B. RE-2026-001"') +
        fieldHtml("bBetrag", "Betrag brutto", "text", b.bruttoCent ? fmtEuro(b.bruttoCent, true) : "",
          ' inputmode="decimal" placeholder="0,00"') +
      "</div>" +
      '<div class="row" style="margin-top:10px">' +
        '<div class="field narrow"><label for="bSatz">Umsatzsteuer</label><select id="bSatz">' +
          STEUERSAETZE.map((s) => '<option value="' + s.v + '"' +
            (Number(s.v) === Number(b.steuersatz) ? " selected" : "") + ">" + h(s.l) + "</option>").join("") +
        "</select></div>" +
        '<div class="field"><label for="bPartner">Geschäftspartner</label><select id="bPartner">' +
          '<option value="">— ohne —</option>' + partner.filter((p) => p.aktiv).map((p) =>
            '<option value="' + h(p.id) + '" data-typ="' + h(p.typ) + '" data-konto="' + h(p.konto) + '"' +
            (String(p.id) === String(b.partnerId) ? " selected" : "") + ">" +
            h(p.konto + "  " + p.name) + "</option>").join("") + "</select></div>" +
      "</div>" +

      '<div class="row" style="margin-top:10px">' +
        '<div class="field"><label for="bSoll">Sollkonto (Zugang / Aufwand)</label>' +
        '<select id="bSoll">' + kontoOptionen(b.sollKonto) + "</select></div>" +
        '<div class="field"><label for="bHaben">Habenkonto (Abgang / Erlös)</label>' +
        '<select id="bHaben">' + kontoOptionen(b.habenKonto) + "</select></div>" +
      "</div>" +

      '<div style="margin-top:10px">' + fieldHtml("bText", "Buchungstext", "text", b.buchungstext || "",
        ' maxlength="60" placeholder="Worum ging es? Der Steuerberater liest genau das."') + "</div>" +

      '<div class="msg info" id="bVorschau" style="margin-top:12px"></div>' +

      '<details style="margin-top:6px"><summary class="hint" style="cursor:pointer">Weitere Angaben</summary>' +
        '<div class="row" style="margin-top:10px">' +
          fieldHtml("bLeistung", "Leistungsdatum", "date", b.leistungsdatum || "") +
          fieldHtml("bFaellig", "Fällig am", "date", b.faelligAm || "") +
        "</div>" +
        '<div class="row" style="margin-top:10px">' +
          fieldHtml("bKost1", "Kostenstelle", "text", b.kost1 || "") +
          fieldHtml("bKost2", "Kostenträger", "text", b.kost2 || "") +
        "</div>" +
        '<div style="margin-top:10px">' + fieldHtml("bNotiz", "Interne Notiz", "textarea", b.notiz || "") + "</div>" +
      "</details>" +

      '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">' +
        '<label class="hint" style="font-weight:600">Beleg als Datei</label>' +
        (b.dokumentId
          ? '<div class="msg ok" style="margin-top:6px">Hinterlegt: ' + h(b.dokument || "Datei") +
            ' <button class="ghost sm" id="bOeffnen" style="margin-left:8px">Öffnen</button></div>'
          : '<p class="hint" style="margin:4px 0 8px">Ohne Beleg keine Buchung. Rechnung oder Quittung ' +
            "hier anhängen — sie wandert in die Dokumentenverwaltung und geht mit im Paket an die Kanzlei.</p>") +
        (gesperrt ? "" : '<input type="file" id="bDatei" style="margin-top:6px">') +
      "</div>";

    const aktionen = [{ label: "Schließen", kind: "ghost", onClick: null }];
    if (!gesperrt && darfBuchen()) {
      aktionen.push({ label: neu ? "Buchen" : "Speichern", onClick: () => belegSpeichern(beleg) });
    }
    // Stornieren geht auch bei festgeschriebenen Belegen - nur dort geht es
    // ueberhaupt nicht mehr anders. Nicht stornierbar ist nur, was bereits
    // storniert wurde oder selbst eine Stornobuchung ist.
    if (!neu && !beleg.stornoVon && !beleg.storniertDurch && darfBuchen()) {
      aktionen.unshift({ label: "Stornieren", kind: "danger", onClick: async () => stornoDialog(beleg) });
    }

    modal(neu ? "Beleg erfassen" : "Beleg Nr. " + beleg.journalNr,
      neu ? null : beleg.belegnummer + " vom " + fmtDate(beleg.datum) +
        (beleg.angelegtVon ? " · erfasst von " + beleg.angelegtVon : ""),
      koerper, aktionen);

    /* -- Verhalten der Maske -- */
    const geldkonten = konten.filter((k) => k.geld);
    const kasse = geldkonten.find((k) => k.geld === "Kasse");
    const bank = geldkonten.find((k) => k.geld === "Bank");

    function vorlageAnwenden(nurHilfe) {
      const art = BELEGART[el("bArt").value] || BELEGART.Sonstiges;
      el("bHilfe").textContent = art.hilfe;
      if (art.ohneSteuer) { el("bSatz").value = "0"; el("bSatz").disabled = true; }
      else el("bSatz").disabled = false;
      if (nurHilfe) return vorschau();

      const gewaehlt = el("bPartner").selectedOptions[0];
      const partnerKonto = gewaehlt && gewaehlt.value ? gewaehlt.dataset.konto : "";
      const setze = (feld, rolle) => {
        const s = el(feld);
        if (rolle === "partner" && partnerKonto) s.value = partnerKonto;
        else if (rolle === "kasse" && kasse) s.value = kasse.nummer;
        else if (rolle === "geld" && bank) s.value = bank.nummer;
        else if (rolle === "frei") return;
        // "ertrag"/"aufwand" bleiben offen: welches Erlös- oder Aufwandskonto
        // richtig ist, weiß nur, wer den Beleg vor sich hat.
      };
      setze("bSoll", art.soll);
      setze("bHaben", art.haben);
      vorschau();
    }

    function vorschau() {
      const cent = centAus(el("bBetrag").value);
      const satz = Number(el("bSatz").value) || 0;
      const soll = el("bSoll").value, haben = el("bHaben").value;
      if (cent === null || cent <= 0) {
        el("bVorschau").innerHTML = "Betrag eingeben — Netto und Umsatzsteuer werden daraus berechnet.";
        return;
      }
      const steuer = satz ? Math.round((cent * satz) / (100 + satz)) : 0;
      const name = (nr) => {
        const k = konten.find((x) => x.nummer === nr) ||
          partner.map((p) => ({ nummer: p.konto, bezeichnung: p.name })).find((x) => x.nummer === nr);
        return k ? nr + " " + k.bezeichnung : nr || "?";
      };
      /*
       * Ist das Unternehmen befreit, ist ein Steuersatz fast immer ein
       * Versehen - und auf der Aufwandsseite ein teures: Die abgetrennte
       * Vorsteuer ist nicht abziehbar und fehlt dann als Betriebsausgabe.
       */
      const konto = (nr) => konten.find((x) => x.nummer === nr);
      const aufwandsseite = [soll, haben].some((nr) => (konto(nr) || {}).art === "Aufwand");
      el("bVorschau").innerHTML =
        "<b>" + fmtEuro(cent) + "</b> brutto = " + fmtEuro(cent - steuer) + " netto" +
        (satz ? " + " + fmtEuro(steuer) + " Umsatzsteuer (" + satz + " %)" : " (ohne Umsatzsteuer)") +
        "<br>Gebucht wird: <b>" + h(name(soll)) + "</b> an <b>" + h(name(haben)) + "</b>" +
        (satz && !steuerpflichtig
          ? '<br><span class="pill warn">Achtung</span> ' + (aufwandsseite
            ? "Dieses Unternehmen darf keine Vorsteuer abziehen (§ 15 Abs. 2 UStG). Der volle Betrag " +
              "gehört auf das Aufwandskonto — Steuersatz 0."
            : "Die Umsätze dieses Unternehmens sind von der Umsatzsteuer befreit.")
          : "");
    }

    if (el("bArt")) {
      el("bArt").addEventListener("change", () => vorlageAnwenden(false));
      el("bPartner").addEventListener("change", () => vorlageAnwenden(false));
      ["bBetrag", "bSatz", "bSoll", "bHaben"].forEach((id) => {
        if (el(id)) el(id).addEventListener("input", vorschau);
        if (el(id)) el(id).addEventListener("change", vorschau);
      });
      vorlageAnwenden(!neu);
    }
    if (el("bOeffnen")) el("bOeffnen").addEventListener("click", () =>
      window.open("/api/dokumente/" + beleg.dokumentId + "/inhalt", "_blank", "noopener"));

    async function belegSpeichern(vorhanden) {
      const cent = centAus(el("bBetrag").value);
      if (cent === null || cent <= 0) return modalErr("Bitte einen Betrag größer als null eingeben.");
      const daten = {
        art: el("bArt").value, datum: el("bDatum").value,
        belegnummer: el("bNummer").value.trim(), bruttoCent: cent,
        steuersatz: Number(el("bSatz").value) || 0,
        partnerId: el("bPartner").value || null,
        sollKonto: el("bSoll").value, habenKonto: el("bHaben").value,
        buchungstext: el("bText").value.trim(),
        leistungsdatum: el("bLeistung").value || null, faelligAm: el("bFaellig").value || null,
        kost1: el("bKost1").value.trim(), kost2: el("bKost2").value.trim(),
        notiz: el("bNotiz").value.trim(),
      };
      if (!daten.sollKonto || !daten.habenKonto) return modalErr("Bitte Soll- und Habenkonto wählen.");
      if (!daten.buchungstext) return modalErr("Bitte einen Buchungstext angeben.");

      const antwort = await apiJson("/buchhaltung/belege" + (vorhanden ? "/" + vorhanden.id : ""),
        { method: "POST", body: JSON.stringify(daten) });
      const belegId = vorhanden ? vorhanden.id : antwort.id;

      const datei = el("bDatei") && el("bDatei").files[0];
      if (datei) {
        try {
          await apiFetch("/buchhaltung/belege/" + belegId + "/datei", {
            method: "POST", body: await datei.arrayBuffer(),
            headers: { "Content-Type": datei.type || "application/octet-stream",
              "X-Dateiname": encodeURIComponent(datei.name) },
          });
        } catch (e) {
          // Die Buchung steht bereits — das soll nicht verlorengehen, nur weil
          // die Datei nicht durchging.
          buchVergessen(); closeModal(); render();
          return say("Buchung Nr. " + (antwort.journalNr || "") + " gespeichert, aber die Datei ließ sich " +
            "nicht anhängen: " + (e.message || e), "warn");
        }
      }
      buchVergessen();
      closeModal();
      render();
      say(vorhanden ? "Beleg gespeichert." : "Gebucht als Nr. " + antwort.journalNr + ".", "ok");
    }
  }

  function stornoDialog(beleg) {
    modal("Beleg Nr. " + beleg.journalNr + " stornieren",
      beleg.belegnummer + " · " + fmtEuro(beleg.bruttoCent),
      '<div class="msg warn">Gelöscht wird nichts. Es entsteht eine zweite Buchung mit vertauschten ' +
      "Konten, die diese hier aufhebt — beide bleiben stehen. Nur so bleibt nachvollziehbar, was passiert ist, " +
      "und genau das verlangt eine ordnungsgemäße Buchführung.</div>" +
      fieldHtml("stGrund", "Grund (erscheint im Buchungstext)", "text", "",
        ' placeholder="z. B. Betrag falsch erfasst" maxlength="40"'),
      [
        { label: "Abbrechen", kind: "ghost", onClick: null },
        { label: "Stornieren", kind: "danger", onClick: async () => {
          const grund = el("stGrund").value.trim();
          if (!grund) return modalErr("Bitte einen Grund angeben — er steht später im Buchungstext.");
          const a = await apiJson("/buchhaltung/belege/" + beleg.id + "/storno",
            { method: "POST", body: JSON.stringify({ grund }) });
          buchVergessen(); closeModal(); render();
          say("Storniert durch Buchung Nr. " + a.journalNr + ".", "ok");
        }},
      ]);
  }

  /* ========================================================= Kassenbuch */

  VIEWS.kasse = async function (v) {
    if (!buchBereit(v, "Kassenbuch", "Jede Bargeldbewegung mit fortlaufendem Bestand.",
      darfBuchen() ? '<button id="neu">Kassenbeleg erfassen</button>' : "")) return;
    // Aus dem Kassenbuch heraus ist fast immer eine Barausgabe gemeint.
    if (el("neu")) el("neu").addEventListener("click", () => belegDialog(null, null, null, { art: "Kassenausgabe" }));

    const z = zeitraum();
    const k = await apiJson("/buchhaltung/kassenbuch?von=" + z.von + "&bis=" + z.bis);

    if (!k.konten.length) {
      el("body").innerHTML = zeitraumHtml() + '<div class="card"><div class="msg warn">Es ist kein Kassenkonto ' +
        "eingerichtet. Unter „Konten“ beim Kassenkonto (SKR04: 1600, SKR03: 1000) die Art „Kasse“ " +
        "hinterlegen — dann erscheint hier das Kassenbuch.</div></div>";
      zeitraumBinden(() => render());
      return;
    }

    el("body").innerHTML = zeitraumHtml() +
      (k.negativAb ? '<div class="msg error"><b>Der Kassenbestand wird rechnerisch negativ.</b><br>' +
        "Ab dem " + fmtDate(k.negativAb) + " steht mehr im Abgang, als je eingegangen ist. Bar lässt sich " +
        "nicht ausgeben, was nicht da ist — es fehlt eine Einnahme oder eine Einlage. Eine Betriebsprüfung " +
        "sieht sich genau das zuerst an.</div>" : "") +
      '<div class="stats" style="margin-bottom:16px">' +
      kachel(fmtEuro(k.anfang), "Bestand zu Beginn") +
      kachel(fmtEuro(k.zeilen.reduce((s, z2) => s + (z2.einaus > 0 ? z2.einaus : 0), 0)), "Einnahmen bar", "acc") +
      kachel(fmtEuro(k.zeilen.reduce((s, z2) => s + (z2.einaus < 0 ? -z2.einaus : 0), 0)), "Ausgaben bar") +
      kachel(fmtEuro(k.ende), "Bestand am Ende", k.ende < 0 ? "warn" : "") +
      "</div>" +
      '<div class="card">' + (k.zeilen.length
        ? '<div class="table-wrap"><table><thead><tr><th>Nr.</th><th>Datum</th><th>Beleg</th>' +
          '<th>Vorgang</th><th style="text-align:right">Einnahme</th><th style="text-align:right">Ausgabe</th>' +
          '<th style="text-align:right">Bestand</th><th></th></tr></thead><tbody>' +
          k.zeilen.map((z2) => "<tr>" +
            '<td class="mono">' + h(z2.journalNr) + "</td>" +
            "<td>" + fmtDate(z2.datum) + "</td>" +
            "<td>" + h(z2.belegnummer) + (z2.dokumentId ? " ▢" : "") + "</td>" +
            "<td>" + h(z2.buchungstext) + "</td>" +
            '<td style="text-align:right">' + (z2.einaus > 0 ? fmtEuro(z2.einaus, true) : "") + "</td>" +
            '<td style="text-align:right">' + (z2.einaus < 0 ? fmtEuro(-z2.einaus, true) : "") + "</td>" +
            '<td style="text-align:right;font-weight:600' + (z2.bestand < 0 ? ";color:var(--danger)" : "") + '">' +
              fmtEuro(z2.bestand, true) + "</td>" +
            '<td><button class="ghost sm" data-beleg="' + h(z2.id) + '">Ansehen</button></td></tr>').join("") +
          "</tbody></table></div>"
        : '<div class="empty">Keine Bargeldbewegungen im Zeitraum.</div>') + "</div>" +
      '<p class="hint">Kassenkonto: ' + k.konten.map(h).join(", ") + ". Der Bestand läuft über alle Buchungen seit " +
      "Beginn fort, nicht nur über den angezeigten Zeitraum.</p>";

    zeitraumBinden(() => render());
    const alle = k.zeilen;
    document.querySelectorAll("[data-beleg]").forEach((b) => b.addEventListener("click", () =>
      belegDialog(alle.find((x) => String(x.id) === String(b.dataset.beleg)))));
  };

  /* ======================================================= Umsatzsteuer */

  VIEWS.steuer = async function (v) {
    if (!buchBereit(v, "Umsatzsteuer",
      "Summen des Zeitraums zum Abgleich. Die Voranmeldung erstellt und übermittelt die Kanzlei.", "")) return;

    const z = zeitraum();
    const u = await apiJson("/buchhaltung/umsatzsteuer?von=" + z.von + "&bis=" + z.bis);
    const zeile = (l, wert, kz, stark) => "<tr><td>" + h(l) +
      (kz ? ' <span class="pill neutral">Kz ' + kz + "</span>" : "") + "</td>" +
      '<td style="text-align:right;white-space:nowrap' + (stark ? ";font-weight:700" : "") + '">' +
      fmtEuro(wert) + "</td></tr>";

    el("body").innerHTML = zeitraumHtml() +
      '<div class="msg info">Diese Aufstellung ist eine Hilfe zum Abgleich — <b>keine Voranmeldung</b>. ' +
      "Angemeldet und übermittelt wird sie von der Kanzlei; von hier aus geht nichts an das Finanzamt.</div>" +
      (u.ustArt === "steuerfrei"
        ? '<div class="msg warn">Die Umsätze dieses Unternehmens sind nach § 4 UStG <b>steuerfrei</b>. ' +
          "Sie gehören in Kennzahl 48; eine Zahllast entsteht daraus nicht. Vorsteuer ist nicht " +
          "abziehbar (§ 15 Abs. 2 UStG) — steht unten trotzdem ein Betrag, wurde eine " +
          "Eingangsrechnung mit Steuersatz erfasst.</div>"
        : u.ustArt === "kleinunternehmer"
        ? '<div class="msg warn">Kleinunternehmer nach § 19 UStG: Es wird keine Umsatzsteuer erhoben ' +
          "und keine Vorsteuer abgezogen. Ob überhaupt eine Voranmeldung abzugeben ist, sagt das " +
          "Finanzamt.</div>"
        : "") +
      '<div class="card"><h2>Erlöse</h2><table><tbody>' +
      zeile("Umsätze zu 19 % — Bemessungsgrundlage", u.erloese[19].netto, 81) +
      zeile("darauf entfallende Umsatzsteuer", u.erloese[19].steuer) +
      zeile("Umsätze zu 7 % — Bemessungsgrundlage", u.erloese[7].netto, 86) +
      zeile("darauf entfallende Umsatzsteuer", u.erloese[7].steuer) +
      zeile("Umsätze ohne Umsatzsteuer", u.erloese[0].netto, 48) +

  /**
   * Lädt ein fertiges Paket herunter.
   *
   * Der Umweg über fetch und einen Objekt-URL ist nötig, weil ein einfacher
   * Verweis die Sitzung nicht mitnähme — und weil der Browser die Datei sonst
   * anzeigen statt speichern würde.
   */
  async function paketHolen(id, dateiname) {
    say("Paket wird zusammengestellt…", "info");
    const antwort = await apiFetch("/buchhaltung/uebergaben/" + id + "/datei");
    const daten = await antwort.blob();
    const url = URL.createObjectURL(daten);
    const a = document.createElement("a");
    a.href = url;
    a.download = dateiname || "Buchfuehrung.zip";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    say("Paket gespeichert. Es liegt im Download-Ordner und kann an die Kanzlei weitergegeben werden.", "ok");
  }

  function paketErzeugen(endgueltig, z, pruef) {
    const schwer = pruef.befunde.filter((b) => b.schwere === "fehler");
    modal(endgueltig ? "Endgültig übergeben" : "Probelauf erzeugen",
      fmtDate(z.von) + " bis " + fmtDate(z.bis) + " · " + pruef.anzahl + " Buchung(en)",
      (schwer.length ? '<div class="msg error"><b>Es gibt offene Punkte:</b><br>' +
        schwer.map((b) => h(b.titel)).join("<br>") + "</div>" : "") +
      (endgueltig
        ? '<div class="msg warn"><b>Danach ist der Zeitraum geschlossen.</b><br>' +
          "Die Buchungen werden festgeschrieben: keine Änderung mehr, keine Nachbuchung in diesen Zeitraum. " +
          "Falsches lässt sich danach nur noch durch eine Stornobuchung im laufenden Zeitraum berichtigen.</div>"
        : '<div class="msg info">Ein Probelauf ändert nichts und kann beliebig oft wiederholt werden.</div>') +
      '<p class="hint">Das Paket enthält den Buchungsstapel im DATEV-Format, die Bezeichnungen der ' +
      "Personenkonten, eine lesbare Buchungsliste, den Kontenrahmen, die Umsatzsteuersummen und alle " +
      "hinterlegten Belegdateien.</p>",
      [
        { label: "Abbrechen", kind: "ghost", onClick: null },
        { label: endgueltig ? "Festschreiben und erzeugen" : "Erzeugen",
          kind: endgueltig ? "danger" : "", onClick: async () => {
          const a = await apiJson("/buchhaltung/uebergaben", { method: "POST",
            body: JSON.stringify({ von: z.von, bis: z.bis, endgueltig }) });

          say(a.anzahl + " Buchungen" + (a.belege ? " und " + a.belege + " Belegdateien" : "") +
            " übergeben. Prüfsumme " + a.pruefsumme + ".", "ok");

  }

        : '<div class="empty">Noch keine Kunden oder Lieferanten angelegt.</div>') + "</div>";

    const kontenZeichnen = () => {
      const q = (el("kq").value || "").toLowerCase();
      const zeilen = q ? konten.filter((k) => (k.nummer + " " + k.bezeichnung).toLowerCase().includes(q)) : konten;
      el("ktbl").innerHTML = zeilen.length
        ? '<div class="table-wrap"><table><thead><tr><th>Konto</th><th>Bezeichnung</th><th>Art</th>' +
          "<th>Umsatzsteuer</th><th>Besonderheit</th><th></th></tr></thead><tbody>" +
          zeilen.map((k) => "<tr" + (k.aktiv ? "" : ' style="opacity:.55"') + ">" +
            '<td class="mono">' + h(k.nummer) + "</td>" +
            "<td>" + h(k.bezeichnung) + "</td>" +
            "<td>" + h(k.art) + "</td>" +
            "<td>" + (k.steuersatz ? k.steuersatz + " %" : "–") +
              (k.bu ? ' <span class="pill neutral">Schlüssel ' + h(k.bu) + "</span>" : "") + "</td>" +
            "<td>" + (k.automatik ? '<span class="pill accent">Automatik</span> ' : "") +
              (k.geld ? '<span class="pill ok">' + h(k.geld) + "</span> " : "") +
              (k.aktiv ? "" : '<span class="pill danger">stillgelegt</span>') + "</td>" +
            "<td>" + (darfBuchen() ? '<button class="ghost sm" data-konto="' + h(k.id) + '">Bearbeiten</button>' : "") +
            "</td></tr>").join("") + "</tbody></table></div>"
        : '<div class="empty">Kein Konto gefunden.</div>';
      document.querySelectorAll("[data-konto]").forEach((b) => b.addEventListener("click", () =>
        kontoDialog(konten.find((k) => String(k.id) === String(b.dataset.konto)))));
    };
    el("kq").addEventListener("input", kontenZeichnen);
    kontenZeichnen();

    if (el("neuKonto")) el("neuKonto").addEventListener("click", () => kontoDialog(null));
    if (el("neuPartner")) el("neuPartner").addEventListener("click", () => partnerDialog(null, e));
    if (el("vorlage")) el("vorlage").addEventListener("click", async () => {
      const a = await apiJson("/buchhaltung/konten/vorlage", { method: "POST", body: JSON.stringify({ skr: e.skr }) });
      buchVergessen(); render();
      say(a.ergaenzt ? a.ergaenzt + " Konten aus der SKR" + a.skr + "-Vorlage ergänzt."
        : "Alle Konten der Vorlage sind bereits vorhanden.", "ok");
    });
    if (el("einlesen")) el("einlesen").addEventListener("click", kontenEinlesenDialog);
    document.querySelectorAll("[data-partner]").forEach((b) => b.addEventListener("click", () =>
      partnerDialog(partner.find((p) => String(p.id) === String(b.dataset.partner)), e)));
  };

      '<div class="row">' +
        fieldHtml("kNummer", "Kontonummer", "text", k.nummer || "", ' inputmode="numeric"') +
        fieldHtml("kArt", "Art", "select", k.art,
          [{ v: "Aufwand", l: "Aufwand" }, { v: "Ertrag", l: "Ertrag (Erlöse)" },
           { v: "Aktiv", l: "Aktiv (Vermögen)" }, { v: "Passiv", l: "Passiv (Kapital, Schulden)" }]) +
      "</div>" +
      '<div style="margin-top:10px">' + fieldHtml("kBez", "Bezeichnung", "text", k.bezeichnung || "") + "</div>" +
      '<div class="row" style="margin-top:10px">' +
        fieldHtml("kSatz", "Regel-Umsatzsteuer", "select", String(k.steuersatz || 0),
          [{ v: "0", l: "ohne" }, { v: "7", l: "7 %" }, { v: "19", l: "19 %" }]) +
        fieldHtml("kBu", "Steuerschlüssel", "text", k.bu || "", ' inputmode="numeric" placeholder="z. B. 9"') +
        fieldHtml("kGeld", "Geldkonto", "select", k.geld || "",
          [{ v: "", l: "— nein —" }, { v: "Kasse", l: "Kasse (Bargeld)" }, { v: "Bank", l: "Bank" }]) +

      '<div style="margin-top:12px"><label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">' +

      "DATEV ermittelt die Umsatzsteuer bei diesem Konto selbst. Dann wird kein Steuerschlüssel mitgegeben — " +

      [
        { label: "Abbrechen", kind: "ghost", onClick: null },
      ].concat(konto ? [{ label: "Löschen", kind: "danger", onClick: async () => {

          if (!el("kBez").value.trim()) return modalErr("Bitte eine Bezeichnung angeben.");
          await apiJson("/buchhaltung/konten" + (konto ? "/" + konto.id : ""), { method: "POST",
            body: JSON.stringify({ nummer, bezeichnung: el("kBez").value.trim(), art: el("kArt").value,
              steuersatz: Number(el("kSatz").value), bu: el("kBu").value.trim(),

          buchVergessen(); closeModal(); render(); say("Gespeichert.", "ok");

    modal(neu ? "Kunde oder Lieferant anlegen" : "Konto " + p.konto, neu ? null : p.name,
      '<div class="row">' +
        fieldHtml("pTyp", "Art", "select", d.typ,
          [{ v: "Debitor", l: "Kunde (Debitor)" }, { v: "Kreditor", l: "Lieferant (Kreditor)" }]) +
        fieldHtml("pKonto", "Kontonummer", "text", d.konto || "", ' inputmode="numeric"') +
      "</div>" +
      '<p class="hint" style="margin-top:6px">Kunden ' + e.nummernkreise.debitor.von + "–" +
      e.nummernkreise.debitor.bis + ", Lieferanten " + e.nummernkreise.kreditor.von + "–" +
      e.nummernkreise.kreditor.bis + ". Leer lassen vergibt die nächste freie Nummer.</p>" +
      '<div style="margin-top:10px">' + fieldHtml("pName", "Name", "text", d.name || "") + "</div>" +
      '<div class="row" style="margin-top:10px">' +
        fieldHtml("pStrasse", "Straße", "text", d.strasse || "") +
        fieldHtml("pPlz", "PLZ", "text", d.plz || "") +
        fieldHtml("pOrt", "Ort", "text", d.ort || "") +
      "</div>" +
      '<div class="row" style="margin-top:10px">' +
        fieldHtml("pUstid", "USt-IdNr.", "text", d.ustid || "", ' placeholder="DE123456789"') +
        fieldHtml("pIban", "IBAN", "text", d.iban || "") +
      "</div>" +
      '<div style="margin-top:10px"><label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">' +
      '<input type="checkbox" id="pVerbraucher"' + (d.verbraucher ? " checked" : "") +
      ' style="margin-top:3px;width:15px;height:15px"><span>Verbraucher (Privatperson)<br>' +
      '<span class="hint">Entscheidet im Mahnwesen über den Verzugszins: fünf statt neun Punkte über ' +
      'dem Basiszinssatz (§ 288 BGB). Krankenkassen, Behörden und Firmen sind keine Verbraucher, ' +
      'Selbstzahler schon.</span></span></label></div>' +
      '<div style="margin-top:10px"><label style="display:flex;gap:8px;align-items:center;cursor:pointer">' +
      '<input type="checkbox" id="pAktiv"' + (d.aktiv !== false ? " checked" : "") +
      ' style="width:15px;height:15px"><span>zur Auswahl anbieten</span></label></div>',
      [
        { label: "Abbrechen", kind: "ghost", onClick: null },
        { label: "Speichern", onClick: async () => {
          if (!el("pName").value.trim()) return modalErr("Bitte einen Namen angeben.");
          const a = await apiJson("/buchhaltung/partner" + (p ? "/" + p.id : ""), { method: "POST",
            body: JSON.stringify({ typ: el("pTyp").value, konto: el("pKonto").value.trim(),
              name: el("pName").value.trim(), strasse: el("pStrasse").value.trim(),
              plz: el("pPlz").value.trim(), ort: el("pOrt").value.trim(),
              ustid: el("pUstid").value.trim(), iban: el("pIban").value.trim(),
              verbraucher: el("pVerbraucher").checked, aktiv: el("pAktiv").checked }) });
          buchVergessen(); closeModal(); render();
          say((neu ? "Angelegt" : "Gespeichert") + " unter Konto " + a.konto + ".", "ok");
        }},

      // Bei der Art wechselt der Nummernkreis - dann gleich die nächste freie

      el("pTyp").addEventListener("change", async () => {
        try {
          const a = await apiJson("/buchhaltung/partner/naechste?typ=" + el("pTyp").value);
          el("pKonto").value = a.konto || "";

      });

      "Kopf- und Summenzeilen werden übergangen.</div>" +

      "zusammen und nennt gar keine Kontonummern. Nur wenn sie einen <i>Kontennachweis</i> enthält, stehen dort " +

      '<div class="field"><label for="kText">Kontenliste</label>' +
      '<textarea id="kText" rows="12" class="mono" placeholder="1600   Kasse                 0,00   1.070,00&#10;' +
      '4400   Erlöse 19 % USt       0,00   1.000,00&#10;6815   Bürobedarf">' +

      [
        { label: "Abbrechen", kind: "ghost", onClick: null },
        { label: "Einlesen", onClick: async () => {
          const text = el("kText").value;
          if (!text.trim()) return modalErr("Bitte die Liste einfügen.");

          // Wurde nichts erkannt, bleibt der Dialog stehen - sonst stünde

        }},

  /* ============================================================== Bank
     Kontoauszug einlesen, Umsätze zuordnen und buchen.
     ============================================================== */

  VIEWS.bank = async function (v) {
    if (!buchBereit(v, "Bank", "Kontoauszüge einlesen und die Umsätze den Rechnungen zuordnen.",
      darfBuchen() ? '<button class="ghost" id="bkRegeln">Regeln anwenden</button>' : "")) return;

    const [konten, antw, importe, unbekannt] = await Promise.all([
      buchKonten(),
      apiJson("/buchhaltung/bank/umsaetze"),
      apiJson("/buchhaltung/bank/importe"),
      apiJson("/buchhaltung/bank/beteiligte"),
    ]);
    /*
     * Eingelesen wird ausschließlich auf Bankkonten. Ein Kassenbuch entsteht
     * aus Belegen, nicht aus einer Datei — stünde die Kasse hier zur Auswahl,
     * landete früher oder später ein Kontoauszug darauf, und das fiele erst
     * beim Abstimmen auf.
     */
    const geldkonten = konten.filter((k) => k.geld === "Bank" && k.aktiv);
    const umsaetze = antw.wert || [];

    if (!geldkonten.length) {
      el("body").innerHTML = '<div class="card"><div class="msg warn">Es ist kein Bankkonto eingerichtet. ' +
        "Unter „Konten“ beim Bankkonto (SKR04: 1800, SKR03: 1200) die Art „Bank“ hinterlegen — " +
        "danach lassen sich hier Kontoauszüge einlesen.</div></div>";
      return;
    }

    const offen = umsaetze.filter((u) => u.status === "offen");
    const gebucht = umsaetze.filter((u) => u.status === "gebucht");
    const beiseite = umsaetze.filter((u) => u.status === "ignoriert");

    el("body").innerHTML =
      (darfBuchen()
        ? '<div class="card"><h2>Kontoauszug einlesen</h2>' +
          '<p class="hint">Die CSV-Datei aus dem Onlinebanking herunterladen und hier auswählen. ' +
          "Die Spalten werden anhand der Überschriften erkannt — Sparkasse, Volksbank, DKB, Commerzbank " +
          "und andere schreiben sie verschieden. Bereits vorhandene Umsätze werden übergangen, " +
          "überlappende Zeiträume sind also unbedenklich.</p>" +
          '<div class="row" style="margin-top:12px">' +
          '<div class="field narrow"><label for="bkKonto">Bankkonto</label><select id="bkKonto">' +
          geldkonten.map((k) => '<option value="' + h(k.nummer) + '">' + h(k.nummer + "  " + k.bezeichnung) +
            "</option>").join("") + "</select></div>" +
          '<div class="field"><label for="bkDatei">CSV-Datei</label><input type="file" id="bkDatei" accept=".csv,.txt,text/csv"></div>' +
          '<div class="btnrow" style="padding-bottom:1px"><button id="bkLesen">Einlesen</button></div></div></div>'
        : "") +

      ((unbekannt.wert || []).length && darfBuchen()
        ? '<div class="card"><h2>Zahlungsbeteiligte übernehmen' +
          '<button class="ghost sm" id="bkBeteiligte">Ansehen und anlegen</button></h2>' +
          '<p class="hint">' + (unbekannt.wert.length) + " Zahlungsbeteiligte aus dem Kontoauszug sind noch " +
          "kein Geschäftspartner. Wer als Kunde oder Lieferant angelegt ist — mit IBAN —, wird bei " +
          "künftigen Umsätzen von selbst erkannt, und seine offenen Rechnungen werden zur Zuordnung " +
          "angeboten. Nicht jeder gehört dazu: eigene Konten, Finanzamt und Bank nicht.</p></div>"
        : "") +
      '<div class="stats" style="margin-bottom:16px">' +
      kachel(offen.length, "noch zuzuordnen", offen.length ? "warn" : "") +
      kachel(gebucht.length, "gebucht") +
      kachel(beiseite.length, "beiseitegelegt") +
      kachel(fmtEuro(offen.reduce((s, u) => s + u.centBetrag, 0)), "Summe offener Umsätze") +
      "</div>" +

      '<div class="card"><h2>Umsätze</h2>' +
      '<div class="row" style="margin-bottom:12px">' +
      '<div class="field"><label for="bkQ">Suche</label>' +
      '<input type="search" id="bkQ" placeholder="Name, Verwendungszweck, Betrag…"></div>' +
      '<div class="field narrow"><label for="bkStatus">Stand</label><select id="bkStatus">' +
      '<option value="offen">noch zuzuordnen</option><option value="">alle</option>' +
      '<option value="gebucht">gebucht</option><option value="ignoriert">beiseitegelegt</option>' +
      "</select></div></div><div id=\"bkTbl\"></div></div>" +

      (importe.wert && importe.wert.length
        ? '<div class="card"><h2>Bisher eingelesen</h2><div class="table-wrap"><table><thead><tr>' +
          "<th>Datei</th><th>Konto</th><th>Zeitraum</th><th>Neu</th><th>Bereits vorhanden</th>" +
          '<th style="text-align:right">Endsaldo laut Auszug</th><th>Eingelesen</th>' +
          "</tr></thead><tbody>" +
          importe.wert.slice(0, 10).map((i) => "<tr><td>" + h(i.dateiname) + "</td>" +
            '<td class="mono">' + h(i.konto) + "</td><td>" + fmtDate(i.von) + " – " + fmtDate(i.bis) + "</td>" +
            "<td>" + h(i.neu) + "</td><td>" + h(i.doppelt) + "</td>" +
            '<td style="text-align:right;white-space:nowrap">' +
              (i.endsaldoCent !== null && i.endsaldoCent !== undefined
                ? fmtEuro(i.endsaldoCent, true) + '<br><span class="hint">' + fmtDate(i.endsaldoDatum) + "</span>"
                : '<span class="hint">nicht enthalten</span>') +
              (i.luecken ? ' <span class="pill warn">' + h(i.luecken) + " Lücken</span>" : "") + "</td>" +
            "<td>" + fmtDateTime(i.erstelltAm) + "</td></tr>").join("") +
          "</tbody></table></div></div>"
        : "");

    const zeichnen = () => {
      const q = (el("bkQ").value || "").toLowerCase(), st = el("bkStatus").value;
      let zeilen = umsaetze;
      if (st) zeilen = zeilen.filter((u) => u.status === st);
      if (q) zeilen = zeilen.filter((u) => ((u.beteiligter || "") + " " + (u.zweck || "") + " " +
        fmtEuro(u.centBetrag, true)).toLowerCase().includes(q));
      el("bkTbl").innerHTML = zeilen.length ? umsatzTabelle(zeilen)
        : '<div class="empty">Keine Umsätze' + (st === "offen" ? " offen — alles zugeordnet." : ".") + "</div>";
      document.querySelectorAll("[data-umsatz]").forEach((b) => b.addEventListener("click", () =>
        zuordnenDialog(umsaetze.find((u) => String(u.id) === String(b.dataset.umsatz)), konten)));
      document.querySelectorAll("[data-zurueck]").forEach((b) => b.addEventListener("click", async () => {
        await apiJson("/buchhaltung/bank/umsaetze/" + b.dataset.zurueck + "/zurueck", { method: "POST" });
        buchVergessen(); render(); say("Umsatz zurückgeholt.", "ok");
      }));
    };
    ["bkQ", "bkStatus"].forEach((id) => el(id).addEventListener("input", zeichnen));
    zeichnen();

    if (el("bkLesen")) el("bkLesen").addEventListener("click", () => auszugEinlesen(geldkonten));
    if (el("bkRegeln")) el("bkRegeln").addEventListener("click", regelnAnwenden);
    if (el("bkBeteiligte")) el("bkBeteiligte").addEventListener("click", () =>
      beteiligteDialog(unbekannt.wert || []));
  };

  /**
   * Zahlungsbeteiligte aus dem Kontoauszug zu Geschäftspartnern machen.
   *
   * Beim ersten Einlesen sind das schnell vierzig Namen. Jeden einzeln
   * anzulegen wäre eine halbe Stunde Tipparbeit, und die IBAN abzuschreiben
   * eine Fehlerquelle. Angekreuzt wird trotzdem von Hand: Nicht jeder
   * Zahlungsbeteiligte ist ein Geschäftspartner.

  function beteiligteDialog(liste) {
    modal("Zahlungsbeteiligte übernehmen",
      liste.length + " aus dem Kontoauszug, die noch kein Geschäftspartner sind",
      '<div class="msg info">Angelegt wird mit <b>IBAN</b> — daran werden künftige Umsätze erkannt, ' +
      "auch wenn die Bank den Namen anders schreibt. Kunden (Debitoren) bekommen eine Nummer ab 10000, " +
      "Lieferanten (Kreditoren) ab 70000.<br><br>" +
      "<b>Nicht alles gehört hierher:</b> eigene Konten, Umbuchungen zwischen Gesellschaften, " +
      "Finanzamt und Bankgebühren sind keine Geschäftspartner — die werden gegen ein Sachkonto " +
      "gebucht.</div>" +
      '<div class="btnrow" style="margin-bottom:10px">' +
      '<button class="ghost sm" id="btAlle">Alle ankreuzen</button>' +
      '<button class="ghost sm" id="btKeine">Keine</button>' +
      '<button class="ghost sm" id="btEin">Nur Zahlungseingänge</button></div>' +
      '<div class="table-wrap"><table><thead><tr><th></th><th>Name</th><th>IBAN</th>' +
      '<th style="text-align:right">Bewegungen</th><th style="text-align:right">Summe</th>' +
      "<th>Anlegen als</th></tr></thead><tbody>" +
      liste.map((b, i) => '<tr data-bet="' + i + '">' +
        '<td><input type="checkbox" style="width:15px;height:15px;accent-color:var(--accent)"></td>' +
        "<td>" + h(b.name) + "</td>" +
        '<td class="mono" style="font-size:11px">' + h(b.iban || "–") + "</td>" +
        '<td style="text-align:right">' + h(b.anzahl) +
          (b.eingaenge && b.ausgaenge ? '<br><span class="hint">' + b.eingaenge + " ein, " +
            b.ausgaenge + " aus</span>" : "") + "</td>" +
        '<td style="text-align:right;white-space:nowrap">' + fmtEuro(b.centSumme, true) + "</td>" +
        '<td><select style="font-size:12px;padding:3px 6px">' +
          '<option value="Debitor"' + (b.vorschlagTyp === "Debitor" ? " selected" : "") + ">Kunde</option>" +
          '<option value="Kreditor"' + (b.vorschlagTyp === "Kreditor" ? " selected" : "") + ">Lieferant</option>" +
        "</select></td></tr>").join("") + "</tbody></table></div>" +
      '<div class="msg" id="btSumme" style="margin-top:10px"></div>',
      [
        { label: "Abbrechen", kind: "ghost", onClick: null },
        { label: "Anlegen", onClick: async () => {
          const gewaehlt = auswahl();
          if (!gewaehlt.length) return modalErr("Bitte mindestens einen ankreuzen.");
          const a = await apiJson("/buchhaltung/bank/beteiligte", { method: "POST",
            body: JSON.stringify({ liste: gewaehlt }) });
          buchVergessen(); closeModal(); render();
          say(a.angelegt.length + " Geschäftspartner angelegt (Konten " +
            a.angelegt[0].konto + (a.angelegt.length > 1 ? " bis " +
              a.angelegt[a.angelegt.length - 1].konto : "") + ")." +
            (a.uebergangen.length ? " " + a.uebergangen.length + " übergangen: " +
              a.uebergangen[0].grund : ""),
            a.uebergangen.length ? "warn" : "ok");
        }},
      ]);

    function auswahl() {
      return Array.from(document.querySelectorAll("[data-bet]"))
        .filter((z) => z.querySelector("input").checked)
        .map((z) => {
          const b = liste[Number(z.dataset.bet)];
          return { name: b.name, iban: b.iban, typ: z.querySelector("select").value };
        });
    }
    function zaehlen() {
      const n = auswahl().length;
      const feld = el("btSumme");
      if (!feld) return;
      feld.className = "msg " + (n ? "ok" : "info");
      feld.textContent = n ? n + " ausgewählt." : "Noch nichts ausgewählt.";
    }
    const setzen = (pruefe) => {
      document.querySelectorAll("[data-bet]").forEach((z, i) => {
        z.querySelector("input").checked = pruefe(liste[i]);
      });
      zaehlen();
    };
    document.querySelectorAll("[data-bet] input").forEach((f) => f.addEventListener("change", zaehlen));
    el("btAlle").addEventListener("click", () => setzen(() => true));
    el("btKeine").addEventListener("click", () => setzen(() => false));
    el("btEin").addEventListener("click", () => setzen((b) => b.eingaenge > 0 && b.centSumme > 0));
    zaehlen();
  };

  /**
   * Bucht die offenen Umsätze, für die eine Regel „ohne Rückfrage" gilt.
   *
   * Bewusst ein eigener Knopf und kein stilles Mitlaufen beim Einlesen: Was
   * gebucht wurde, soll jemand entschieden haben. Hinterher steht da, was
   * geschehen ist — und was liegen blieb, weil die Regel nur vorschlägt.
   */
  async function regelnAnwenden() {
    const knopf = el("bkRegeln");
    if (knopf) { knopf.disabled = true; knopf.innerHTML = '<span class="spin"></span>Buche…'; }
    try {
      const a = await apiJson("/buchhaltung/regeln/anwenden", { method: "POST" });
      buchVergessen();
      render();
      const wartend = a.uebergangen.filter((x) => !x.fehler).length;
      const fehler = a.uebergangen.filter((x) => x.fehler);
      if (!a.gebucht.length && !wartend) {
        return say("Keine Regel traf auf einen offenen Umsatz zu.", "info");
      }
      say(
        (a.gebucht.length
          ? a.gebucht.length + " Umsatz/Umsätze nach Regeln gebucht (" +
            [...new Set(a.gebucht.map((g) => g.regel))].join(", ") + ")."
          : "Nichts gebucht.") +
        (wartend ? " " + wartend + " weitere passen zu einer Regel, die nur vorschlägt — " +
          "die bitte einzeln bestätigen." : "") +
        (fehler.length ? " " + fehler.length + " ließen sich nicht buchen: " +
          fehler[0].fehler : ""),
        fehler.length ? "warn" : "ok");
    } catch (e) {
      say(e.message || String(e), "error");
    } finally {
      if (knopf && knopf.isConnected) { knopf.disabled = false; knopf.textContent = "Regeln anwenden"; }
    }
  };

  function umsatzTabelle(zeilen) {
    return '<div class="table-wrap"><table><thead><tr><th>Datum</th><th>Zahlungsbeteiligter</th>' +
      '<th>Verwendungszweck</th><th style="text-align:right">Betrag</th><th>Stand</th><th></th>' +
      "</tr></thead><tbody>" +
      zeilen.map((u) => {
        const stand = u.status === "gebucht"
          ? '<span class="pill ok">gebucht' + (u.journalNr ? " Nr. " + h(u.journalNr) : "") + "</span>"
          : u.status === "ignoriert" ? '<span class="pill neutral">beiseitegelegt</span>'
          : '<span class="pill warn">offen</span>';
        return "<tr" + (u.status !== "offen" ? ' style="opacity:.65"' : "") + ">" +
          "<td>" + fmtDate(u.datum) + "</td>" +
          "<td>" + h(u.beteiligter || "–") + "</td>" +
          '<td style="max-width:34ch">' + h((u.zweck || "").slice(0, 90)) +
            (u.notiz ? '<br><span class="hint">' + h(u.notiz) + "</span>" : "") + "</td>" +
          '<td style="text-align:right;white-space:nowrap;font-weight:600' +
            (u.centBetrag < 0 ? ";color:var(--danger)" : "") + '">' + fmtEuro(u.centBetrag, true) + "</td>" +
          "<td>" + stand + "</td>" +
          '<td style="white-space:nowrap">' +
            (u.status === "offen" && darfBuchen()
              ? '<button class="ghost sm" data-umsatz="' + h(u.id) + '">Zuordnen</button>' : "") +
            (u.status === "ignoriert" && darfBuchen()
              ? '<button class="ghost sm" data-zurueck="' + h(u.id) + '">Zurückholen</button>' : "") +
          "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  /** Datei einlesen; fehlende Spalten werden nachgefragt statt geraten. */
  async function auszugEinlesen(geldkonten, zuordnung) {
    const datei = el("bkDatei") && el("bkDatei").files[0];
    if (!datei) return say("Bitte zuerst eine CSV-Datei auswählen.", "error");
    const konto = el("bkKonto").value;
    const knopf = el("bkLesen");
    if (knopf) { knopf.disabled = true; knopf.innerHTML = '<span class="spin"></span>Lese…'; }
    try {
      const kopf = { "Content-Type": "text/csv", "X-Konto": konto,
        "X-Dateiname": encodeURIComponent(datei.name) };
      if (zuordnung) kopf["X-Zuordnung"] = encodeURIComponent(JSON.stringify(zuordnung));
      const antwort = await apiFetch("/buchhaltung/bank/import",
        { method: "POST", body: await datei.arrayBuffer(), headers: kopf });
      const a = await antwort.json();
      buchVergessen();
      render();

      /*
       * Liefert die Bank den Kontostand nach jeder Buchung mit, lässt sich die
       * ganze Datei nachrechnen: Anfangsbestand plus Summe muss den Endsaldo
       * ergeben. Geht das nicht auf, wurde eine Spalte falsch gedeutet — das
       * fiele sonst erst beim Abstimmen auf, wenn es niemand mehr dem Import
       * zuordnet.
       */
      const grund = a.neu + " neue Umsätze eingelesen" +
        (a.doppelt ? ", " + a.doppelt + " waren bereits vorhanden" : "") +
        " (" + fmtDate(a.von) + " bis " + fmtDate(a.bis) + ").";
      const sp = a.salden || {};
      if (!sp.vorhanden) return say(grund, "ok");
      if (!sp.stimmt) {
        return say(grund + " ACHTUNG: Die Gegenprobe über die Saldenspalte geht nicht auf — " +
          "Anfangsbestand " + fmtEuro(sp.anfangCent) + " plus " + fmtEuro(sp.summeCent) +
          " ergibt nicht den Endsaldo " + fmtEuro(sp.endeCent) + " (Unterschied " +
          fmtEuro(sp.differenzCent) + "). Vermutlich wurde eine Spalte falsch zugeordnet. " +
          "Bitte die Umsätze stichprobenweise gegen den Auszug halten.", "error");
      }
      if (sp.luecken) {
        return say(grund + " Hinweis: Die Saldenkette hat " + sp.luecken + " Lücke(n) — der Auszug " +
          "enthält nicht alle Umsätze des Zeitraums, meist weil beim Herunterladen gefiltert wurde. " +
          "Endsaldo laut Auszug: " + fmtEuro(sp.endeCent) + ".", "warn");
      }
      say(grund + " Gegenprobe stimmt: Endsaldo " + fmtEuro(sp.endeCent) + " zum " +
        fmtDate(sp.endeDatum) + " — jeder Betrag wurde richtig gelesen.", "ok");
    } catch (e) {
      if (e.status === 409 && e.koerper && e.koerper.spaltenFehlen) {
        return spaltenDialog(e.koerper, geldkonten);
      }
      say(e.message || String(e), "error");
    } finally {
      if (knopf && knopf.isConnected) { knopf.disabled = false; knopf.textContent = "Einlesen"; }
    }
  }

  /** Wenn sich die Spalten nicht erschließen lassen, ordnet der Benutzer sie zu. */
  function spaltenDialog(antwort, geldkonten) {
    const spalten = antwort.kopf || [];
    const auswahl = (id, label, vorgabe, pflicht) =>
      '<div class="field"><label for="' + id + '">' + h(label) + (pflicht ? " *" : "") + "</label>" +
      '<select id="' + id + '"><option value="">— keine —</option>' +
      spalten.map((sp, i) => '<option value="' + i + '"' +
        (String(vorgabe) === String(i) ? " selected" : "") + ">" +
        h((sp || "Spalte " + (i + 1)) + " (" + (i + 1) + ")") + "</option>").join("") + "</select></div>";
    const e = antwort.erkannt || {};

    modal("Spalten zuordnen", "Diese Datei ließ sich nicht von allein deuten",
      '<div class="msg warn">Nicht gefunden: <b>' + h(antwort.fehlt.join(", ")) + "</b>. " +
      "Bitte angeben, in welcher Spalte was steht.</div>" +
      (antwort.beispiel && antwort.beispiel.length
        ? '<p class="hint">Erste Zeile der Datei:</p><div class="table-wrap"><table><tbody><tr>' +
          (antwort.beispiel[0] || []).map((z) => '<td class="mono">' + h(String(z).slice(0, 22)) + "</td>").join("") +
          "</tr></tbody></table></div>"
        : "") +
      '<div class="row" style="margin-top:12px">' + auswahl("spDatum", "Buchungstag", e.datum, true) +
        auswahl("spBetrag", "Betrag", e.betrag, true) + "</div>" +
      '<div class="row" style="margin-top:10px">' + auswahl("spZweck", "Verwendungszweck", e.zweck) +
        auswahl("spName", "Zahlungsbeteiligter", e.beteiligter) + "</div>" +
      '<div class="row" style="margin-top:10px">' + auswahl("spIban", "IBAN", e.iban) +
        auswahl("spValuta", "Wertstellung", e.valuta) + "</div>" +
      '<p class="hint" style="margin-top:10px">Getrennte Soll- und Habenspalten? Dann als „Betrag“ die ' +
      "Habenspalte wählen — der Rest wird beim nächsten Versuch nachgefragt.</p>",
      [
        { label: "Abbrechen", kind: "ghost", onClick: null },
        { label: "Einlesen", onClick: async () => {
          const nimm = (id) => (el(id).value === "" ? undefined : Number(el(id).value));
          if (nimm("spDatum") === undefined || nimm("spBetrag") === undefined) {
            return modalErr("Buchungstag und Betrag werden gebraucht.");
          }
          const z = { datum: nimm("spDatum"), betrag: nimm("spBetrag"), zweck: nimm("spZweck"),
            beteiligter: nimm("spName"), iban: nimm("spIban"), valuta: nimm("spValuta") };
          Object.keys(z).forEach((k) => z[k] === undefined && delete z[k]);
          closeModal();
          await auszugEinlesen(geldkonten, z);
        }},
      ]);
  }

  /* ------------------------------------------------- Umsatz zuordnen */

  /**
   * Zuordnen und buchen.
   *
   * Vorgeschlagen wird viel, entschieden wird von Hand. Jeder Vorschlag nennt
   * seinen Grund — eine Zahl ohne Begründung wäre nur ein Orakel.
   */
  async function zuordnenDialog(umsatz, konten) {
    const v = (await apiJson("/buchhaltung/bank/umsaetze/" + umsatz.id + "/vorschlaege"));
    const eingang = umsatz.centBetrag > 0;
    const kontoOptionen = (auswahl) => konten.filter((k) => k.aktiv && k.nummer !== umsatz.konto)
      .map((k) => '<option value="' + h(k.nummer) + '"' + (k.nummer === auswahl ? " selected" : "") + ">" +
        h(k.nummer + "  " + k.bezeichnung) + "</option>").join("");

    const kopfZeile =
      '<div class="msg info"><b>' + fmtDate(umsatz.datum) + " · " + fmtEuro(umsatz.centBetrag) + "</b> — " +
      (eingang ? "Eingang" : "Ausgang") + "<br>" +
      h(umsatz.beteiligter || "ohne Angabe") + (umsatz.iban ? ' <span class="mono">' + h(umsatz.iban) + "</span>" : "") +
      (umsatz.zweck ? "<br>" + h(umsatz.zweck) : "") +
      /*
       * Hat eine Regel gegriffen, gehört ihr Name hierher. Bei einer
       * Zahlerregel steht sonst nirgends, warum dieser Zahler vorgeschlagen
       * wird — und ein Vorschlag ohne erkennbaren Urheber ist nicht prüfbar.
       */
      (v.regel ? '<br><span class="hint">Regel „' + h(v.regel.name) + "“ — " +
        (v.regel.ziel === "Zahler" && v.partnerVorschlag
          ? "Zahler „" + h(v.partnerVorschlag.name) + "“; welche Rechnung gemeint ist, entscheidet sich unten."
          : "Vorschlag für das Gegenkonto unten.") + "</span>" : "") + "</div>";

    /*
     * Einzelne Rechnungen. Getrennt wird nach Betragstreffer: Was den Betrag
     * genau trifft, steht offen da; alles andere kommt zugeklappt darunter.
     * Sieben nicht passende Vorschläge über der richtigen Antwort wären
     * Lärm — und Lärm führt zu Fehlbuchungen.
     */
    const zeileRechnung = (r) =>
      '<label class="vorschlag"><input type="radio" name="zuordnung" value="rg-' + h(r.id) + '">' +
      "<span><b>" + h(r.belegnummer) + " · " + h(r.partner || "ohne Partner") + " · " + fmtEuro(r.offenCent) +
      " offen</b>" + (r.offenCent !== Math.abs(umsatz.centBetrag)
        ? ' <span class="pill warn">Betrag weicht ab</span>' : "") +
      '<br><span class="hint">' + h(r.gruende.join(" · ")) + "</span></span></label>";

    const genau = v.rechnungen.filter((r) => r.offenCent === Math.abs(umsatz.centBetrag));
    const daneben = v.rechnungen.filter((r) => r.offenCent !== Math.abs(umsatz.centBetrag));

    const einzelteil =
      (genau.length ? '<h3 style="margin-top:16px">Einzelne Rechnung</h3>' + genau.map(zeileRechnung).join("") : "") +
      (daneben.length
        ? '<details style="margin-top:' + (genau.length ? "8" : "16") + 'px"><summary class="hint" ' +
          'style="cursor:pointer">' + daneben.length + " weitere offene Rechnung(en) dieses Zahlers — " +
          "Betrag weicht ab</summary>" +
          // Eingepackt: Ein direktes Kind eines zugeklappten <details> bleibt
          // sichtbar, sobald es ein eigenes display trägt - und .vorschlag ist
          // ein Flex-Element. Der Zwischenbehälter nimmt dem die Grundlage.
          '<div>' + daneben.map(zeileRechnung).join("") + "</div></details>"
        : "");

    /*
     * Sammelzahlungen. Große Zahler begleichen mit einem Betrag mehrere
     * Rechnungen. Gesucht wird die Zusammenstellung, die genau aufgeht — und
     * wenn es mehrere gibt, steht das da, statt eine davon zu wählen.
     */
    const sammelteil = v.sammelzahlungen.map((sz, iSz) => {
      if (sz.abgebrochen && !sz.kombinationen) {
        return '<div class="msg warn" style="margin-top:16px"><b>' + h(sz.partner) + "</b> hat " +
          sz.offeneAnzahl + " offene Rechnungen — zu viele, um alle Zusammenstellungen sicher " +
          "durchzurechnen. Bitte unten von Hand aufteilen.</div>";
      }
      const kopfHinweis = sz.eindeutig
        ? '<div class="msg ok" style="margin-top:10px">Genau eine Zusammenstellung ergibt diesen Betrag.</div>'
        : sz.betragsgleich
        ? '<div class="msg warn" style="margin-top:10px"><b>Mehrdeutig:</b> ' + sz.kombinationen.length +
          (sz.weitere ? "+" : "") + " Zusammenstellungen bestehen aus denselben Beträgen. Rechnerisch ist " +
          "das einerlei — welche Rechnung als bezahlt gilt, entscheidet es aber sehr wohl. Bitte anhand " +
          "des Zahlungsavises wählen."
          + "</div>"
        : '<div class="msg warn" style="margin-top:10px"><b>Mehrdeutig:</b> ' + sz.kombinationen.length +
          (sz.weitere ? " von " + (sz.kombinationen.length + sz.weitere) : "") +
          " verschiedene Zusammenstellungen ergeben denselben Betrag. Bitte die richtige wählen.</div>";

      return '<h3 style="margin-top:18px">Sammelzahlung ' + h(sz.partner) + "</h3>" +
        '<p class="hint">' + sz.offeneAnzahl + " offene Rechnungen, zusammen " + fmtEuro(sz.offeneSumme) + ".</p>" +
        kopfHinweis +
        sz.kombinationen.map((k, iK) =>
          '<label class="vorschlag"><input type="radio" name="zuordnung" value="sammel-' + iSz + "-" + iK + '">' +
          "<span><b>" + k.anzahl + " Rechnungen · " + fmtEuro(k.centSumme) + "</b>" +
          '<br><span class="hint">' + h(k.gruende.join(" · ")) + "</span>" +
          '<div class="sammelliste">' + k.posten.map((pp) =>
            "<div><span>" + h(pp.belegnummer) + "</span><span>" + fmtDate(pp.datum) + "</span>" +
            "<span>" + fmtEuro(pp.offenCent, true) + "</span></div>").join("") + "</div>" +
          "</span></label>").join("");
    }).join("");

    /*
     * Kein genauer Treffer. Zu unterscheiden sind zwei Fälle, denn sie führen
     * zu verschiedenem Vorgehen: Gar kein Anhaltspunkt spricht für eine
     * Buchung auf ein Sachkonto (Gebühren, Löhne, Steuern). Gibt es dagegen
     * einen Zahler, nur keinen passenden Betrag, ist es meist eine gekürzte
     * Zahlung — und dann hilft nur das Aufteilen von Hand.
     */
    const betragGetroffen = v.rechnungen.some((r) => r.offenCent === Math.abs(umsatz.centBetrag));
    const sammelGefunden = v.sammelzahlungen.some((sz) => sz.kombinationen && sz.kombinationen.length);
    const nichtsGefunden = betragGetroffen || sammelGefunden ? ""
      : !v.rechnungen.length && !v.partnerVorschlag
      ? '<div class="msg warn" style="margin-top:16px">Zu diesem Umsatz passt keine offene Rechnung — auch ' +
        "keine Zusammenstellung mehrerer. Bei Gebühren, Löhnen und Steuern ist das der Normalfall; " +
        "dann unten auf ein Sachkonto buchen.</div>"
      : '<div class="msg warn" style="margin-top:16px"><b>Kein Betrag passt genau.</b><br>' +
        (v.partnerVorschlag ? "Der Zahler ist erkannt (" + h(v.partnerVorschlag.name) + "), aber weder eine " +
          "einzelne Rechnung noch eine Zusammenstellung mehrerer ergibt " + fmtEuro(Math.abs(umsatz.centBetrag)) +
          ". Bei Krankenkassen ist das meist eine gekürzte Zahlung — dann unten von Hand aufteilen und den " +
          "Rest offen stehen lassen."
          : "Keine offene Rechnung trifft diesen Betrag genau. Entweder von Hand aufteilen oder auf ein " +
            "Sachkonto buchen.") + "</div>";

    /* -- Von Hand aufteilen -- */
    const handteil =
      '<h3 style="margin-top:18px">Von Hand aufteilen</h3>' +
      '<label class="vorschlag"><input type="radio" name="zuordnung" value="hand">' +
      "<span><b>Selbst auf Rechnungen verteilen</b><br>" +
      '<span class="hint">Für gekürzte Zahlungen und alles, was nicht glatt aufgeht — der Rest bleibt ' +
      "offen stehen.</span></span></label>" +
      '<div id="handFelder" style="margin-left:26px;margin-top:8px;display:none">' +
      '<div class="field narrow" style="max-width:320px"><label for="zZahler">Zahler</label>' +
      '<select id="zZahler"><option value="">— bitte wählen —</option>' +
      v.zahler.map((p) => '<option value="' + h(p.id) + '"' +
        (v.partnerVorschlag && p.id === v.partnerVorschlag.id ? " selected" : "") + ">" +
        h(p.konto + "  " + p.name) + "</option>").join("") + "</select></div>" +
      '<div id="handListe" style="margin-top:10px"></div>' +
      '<div class="msg" id="handSumme" style="margin-top:10px"></div>' +
      "</div>";

    /*
     * Reihenfolge nach Treffsicherheit: Trifft eine einzelne Rechnung den
     * Betrag, steht sie oben. Sonst führt die Sammelzahlung, weil sie dann
     * die eigentliche Antwort ist.
     */
    const rechnungsteil = genau.length
      ? einzelteil + sammelteil + nichtsGefunden + handteil
      : sammelteil + einzelteil + nichtsGefunden + handteil;

    modal("Umsatz zuordnen", null,
      kopfZeile + rechnungsteil +
      '<h3 style="margin-top:18px">Ohne Rechnung: auf ein Konto buchen</h3>' +
      '<label class="vorschlag"><input type="radio" name="zuordnung" value="konto">' +
      "<span><b>Gegen ein Sachkonto buchen</b>" +
      (v.regel && v.regel.ziel !== "Zahler" ? ' <span class="pill accent">Regel</span>' : "") +
      (v.kontoVorschlag ? '<br><span class="hint">' + h(v.kontoVorschlag.grund) + "</span>" : "") +
      "</span></label>" +
      '<div id="kontoFelder" style="margin-left:26px;margin-top:8px;display:none">' +
        '<div class="row">' +
        '<div class="field"><label for="zKonto">Gegenkonto</label><select id="zKonto">' +
        kontoOptionen(v.kontoVorschlag ? v.kontoVorschlag.konto : null) + "</select></div>" +
        '<div class="field narrow"><label for="zSatz">Umsatzsteuer</label><select id="zSatz">' +
        STEUERSAETZE.map((x) => '<option value="' + x.v + '"' +
          (x.v === (v.kontoVorschlag && v.kontoVorschlag.ausRegel ? v.kontoVorschlag.steuersatz : 0)
            ? " selected" : "") + ">" + h(x.l) + "</option>").join("") + "</select></div></div>" +
        /*
         * Die Regel entsteht dort, wo die Entscheidung ohnehin fällt. Angeboten
         * wird das nur, wenn nicht schon eine Regel gegriffen hat — sonst
         * entstünden zwei Regeln für denselben Vorgang.
         */
        (v.regel || !darfBuchen() ? ""
          : '<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">' +
            '<label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">' +
            '<input type="checkbox" id="zAlsRegel" style="margin-top:3px;width:15px;height:15px">' +
            "<span><b>Diese Zuordnung als Regel merken</b><br>" +
            '<span class="hint">Künftige Umsätze ' +
            (umsatz.iban ? "mit der IBAN " + h(umsatz.iban) : 'von „' + h(umsatz.beteiligter || "") + '“') +
            " werden dann auf dasselbe Konto vorgeschlagen.</span></span></label>" +
            '<label style="display:none;gap:8px;align-items:flex-start;cursor:pointer;margin:8px 0 0 26px" ' +
            'id="zAutoZeile"><input type="checkbox" id="zRegelAuto" style="margin-top:3px;width:15px;height:15px">' +
            "<span>künftig <b>ohne Rückfrage</b> buchen<br>" +
            '<span class="hint">Nur, wo die Zuordnung wirklich immer dieselbe ist.</span></span></label></div>') +
      "</div>" +
      '<div style="margin-top:14px">' +
      fieldHtml("zText", "Buchungstext", "text",
        // Vorgabe ist der Verwendungszweck dieses Umsatzes. Der Text einer
        // früheren Buchung stünde hier falsch: Er gehört zu einem anderen
        // Vorgang und wird erst angeboten, wenn auf ein Sachkonto gebucht wird.
        (umsatz.zweck || "").slice(0, 60) || umsatz.beteiligter || "", ' maxlength="60"') + "</div>" +
      '<div id="zVorschau" class="msg" style="margin-top:12px;display:none"></div>',
      [
        { label: "Abbrechen", kind: "ghost", onClick: null },
        { label: "Beiseitelegen", kind: "ghost", onClick: async () => beiseiteDialog(umsatz) },
        { label: "Buchen", onClick: async () => {
          const wahl = document.querySelector('input[name="zuordnung"]:checked');
          if (!wahl) return modalErr("Bitte eine Zuordnung wählen.");
          const text = el("zText").value.trim();
          if (!text) return modalErr("Bitte einen Buchungstext angeben.");

          let daten;
          if (wahl.value === "konto") {
            daten = { gegenkonto: el("zKonto").value, steuersatz: Number(el("zSatz").value),
              buchungstext: text,
              regelId: v.regel ? v.regel.id : null,
              alsRegel: el("zAlsRegel") ? el("zAlsRegel").checked : false,
              regelAutomatisch: el("zRegelAuto") ? el("zRegelAuto").checked : false };
          } else if (wahl.value === "hand") {
            const zuordnungen = handZuordnungen();
            if (!zuordnungen.length) return modalErr("Bitte mindestens eine Rechnung mit Betrag angeben.");
            const summe = zuordnungen.reduce((a, z) => a + z.betragCent, 0);
            if (summe > Math.abs(umsatz.centBetrag)) {
              return modalErr("Es sind " + fmtEuro(summe) + " verteilt, die Zahlung beträgt aber nur " +
                fmtEuro(Math.abs(umsatz.centBetrag)) + ".");
            }
            daten = { zuordnungen, buchungstext: text };
          } else if (wahl.value.startsWith("sammel-")) {
            const teile = wahl.value.split("-");
            const sz = v.sammelzahlungen[Number(teile[1])];
            daten = { rechnungIds: sz.kombinationen[Number(teile[2])].ids, buchungstext: text };
          } else {
            daten = { rechnungIds: [Number(wahl.value.slice(3))], buchungstext: text };
          }
          const a = await apiJson("/buchhaltung/bank/umsaetze/" + umsatz.id + "/buchen",
            { method: "POST", body: JSON.stringify(daten) });
          buchVergessen(); closeModal(); render();
          say("Gebucht als Nr. " + a.journalNr + "." +
            (a.regelId ? " Die Regel ist gemerkt — beim nächsten Mal steht sie als Vorschlag bereit." : ""), "ok");
        }},
      ]);

    /* -- Von Hand aufteilen: Liste, Summe und Rest -- */
    let handPosten = (v.offenePosten || []).slice();

    function handZuordnungen() {
      return Array.from(document.querySelectorAll("[data-hand]"))
        .filter((zeile) => zeile.querySelector("input[type=checkbox]").checked)
        .map((zeile) => ({ rechnungId: Number(zeile.dataset.hand),
          betragCent: centAus(zeile.querySelector("input[type=text]").value) }))
        .filter((z) => z.betragCent !== null && z.betragCent > 0);
    }

    function handRechnen() {
      const zu = handZuordnungen();
      const summe = zu.reduce((a, z) => a + z.betragCent, 0);
      const zahlung = Math.abs(umsatz.centBetrag);
      const rest = zahlung - summe;
      const feld = el("handSumme");
      if (!feld) return;
      feld.className = "msg " + (rest === 0 ? "ok" : rest < 0 ? "error" : "info");
      feld.innerHTML = "Verteilt: <b>" + fmtEuro(summe) + "</b> von " + fmtEuro(zahlung) +
        (rest === 0 ? " — geht genau auf."
          : rest > 0 ? " — <b>" + fmtEuro(rest) + "</b> bleiben der Zahlung nicht zugeordnet und tauchen " +
            "in der Abstimmung auf."
          : " — <b>" + fmtEuro(-rest) + "</b> zu viel verteilt.");
    }

    function handListeZeichnen() {
      const ziel = el("handListe");
      if (!ziel) return;
      if (!handPosten.length) {
        ziel.innerHTML = '<div class="hint">Für diesen Zahler ist keine Rechnung offen.</div>';
        return handRechnen();
      }
      ziel.innerHTML = '<div class="table-wrap"><table><thead><tr><th></th><th>Beleg</th><th>Datum</th>' +
        '<th style="text-align:right">offen</th><th style="width:120px">davon zahlen</th></tr></thead><tbody>' +
        handPosten.map((pp) => '<tr data-hand="' + h(pp.id) + '">' +
          '<td><input type="checkbox" style="width:15px;height:15px;accent-color:var(--accent)"></td>' +
          "<td>" + h(pp.belegnummer) + "</td><td>" + fmtDate(pp.datum) + "</td>" +
          '<td style="text-align:right;white-space:nowrap">' + fmtEuro(pp.offenCent, true) + "</td>" +
          '<td><input type="text" inputmode="decimal" value="' + h(fmtEuro(pp.offenCent, true)) + '"></td>' +
          "</tr>").join("") + "</tbody></table></div>";
      ziel.querySelectorAll("[data-hand] input").forEach((f) => {
        f.addEventListener("input", handRechnen);
        f.addEventListener("change", handRechnen);
      });
      handRechnen();
    }

    const textVorgabe = el("zText") ? el("zText").value : "";
    const umschalten = () => {
      const wahl = document.querySelector('input[name="zuordnung"]:checked');
      const aufKonto = wahl && wahl.value === "konto";
      el("kontoFelder").style.display = aufKonto ? "" : "none";
      const hand = wahl && wahl.value === "hand";
      el("handFelder").style.display = hand ? "" : "none";
      if (hand && !el("handListe").innerHTML) handListeZeichnen();
      // Beim Buchen auf ein Sachkonto hilft der Text von letztem Mal — aber
      // nur, solange nichts Eigenes darinsteht.
      if (aufKonto && v.kontoVorschlag && v.kontoVorschlag.buchungstext &&
          el("zText").value === textVorgabe) {
        el("zText").value = v.kontoVorschlag.buchungstext;
      }
    };
    document.querySelectorAll('input[name="zuordnung"]').forEach((r) =>
      r.addEventListener("change", umschalten));
    if (el("zAlsRegel")) el("zAlsRegel").addEventListener("change", () => {
      el("zAutoZeile").style.display = el("zAlsRegel").checked ? "flex" : "none";
      if (!el("zAlsRegel").checked) el("zRegelAuto").checked = false;
    });

    // Anderer Zahler: dessen offene Posten nachladen.
    if (el("zZahler")) el("zZahler").addEventListener("change", async () => {
      const id = el("zZahler").value;
      if (!id) { handPosten = []; return handListeZeichnen(); }
      try {
        const neu = await apiJson("/buchhaltung/bank/umsaetze/" + umsatz.id + "/vorschlaege?partner=" + id);
        handPosten = neu.offenePosten || [];
      } catch (e) { handPosten = []; }
      handListeZeichnen();
    });

    /*
     * Vorausgewählt wird nur, was eindeutig ist: eine Einzelrechnung mit
     * klarem Vorsprung oder eine Zusammenstellung, die als einzige aufgeht.
     * Bei Mehrdeutigkeit wählt niemand — auch nicht die Anwendung.
     */
    const eindeutigeSammel = v.sammelzahlungen.findIndex((sz) => sz.eindeutig);
    const zahlerregel = v.regel && v.regel.ziel === "Zahler";
    if (v.regel && !zahlerregel && !v.rechnungen.some((r) => r.offenCent === Math.abs(umsatz.centBetrag))) {
      // Eine greifende Regel ist eine bewusst getroffene Festlegung und geht
      // allem voran - außer einer Rechnung, deren Betrag genau stimmt.
      const kb = document.querySelector('input[value="konto"]');
      if (kb) kb.checked = true;
    } else if (v.rechnungen.length && v.rechnungen[0].punkte >= 90) {
      const rb = document.querySelector('input[value="rg-' + v.rechnungen[0].id + '"]');
      if (rb) rb.checked = true;
    } else if (eindeutigeSammel >= 0) {
      const sb = document.querySelector('input[value="sammel-' + eindeutigeSammel + '-0"]');
      if (sb) sb.checked = true;
    } else if (zahlerregel) {
      /*
       * Zahlerregel, aber kein Betrag geht auf: Das ist bei Krankenkassen der
       * Regelfall — gekürzte Zahlung. Auf ein Sachkonto zu zeigen wäre hier
       * falsch, denn Geld von einem bekannten Zahler gehört auf dessen
       * offene Posten. Aufgeklappt wird deshalb das Aufteilen von Hand;
       * welche Rechnung wie viel bekommt, bleibt trotzdem offen.
       */
      const hb = document.querySelector('input[value="hand"]');
      if (hb) hb.checked = true;
    }
    umschalten();
  }

  function beiseiteDialog(umsatz) {
    modal("Umsatz beiseitelegen", fmtDate(umsatz.datum) + " · " + fmtEuro(umsatz.centBetrag),
      '<div class="msg info">Gelöscht wird nichts — der Umsatz bleibt mit Begründung stehen. ' +
      "Gedacht ist das für Umbuchungen zwischen eigenen Konten, die sonst doppelt gebucht würden.</div>" +
      fieldHtml("igGrund", "Grund", "text", "", ' placeholder="z. B. Umbuchung auf eigenes Tagesgeldkonto"'),
      [
        { label: "Abbrechen", kind: "ghost", onClick: null },
        { label: "Beiseitelegen", kind: "danger", onClick: async () => {
          const grund = el("igGrund").value.trim();
          if (!grund) return modalErr("Bitte einen Grund angeben.");
          await apiJson("/buchhaltung/bank/umsaetze/" + umsatz.id + "/ignorieren",
            { method: "POST", body: JSON.stringify({ grund }) });
          buchVergessen(); closeModal(); render(); say("Umsatz beiseitegelegt.", "ok");
        }},
      ]);
  }

  /* ==================================================== Offene Posten */

  VIEWS.offeneposten = async function (v) {
    if (!buchBereit(v, "Offene Posten",
      "Welche Rechnung noch nicht bezahlt ist — und seit wann.", "")) return;

    const stichtag = zeitraum().bis;
    const o = await apiJson("/buchhaltung/offeneposten?stichtag=" + stichtag);

    const gliederungHtml = (g, titel) =>
      '<div class="card"><h2>' + h(titel) + "</h2><table><tbody>" +
      g.gliederung.map((s) => "<tr><td>" + h(s.stufe) + "</td>" +
        '<td style="text-align:right">' + h(s.anzahl) + "</td>" +
        '<td style="text-align:right;white-space:nowrap' +
          (s.stufe === "über 90 Tage" && s.centSumme ? ";color:var(--danger);font-weight:600" : "") + '">' +
        fmtEuro(s.centSumme, true) + "</td></tr>").join("") +
      '<tr><td><b>gesamt</b></td><td style="text-align:right"><b>' + h(g.anzahl) + "</b></td>" +
      '<td style="text-align:right"><b>' + fmtEuro(g.centSumme, true) + "</b></td></tr>" +
      "</tbody></table></div>";

    el("body").innerHTML = zeitraumHtml() +
      '<p class="hint" style="margin:-6px 0 14px">Stichtag ist das Ende des gewählten Zeitraums: ' +
      fmtDate(stichtag) + ".</p>" +
      '<div class="stats" style="margin-bottom:16px">' +
      kachel(fmtEuro(o.forderungen.centSumme), "Forderungen (wir bekommen)", "acc") +
      kachel(fmtEuro(o.verbindlichkeiten.centSumme), "Verbindlichkeiten (wir schulden)") +
      kachel(o.forderungen.anzahl + o.verbindlichkeiten.anzahl, "offene Rechnungen") +
      kachel(o.nichtZugeordnet.length, "Zahlungen ohne Rechnung",
        o.nichtZugeordnet.length ? "warn" : "") +
      "</div>" +
      '<div class="row" style="align-items:stretch">' +
      '<div style="flex:1;min-width:280px">' + gliederungHtml(o.forderungen, "Forderungen nach Alter") + "</div>" +
      '<div style="flex:1;min-width:280px">' + gliederungHtml(o.verbindlichkeiten, "Verbindlichkeiten nach Alter") + "</div>" +
      "</div>" +

      (o.nichtZugeordnet.length
        ? '<div class="card" style="border-color:var(--warn)"><h2>Zahlungen ohne zugeordnete Rechnung</h2>' +
          '<p class="hint" style="margin-bottom:12px">Das Geld ist gebucht, aber es steht nicht fest, welche ' +
          "Rechnung damit bezahlt wurde. Solange das offen ist, stimmt die Liste der offenen Posten nicht.</p>" +
          '<div class="table-wrap"><table><thead><tr><th>Nr.</th><th>Datum</th><th>Beleg</th>' +
          '<th>Geschäftspartner</th><th style="text-align:right">nicht zugeordnet</th><th></th>' +
          "</tr></thead><tbody>" +
          o.nichtZugeordnet.map((z) => "<tr>" +
            '<td class="mono">' + h(z.journalNr) + "</td><td>" + fmtDate(z.datum) + "</td>" +
            "<td>" + h(z.belegnummer) + "</td><td>" + h(z.partner || "–") + "</td>" +
            '<td style="text-align:right;white-space:nowrap">' + fmtEuro(z.offenCent, true) + "</td>" +
            "<td>" + (darfBuchen()
              ? '<button class="ghost sm" data-zuordnen="' + h(z.id) + '">Rechnung zuordnen</button>' : "") +
            "</td></tr>").join("") + "</tbody></table></div></div>"
        : "") +

      '<div class="card"><h2>Offene Rechnungen</h2>' +
      '<div class="row" style="margin-bottom:12px">' +
      '<div class="field"><label for="opQ">Suche</label>' +
      '<input type="search" id="opQ" placeholder="Belegnummer, Partner…"></div>' +
      '<div class="field narrow"><label for="opTyp">Art</label><select id="opTyp">' +
      '<option value="">alle</option><option value="Ausgangsrechnung">Forderungen</option>' +
      '<option value="Eingangsrechnung">Verbindlichkeiten</option></select></div>' +
      '<div class="field narrow"><label for="opFaellig">Fälligkeit</label><select id="opFaellig">' +
      '<option value="">alle</option><option value="ueber">überfällig</option>' +
      '<option value="ueber30">über 30 Tage überfällig</option></select></div>' +
      '</div><div id="opTbl"></div></div>';

    const zeichnen = () => {
      const q = (el("opQ").value || "").toLowerCase();
      const typ = el("opTyp").value, faellig = el("opFaellig").value;
      let zeilen = o.posten;
      if (typ) zeilen = zeilen.filter((p) => p.art === typ);
      if (faellig === "ueber") zeilen = zeilen.filter((p) => p.tageOffen > 0);
      if (faellig === "ueber30") zeilen = zeilen.filter((p) => p.tageOffen > 30);
      if (q) zeilen = zeilen.filter((p) => (p.belegnummer + " " + (p.partner || "") + " " +
        p.buchungstext).toLowerCase().includes(q));

      el("opTbl").innerHTML = zeilen.length
        ? '<div class="table-wrap"><table><thead><tr><th>Nr.</th><th>Beleg</th><th>Datum</th>' +
          '<th>Fällig</th><th>Geschäftspartner</th><th style="text-align:right">Rechnung</th>' +
          '<th style="text-align:right">bezahlt</th><th style="text-align:right">offen</th><th></th>' +
          "</tr></thead><tbody>" +
          zeilen.map((p) => {
            const ueber = p.tageOffen > 0;
            return "<tr>" +
              '<td class="mono">' + h(p.journalNr) + "</td>" +
              "<td>" + h(p.belegnummer) + (p.art === "Eingangsrechnung"
                ? ' <span class="pill neutral">Eingang</span>' : "") + "</td>" +
              "<td>" + fmtDate(p.datum) + "</td>" +
              "<td>" + (p.faelligAm ? fmtDate(p.faelligAm) : "–") +
                (ueber ? '<br><span class="pill danger">' + p.tageOffen + " Tage</span>" : "") + "</td>" +
              "<td>" + h(p.partner || "–") + "</td>" +
              '<td style="text-align:right;white-space:nowrap">' + fmtEuro(p.bruttoCent, true) + "</td>" +
              '<td style="text-align:right;white-space:nowrap">' +
                (p.ausgeglichenCent ? fmtEuro(p.ausgeglichenCent, true) : "–") + "</td>" +
              '<td style="text-align:right;white-space:nowrap;font-weight:600">' +
                fmtEuro(p.offenCent, true) + "</td>" +
              '<td><button class="ghost sm" data-posten="' + h(p.id) + '">Ansehen</button></td></tr>';
          }).join("") + "</tbody></table></div>"
        : '<div class="empty">Keine offenen Posten' + (q || typ || faellig ? " mit diesen Merkmalen" : "") + ".</div>";

      document.querySelectorAll("[data-posten]").forEach((b) => b.addEventListener("click", async () => {
        const alle = (await apiJson("/buchhaltung/belege")).wert || [];
        belegDialog(alle.find((x) => String(x.id) === String(b.dataset.posten)));
      }));
    };
    ["opQ", "opTyp", "opFaellig"].forEach((id) => el(id).addEventListener("input", zeichnen));
    zeitraumBinden(() => render());
    zeichnen();

    document.querySelectorAll("[data-zuordnen]").forEach((b) => b.addEventListener("click", () =>
      ausgleichDialog(o.nichtZugeordnet.find((z) => String(z.id) === String(b.dataset.zuordnen)), o.posten)));
  };



  /* ======================================================== Rechnungen */

  /**
   * Ausgangsrechnungen schreiben.
   *
   * Ein Entwurf ist keine Rechnung: Er hat keine Nummer, taucht in keiner
