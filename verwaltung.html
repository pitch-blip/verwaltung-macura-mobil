   * Auswertung auf und ändert keinen Saldo. Erst das Festschreiben vergibt die
   * Nummer und bucht — und ab da ist nichts mehr zu ändern.
   */
  VIEWS.rechnungen = async function (v) {
    if (!buchBereit(v, "Rechnungen",
      "Ausgangsrechnungen schreiben, drucken und buchen.",
      darfBuchen() ? '<button id="neueRechnung">Rechnung schreiben</button>' : "")) return;
    if (el("neueRechnung")) el("neueRechnung").addEventListener("click", () => go("rechnung", "neu"));

    const liste = (await apiJson("/buchhaltung/rechnungen")).wert || [];
    const entwuerfe = liste.filter((r) => r.status === "Entwurf");
    const offen = liste.filter((r) => r.status === "festgeschrieben" && r.offenCent > 0);

    el("body").innerHTML =
      '<div class="stats" style="margin-bottom:16px">' +
      kachel(entwuerfe.length, "Entwürfe", entwuerfe.length ? "warn" : "") +
      kachel(liste.filter((r) => r.status === "festgeschrieben").length, "geschriebene Rechnungen", "acc") +
      kachel(fmtEuro(offen.reduce((s, r) => s + r.offenCent, 0)), "davon noch offen") +
      kachel(liste.filter((r) => r.status === "storniert").length, "storniert") +
      "</div>" +
      '<div class="card"><h2>Rechnungen</h2>' +
      '<div class="row" style="margin-bottom:12px">' +
      '<div class="field"><label for="rgQ">Suche</label>' +
      '<input type="search" id="rgQ" placeholder="Nummer, Kunde, Betreff…"></div>' +
      '<div class="field narrow"><label for="rgStatus">Stand</label><select id="rgStatus">' +
      '<option value="">alle</option><option value="Entwurf">Entwürfe</option>' +
      '<option value="festgeschrieben">geschrieben</option>' +
      '<option value="storniert">storniert</option></select></div></div>' +
      '<div id="rgTbl"></div></div>';

    const zeichnen = () => {
      const q = (el("rgQ").value || "").toLowerCase();
      const st = el("rgStatus").value;
      let zeilen = liste;
      if (st) zeilen = zeilen.filter((r) => r.status === st);
      if (q) zeilen = zeilen.filter((r) => ((r.nummer || "") + " " + (r.partner || "") + " " +
        (r.betreff || "")).toLowerCase().includes(q));

      el("rgTbl").innerHTML = !zeilen.length
        ? '<div class="empty">Keine Rechnung' + (q || st ? " mit diesen Merkmalen" : " geschrieben") + ".</div>"
        : '<div class="table-wrap"><table><thead><tr><th>Nummer</th><th>Datum</th><th>Kunde</th>' +
          '<th>Betreff</th><th style="text-align:right">Betrag</th><th>Stand</th><th></th>' +
          "</tr></thead><tbody>" +
          zeilen.map((r) => {
            const stand = r.status === "Entwurf" ? '<span class="pill warn">Entwurf</span>'
              : r.status === "storniert" ? '<span class="pill neutral">storniert</span>'
              : r.offenCent <= 0 ? '<span class="pill ok">bezahlt</span>'
              : '<span class="pill accent">offen</span>';
            return "<tr>" +
              '<td class="mono">' + h(r.nummer || "—") + "</td><td>" + fmtDate(r.datum) + "</td>" +
              "<td>" + h(r.partner || "–") + "</td><td>" + h(r.betreff || "") + "</td>" +
              '<td style="text-align:right;white-space:nowrap">' + fmtEuro(r.bruttoCent, true) +
              (r.status === "festgeschrieben" && r.bezahltCent
                ? '<br><span class="hint">' + fmtEuro(r.bezahltCent, true) + " bezahlt</span>" : "") +
              "</td><td>" + stand + "</td>" +
              '<td style="white-space:nowrap"><button class="ghost sm" data-rg="' + h(r.id) + '">' +
              (r.status === "Entwurf" ? "Bearbeiten" : "Ansehen") + "</button></td></tr>";
          }).join("") + "</tbody></table></div>";

      document.querySelectorAll("[data-rg]").forEach((b) =>
        b.addEventListener("click", () => go("rechnung", b.dataset.rg)));
    };
    ["rgQ", "rgStatus"].forEach((id) => el(id).addEventListener("input", zeichnen));
    zeichnen();
  };

  /* ----------------------------------------------------- Rechnungseditor */

  const EINHEITEN = ["", "km", "Std", "Stk", "Fahrt", "Tag", "Pauschale"];

  /**
   * Eine Rechnung schreiben.
   *
   * Eigene Ansicht statt Dialog: Positionen brauchen Platz, und eine Rechnung
   * schreibt man nicht zwischendurch in einem Fenster, das man wegklicken
   * kann.
   */
  VIEWS.rechnung = async function (v) {
    const neu = state.param === "neu";
    if (!buchBereit(v, neu ? "Rechnung schreiben" : "Rechnung", "", "")) return;

    const [vorl, kunden, konten] = await Promise.all([
      apiJson("/buchhaltung/rechnungen/vorlagen"),
      buchPartner(), buchKonten(),
    ]);
    const r = neu
      ? { status: "Entwurf", datum: new Date().toISOString().slice(0, 10), zahlungsziel: 14,
          positionen: [], partnerId: null,
          // Bei einer dauerhaften Befreiung steht der Hinweis von selbst da.
          steuerhinweis: vorl.steuerhinweisVorgabe || null }
      : await apiJson("/buchhaltung/rechnungen/" + state.param);

    const debitoren = kunden.filter((p) => p.typ === "Debitor" && (p.aktiv || p.id === r.partnerId));
    const erloese = konten.filter((k) => k.art === "Ertrag" && k.aktiv);
    const fest = r.status !== "Entwurf";
    let posten = r.positionen.map((p) => Object.assign({}, p));
    if (!posten.length) posten.push({ bezeichnung: "", mengeMille: 1000, einheit: "", einzelCent: 0,
      steuersatz: 0, konto: (erloese[0] || {}).nummer || "" });

    const kopf = () =>
      '<div class="card"><h2>' + (fest ? "Rechnung " + h(r.nummer || "") : "Rechnung") + "</h2>" +
      (fest
        ? '<div class="msg ' + (r.status === "storniert" ? "warn" : "ok") + '">' +
          (r.status === "storniert"
            ? "Diese Rechnung ist storniert: " + h(r.stornoGrund || "") +
              " Die Nummer bleibt vergeben — sie ist beim Empfänger."
            : "Festgeschrieben am " + fmtDate(r.festgeschriebenAm) + ". Geändert wird hier nichts mehr; " +
              "eine Rechnung, die heraus ist, wird storniert und neu geschrieben.") + "</div>"
        : '<div class="msg info">Ein Entwurf ist keine Rechnung: keine Nummer, keine Buchung, kein ' +
          "offener Posten. Vergeben wird die Nummer erst beim Festschreiben, damit ein verworfener " +
          "Entwurf keine Lücke reißt. Eigene Nummer eintragen oder leer lassen — dann nimmt die " +
          "Anwendung <b>" + h(vorl.naechsteNummer) + "</b>.</div>") +
      '<div class="row" style="margin-top:12px">' +
      // Die eigene Nummer steht vorn: Wer seine Rechnungen selbst schreibt,
      // trägt sie als Erstes ein.
      fieldHtml("rNummer", fest ? "Rechnungsnummer" : "Rechnungsnummer (leer = automatisch)", "text",
        fest ? (r.nummer || "") : (r.wunschnummer || ""),
        (fest ? " disabled" : "") + ' placeholder="' + h(vorl.naechsteNummer) + '"') +
      '<div class="field"><label for="rKunde">Kunde</label><select id="rKunde"' + (fest ? " disabled" : "") + ">" +
      '<option value="">— bitte wählen —</option>' +
      debitoren.map((p) => '<option value="' + h(p.id) + '"' +
        (String(p.id) === String(r.partnerId) ? " selected" : "") + ">" +
        h(p.konto + "  " + p.name) + "</option>").join("") + "</select></div>" +
      fieldHtml("rDatum", "Rechnungsdatum", "date", r.datum, fest ? " disabled" : "") +
      fieldHtml("rZiel", "Zahlungsziel (Tage)", "number", r.zahlungsziel, fest ? " disabled" : "") +
      "</div>" +
      '<div class="row" style="margin-top:10px">' +
      fieldHtml("rVon", "Leistung von", "date", r.leistungVon || "", fest ? " disabled" : "") +
      fieldHtml("rBis", "Leistung bis", "date", r.leistungBis || "", fest ? " disabled" : "") +
      fieldHtml("rBestell", "Ihr Zeichen / Auftrag", "text", r.bestellnummer || "", fest ? " disabled" : "") +
      "</div>" +
      /*
       * Kassenabrechnung: Der Zahler ist die Kasse, die Leistung bekommt der
       * Versicherte — und auf welcher Grundlage, muss die Kasse erkennen
       * können. Fehlt eines von beidem, kommt die Rechnung zurück.
       */
      '<div class="row" style="margin-top:10px">' +
      '<div class="field"><label for="rGrundlage">Leistungsgrundlage</label>' +
      '<input type="text" id="rGrundlage" list="rGrundlagen" value="' + h(r.grundlage || "") + '"' +
      (fest ? " disabled" : "") + ' placeholder="z. B. Entlastungsbetrag nach § 45b SGB XI"></div>' +
      '<datalist id="rGrundlagen">' +
      vorl.grundlagen.map((g) => '<option value="' + h(g) + '">').join("") + "</datalist>" +
      fieldHtml("rVersicherter", "Versicherte(r) — Name und Versichertennummer", "text",
        r.versicherter || "", fest ? " disabled" : "") +
      "</div>" +
      '<p class="hint" style="margin-top:6px">Beides braucht nur, wer gegenüber einer Pflegekasse ' +
      "abrechnet — dort steht es oben auf dem Blatt. Bei Selbstzahlern bleiben die Felder leer.</p>" +
      '<p class="hint" style="margin-top:6px">Der Zeitpunkt der Leistung ist Pflicht (§ 14 Abs. 4 Nr. 6 ' +
      "UStG). Entweder hier ein Zeitraum oder je Position ein Datum.</p>" +
      '<div style="margin-top:10px">' +
      fieldHtml("rBetreff", "Betreff", "text", r.betreff || "", fest ? " disabled" : "") + "</div>" +
      '<div class="row" style="margin-top:10px">' +
      fieldHtml("rBuchungstext", "Buchungstext (für die Buchhaltung, max. 60 Zeichen)", "text",
        r.buchungstext || "", (fest ? " disabled" : "") + ' maxlength="60" ' +
        'placeholder="ohne Angabe wird der Betreff genommen"') +
      '<div class="field narrow"><label for="rPreisart">Einzelpreise sind</label>' +
      '<select id="rPreisart"' + (fest ? " disabled" : "") + ">" +
      '<option value="netto"' + (r.preiseBrutto ? "" : " selected") + ">Nettobeträge</option>" +
      '<option value="brutto"' + (r.preiseBrutto ? " selected" : "") + ">Bruttobeträge</option>" +
      "</select></div></div>" +
      '<p class="hint" style="margin-top:6px">Der Buchungstext steht später im Buchungsstapel der ' +
      "Kanzlei — dort erklärt er den Vorgang. Wer eine fertige Rechnung abtippt, stellt die " +
      "Einzelpreise auf <i>Bruttobeträge</i>; die Umsatzsteuer wird dann herausgerechnet statt " +
      "aufgeschlagen.</p>" +
      '<div style="margin-top:10px">' +
      fieldHtml("rEinleitung", "Einleitung", "textarea", r.einleitung ||
        "vereinbarungsgemäß berechnen wir Ihnen die folgenden Leistungen:") + "</div>" +
      "</div>";

    const steuerteil = () =>
      '<div class="card"><h2>Umsatzsteuer</h2>' +
      '<p class="hint">Steht auf der Rechnung keine Umsatzsteuer, muss dastehen, <b>warum</b> — sonst ' +
      "ist sie formal unvollständig (§ 14 Abs. 4 Nr. 8 UStG). Welche Befreiung gilt, hängt an der " +
      "Leistung und an der Anerkennung des Betriebes; das gehört einmal mit der Kanzlei geklärt und " +
      "steht dann hier.</p>" +
      (vorl.ustArt !== "steuerpflichtig"
        ? '<div class="msg ' + (vorl.ustArt === "kleinunternehmer" ? "warn" : "info") + '">' +
          (vorl.ustArt === "kleinunternehmer"
            ? "Als Kleinunternehmer nach § 19 UStG darf keine Umsatzsteuer ausgewiesen werden. " +
              "Positionen mit 7 % oder 19 % nimmt die Anwendung nicht an."
            : "Die Umsätze sind nach § 4 UStG steuerfrei — die Positionen stehen deshalb auf 0 %. " +
              "Ein steuerpflichtiges Nebengeschäft bleibt möglich; die Selbstprüfung zeigt es dann an.") +
          "</div>"
        : "") +
      '<div id="rgSteuerwarnung"></div>' +
      '<div class="field" style="margin-top:10px"><label for="rHinweis">Hinweis auf der Rechnung</label>' +
      '<textarea id="rHinweis" rows="2"' + (fest ? " disabled" : "") + ">" +
      h(r.steuerhinweis || "") + "</textarea></div>" +
      (fest ? "" :
        '<div class="btnrow" style="margin-top:8px">' +
        vorl.steuerhinweise.filter((x) => x.text).map((x, i) =>
          '<button class="ghost sm" data-hinweis="' + i + '" title="' + h(x.text) + '">' +
          h(x.kurz || x.text.slice(0, 40)) + "</button>").join("") +
        '<button class="ghost sm" data-hinweis="leer">leeren</button></div>') +
      "</div>";

    const positionsteil = () =>
      '<div class="card"><h2>Positionen</h2><div id="rgPosten"></div>' +
      (fest ? "" : '<div class="btnrow" style="margin-top:10px">' +
        '<button class="ghost" id="rgPlus">Position hinzufügen</button></div>') +
      '<div id="rgSummen" style="margin-top:14px"></div></div>';

    el("body").innerHTML = kopf() + positionsteil() + steuerteil() +
      '<div class="card"><div class="btnrow">' +
      (fest
        ? '<button id="rgDrucken">Drucken</button>' +
          (darfBuchen() && r.status === "festgeschrieben"
            ? '<button class="danger" id="rgStorno">Stornieren</button>' : "") +
          '<button class="ghost" id="rgZurueck">Zurück zur Liste</button>'
        : (darfBuchen()
          ? '<button id="rgFest">Festschreiben und buchen</button>' +
            '<button class="ghost" id="rgSpeichern">Als Entwurf speichern</button>' +
            '<button class="ghost" id="rgVorschau">Vorschau drucken</button>' +
            (neu ? "" : '<button class="ghost danger" id="rgLoeschen">Entwurf löschen</button>')
          : "") + '<button class="ghost" id="rgZurueck">Zurück zur Liste</button>') +
      "</div></div>";

    /* -- Positionen zeichnen -- */
    const postenZeichnen = () => {
      el("rgPosten").innerHTML =
        '<div class="table-wrap"><table><thead><tr><th style="width:34px">#</th><th>Datum</th>' +
        "<th>Bezeichnung</th><th>Menge</th><th>Einheit</th><th>Einzelpreis " +
        (brutto() ? "brutto" : "netto") + "</th><th>USt</th>" +
        '<th>Erlöskonto</th><th style="text-align:right">Betrag</th><th></th></tr></thead><tbody>' +
        posten.map((p, i) => "<tr>" +
          '<td class="mono">' + (i + 1) + "</td>" +
          '<td><input type="date" data-f="datum" data-i="' + i + '" value="' + h(p.datum || "") +
            '" style="width:130px"' + (fest ? " disabled" : "") + "></td>" +
          '<td><input type="text" data-f="bezeichnung" data-i="' + i + '" value="' + h(p.bezeichnung || "") +
            '" style="min-width:220px"' + (fest ? " disabled" : "") + "></td>" +
          '<td><input type="text" inputmode="decimal" data-f="menge" data-i="' + i + '" value="' +
            h(((p.mengeMille || 0) / 1000).toFixed(3).replace(/[.]?0+$/, "").replace(".", ",")) +
            '" style="width:80px;text-align:right"' + (fest ? " disabled" : "") + "></td>" +
          "<td><select data-f=\"einheit\" data-i=\"" + i + '" style="width:100px"' + (fest ? " disabled" : "") + ">" +
            EINHEITEN.map((x) => '<option value="' + h(x) + '"' +
              (x === (p.einheit || "") ? " selected" : "") + ">" + h(x || "—") + "</option>").join("") +
            "</select></td>" +
          '<td><input type="text" inputmode="decimal" data-f="einzel" data-i="' + i + '" value="' +
            h(((p.einzelCent || 0) / 100).toFixed(2).replace(".", ",")) +
            '" style="width:90px;text-align:right"' + (fest ? " disabled" : "") + "></td>" +
          "<td><select data-f=\"steuersatz\" data-i=\"" + i + '" style="width:80px"' + (fest ? " disabled" : "") + ">" +
            [0, 7, 19].map((x) => '<option value="' + x + '"' +
              (x === (p.steuersatz || 0) ? " selected" : "") + ">" + x + " %</option>").join("") +
            "</select></td>" +
          "<td><select data-f=\"konto\" data-i=\"" + i + '" style="width:150px"' + (fest ? " disabled" : "") + ">" +
            erloese.map((k) => '<option value="' + h(k.nummer) + '"' +
              (k.nummer === p.konto ? " selected" : "") + ">" + h(k.nummer + " " + k.bezeichnung) +
              "</option>").join("") + "</select></td>" +
          '<td style="text-align:right;white-space:nowrap" id="rgNetto' + i + '">' +
            fmtEuro(Math.round(((p.mengeMille || 0) * (p.einzelCent || 0)) / 1000), true) + "</td>" +
          "<td>" + (fest || posten.length < 2 ? "" :
            '<button class="ghost sm" data-weg="' + i + '">✕</button>') + "</td></tr>").join("") +
        "</tbody></table></div>";

      if (!fest) {
        /*
         * Beim Tippen wird nur gerechnet, nicht neu gezeichnet. Die Tabelle
         * mitten aus einem Eingabefeld heraus neu aufzubauen kostet den
         * Schreibstand und bricht im Browser ab - das Feld, aus dem das
         * Ereignis kommt, gibt es danach nicht mehr.
         */
        el("rgPosten").querySelectorAll("input[data-f], select[data-f]").forEach((n) => {
          const uebernehmen = () => {
            const i = Number(n.dataset.i), f = n.dataset.f;
            const zahl = (t) => Number(String(t).replace(/\./g, "").replace(",", ".")) || 0;
            if (f === "menge") posten[i].mengeMille = Math.round(zahl(n.value) * 1000);
            else if (f === "einzel") posten[i].einzelCent = Math.round(zahl(n.value) * 100);
            else if (f === "steuersatz") posten[i].steuersatz = Number(n.value);
            else posten[i][f] = n.value;
            const zelle = el("rgNetto" + i);
            if (zelle) {
              zelle.textContent = fmtEuro(Math.round(
                ((posten[i].mengeMille || 0) * (posten[i].einzelCent || 0)) / 1000), true);
            }
            summenZeichnen();
          };
          n.addEventListener(n.tagName === "SELECT" ? "change" : "input", uebernehmen);
        });
        el("rgPosten").querySelectorAll("[data-weg]").forEach((b) =>
          b.addEventListener("click", () => { posten.splice(Number(b.dataset.weg), 1); postenZeichnen(); }));
      }
      summenZeichnen();
    };

    /*
     * Die Summe wird hier nur angezeigt. Gerechnet wird sie beim Speichern
     * noch einmal auf dem Server — was auf dem Papier steht, soll aus
     * derselben Quelle kommen wie das, was gebucht wird.
     */
    const summenZeichnen = () => {
      const istBrutto = brutto();
      const nachSatz = new Map();
      for (const p of posten) {
        const zeile = Math.round(((p.mengeMille || 0) * (p.einzelCent || 0)) / 1000);
        nachSatz.set(p.steuersatz || 0, (nachSatz.get(p.steuersatz || 0) || 0) + zeile);
      }
      // Je Steuersatz aus der Summe — dieselbe Regel wie auf dem Server, sonst
      // stünde auf dem Schirm etwas anderes als auf dem Papier.
      const saetze = Array.from(nachSatz.entries()).sort((a, b) => a[0] - b[0])
        .map(([sa, summe]) => {
          const st = istBrutto ? Math.round((summe * sa) / (100 + sa)) : Math.round((summe * sa) / 100);
          return { satz: sa, netto: istBrutto ? summe - st : summe, steuer: st };
        });
      const netto = saetze.reduce((s, x) => s + x.netto, 0);
      const steuer = saetze.reduce((s, x) => s + x.steuer, 0);
      const warn = el("rgSteuerwarnung");
      if (warn) {
        const mitSteuer = posten.filter((p) => p.steuersatz);
        warn.innerHTML = mitSteuer.length && vorl.ustArt === "steuerfrei"
          ? '<div class="msg warn">' + mitSteuer.length + " Position(en) weisen Umsatzsteuer aus, " +
            "obwohl die Umsätze nach § 4 UStG befreit sind. Bei einem steuerpflichtigen " +
            "Nebengeschäft ist das richtig — sonst bitte auf 0 % stellen.</div>"
          : "";
      }
      el("rgSummen").innerHTML = '<table style="margin-left:auto;min-width:320px"><tbody>' +
        '<tr><td>Nettobetrag</td><td style="text-align:right">' + fmtEuro(netto, true) + "</td></tr>" +
        saetze.filter((x) => x.satz).map((x) =>
          "<tr><td>" + (istBrutto ? "darin enthalten: " : "zzgl. ") + x.satz +
          " % Umsatzsteuer auf " + fmtEuro(x.netto, true) + "</td>" +
          '<td style="text-align:right">' + fmtEuro(x.steuer, true) + "</td></tr>").join("") +
        '<tr><td><b>Rechnungsbetrag</b></td><td style="text-align:right"><b>' +
        fmtEuro(netto + steuer, true) + "</b></td></tr></tbody></table>";
    };

    // Die Preisart steht an der Rechnung, nicht an der Zeile - sonst ließe
    // sich eine Rechnung mischen und niemand wüsste hinterher, was gemeint war.
    function brutto() { return el("rPreisart") && el("rPreisart").value === "brutto"; }

    postenZeichnen();
    if (el("rPreisart") && !fest) el("rPreisart").addEventListener("change", postenZeichnen);

    /* -- Sammeln, was in die Rechnung soll -- */
    const sammeln = () => ({
      nummer: el("rNummer").value.trim() || null,
      buchungstext: el("rBuchungstext").value.trim() || null,
      preiseBrutto: el("rPreisart").value === "brutto",
      partnerId: el("rKunde").value || null,
      datum: el("rDatum").value,
      leistungVon: el("rVon").value || null,
      leistungBis: el("rBis").value || null,
      bestellnummer: el("rBestell").value.trim() || null,
      grundlage: el("rGrundlage").value.trim() || null,
      versicherter: el("rVersicherter").value.trim() || null,
      betreff: el("rBetreff").value.trim() || null,
      einleitung: el("rEinleitung").value.trim() || null,
      steuerhinweis: el("rHinweis").value.trim() || null,
      zahlungsziel: Number(el("rZiel").value) || 0,
      positionen: posten.filter((p) => (p.bezeichnung || "").trim()),
    });

    /*
     * Die eigene Kennung wird nach dem ersten Speichern gemerkt. Ohne das
     * legte jeder weitere Klick auf „Vorschau" oder „Festschreiben" einen
     * neuen Entwurf an - und man stünde am Ende mit fünf Entwürfen derselben
     * Rechnung da.
     */
    let kennung = neu ? null : r.id;
    const sichern = async () => {
      const d = sammeln();
      if (!d.positionen.length) throw new Error("Die Rechnung braucht mindestens eine Position mit Bezeichnung.");
      const a = await apiJson("/buchhaltung/rechnungen" + (kennung ? "/" + kennung : ""), { method: "POST",
        body: JSON.stringify(d) });
      kennung = a.id || kennung;
      return kennung;
    };

    if (!fest && darfBuchen()) {
      document.querySelectorAll("[data-hinweis]").forEach((b) => b.addEventListener("click", () => {
        el("rHinweis").value = b.dataset.hinweis === "leer" ? ""
          : vorl.steuerhinweise.filter((x) => x.text)[Number(b.dataset.hinweis)].text;
      }));
      el("rgPlus").addEventListener("click", () => {
        const letzte = posten[posten.length - 1] || {};
        posten.push({ bezeichnung: "", mengeMille: 1000, einheit: letzte.einheit || "",
          einzelCent: letzte.einzelCent || 0, steuersatz: letzte.steuersatz || 0,
          konto: letzte.konto || (erloese[0] || {}).nummer || "" });
        postenZeichnen();
      });
      el("rgSpeichern").addEventListener("click", async () => {
        try { const id = await sichern(); say("Entwurf gespeichert.", "ok"); go("rechnung", String(id)); }
        catch (e) { say(e.message, "error"); }
      });
      el("rgVorschau").addEventListener("click", async () => {
        try {
          const id = await sichern();
          const b = await apiJson("/buchhaltung/rechnungen/" + id + "/bogen");
          rechnungDrucken([b]);
        } catch (e) { say(e.message, "error"); }
      });
      el("rgFest").addEventListener("click", async () => {
        try {
          const id = await sichern();
          const b = await apiJson("/buchhaltung/rechnungen/" + id + "/bogen");
          festschreibenDialog(id, b);
        } catch (e) { say(e.message, "error"); }
      });
      if (el("rgLoeschen")) el("rgLoeschen").addEventListener("click", () =>
        modal("Entwurf löschen", null,
          '<div class="msg info">Ein Entwurf hat keine Nummer und ist nirgends gebucht — er lässt sich ' +
          "spurlos löschen. Bei einer festgeschriebenen Rechnung ginge das nicht.</div>",
          [
            { label: "Abbrechen", kind: "ghost", onClick: null },
            { label: "Löschen", kind: "danger", onClick: async () => {
              await apiJson("/buchhaltung/rechnungen/" + r.id, { method: "DELETE" });
              closeModal(); say("Entwurf gelöscht.", "ok"); go("rechnungen");
            }},
          ]));
    }
    if (el("rgDrucken")) el("rgDrucken").addEventListener("click", async () => {
      rechnungDrucken([await apiJson("/buchhaltung/rechnungen/" + r.id + "/bogen")]);
    });
    if (el("rgStorno")) el("rgStorno").addEventListener("click", () => rechnungStornoDialog(r));
    el("rgZurueck").addEventListener("click", () => go("rechnungen"));
  };

  /** Letzte Nachfrage vor dem Festschreiben — samt der Prüfung, was fehlt. */
  function festschreibenDialog(id, b) {
    const fehlt = b.fehlendeAngaben || [];
    modal("Festschreiben und buchen", b.rechnung.partner || "",
      (fehlt.length
        ? '<div class="msg error"><b>Die Rechnung ist noch nicht vollständig.</b> Eine formal ' +
          "unvollständige Rechnung kostet den Empfänger den Vorsteuerabzug und kommt zurück:<ul>" +
          fehlt.map((x) => "<li>" + h(x) + "</li>").join("") + "</ul></div>"
        : '<div class="msg info">Festschreiben vergibt die Rechnungsnummer und bucht. Danach lässt sich ' +
          "nichts mehr ändern — eine Rechnung, die heraus ist, wird storniert und neu geschrieben. " +
          "Die Nummer bleibt dann verbraucht.</div>" +
          '<table style="margin-top:10px"><tbody>' +
          "<tr><td>Nummer</td><td><b>wird jetzt vergeben</b></td></tr>" +
          "<tr><td>Kunde</td><td>" + h(b.rechnung.partner || "") + "</td></tr>" +
          "<tr><td>Betrag</td><td><b>" + h(b.summen.brutto) + "</b></td></tr>" +
          "<tr><td>Fällig am</td><td>" + fmtDate(b.rechnung.faelligAm) + "</td></tr>" +
          "</tbody></table>"),
      fehlt.length
        ? [{ label: "Zurück", kind: "ghost", onClick: null }]
        : [
          { label: "Abbrechen", kind: "ghost", onClick: null },
          { label: "Festschreiben", onClick: async () => {
            const a = await apiJson("/buchhaltung/rechnungen/" + id + "/festschreiben", { method: "POST" });
            closeModal();
            say("Rechnung " + a.nummer + " geschrieben und gebucht.", "ok");
            buchVergessen();
            go("rechnung", String(id));
          }},
        ]);
  }

  function rechnungStornoDialog(r) {
    modal("Rechnung stornieren", r.nummer,
      '<div class="msg warn">Storniert wird durch Gegenbuchung — gelöscht wird nichts. Die ' +
      "Rechnungsnummer bleibt vergeben: Sie ist beim Empfänger, und ein zweites Mal vergeben würde sie " +
      "zwei verschiedene Vorgänge bezeichnen.</div>" +
      fieldHtml("rsGrund", "Grund", "text", "", ' placeholder="z. B. Fahrt doppelt berechnet"'),
      [
        { label: "Abbrechen", kind: "ghost", onClick: null },
        { label: "Stornieren", kind: "danger", onClick: async () => {
          const grund = el("rsGrund").value.trim();
          if (!grund) return modalErr("Bitte einen Grund angeben.");
          await apiJson("/buchhaltung/rechnungen/" + r.id + "/storno", { method: "POST",
            body: JSON.stringify({ grund }) });
          closeModal(); buchVergessen(); say("Rechnung storniert.", "ok"); go("rechnung", String(r.id));
        }},
      ]);
  }

  /** Der Rechnungsbogen zum Drucken — für Firmenbriefpapier. */
  function rechnungBogenHtml(b) {
    const r = b.rechnung;
    return '<div class="brief">' +
      (b.entwurf
        ? '<div class="entwurfsvermerk">Entwurf — keine Rechnung, nicht gebucht.' +
          (r.wunschnummer ? " Vorgesehene Nummer: " + h(r.wunschnummer) + "." : " Noch ohne Nummer.") +
          "</div>"
        : "") +
      (b.storniert ? '<div class="entwurfsvermerk">Storniert am ' + fmtDate(r.storniertAm) +
        " — " + h(r.stornoGrund || "") + "</div>" : "") +
      // Die kleine Absenderzeile über dem Anschriftenfeld. Auf Briefpapier ist
      // sie eine Zeile zu viel, auf weißem Papier die Pflichtangabe.
      (b.absender ? '<div class="absenderzeile">' + h(b.absender.split("\n").join(" · ")) + "</div>" : "") +
      '<div class="anschrift">' + b.anschrift.map(h).join("\n") + "</div>" +
      '<div class="datum">' + fmtDate(r.datum) + "</div>" +
      '<div class="betreff">Rechnung' + (b.nummer ? " " + h(b.nummer) : "") +
      (r.betreff ? " — " + h(r.betreff) : "") + "</div>" +
      '<div class="kopfdaten">' +
      // Bei einer Kassenabrechnung zuerst, für wen: Zahler ist die Kasse,
      // die Leistung bekommt der Versicherte. Ohne beides ist die Rechnung
      // dort nicht zuzuordnen und kommt zurück.
      (b.versicherter ? "<b>Versicherte(r): " + h(b.versicherter) + "</b><br>" : "") +
      (b.grundlage ? "Leistung: " + h(b.grundlage) + "<br>" : "") +
      (b.leistungszeitraum ? "Leistungszeitraum: " + h(b.leistungszeitraum) + "<br>" : "") +
      (r.bestellnummer ? "Ihr Zeichen: " + h(r.bestellnummer) + "<br>" : "") +
      (r.ustid ? "Ihre USt-IdNr.: " + h(r.ustid) + "<br>" : "") +
      "</div>" +
      '<div class="anrede">Sehr geehrte Damen und Herren,</div>' +
      (r.einleitung ? "<p>" + h(r.einleitung) + "</p>" : "") +
      '<table><thead><tr><th>Pos.</th>' + (b.mitDatum ? "<th>Datum</th>" : "") +
      '<th>Leistung</th><th class="z">Menge</th>' +
      '<th class="z">Einzel</th><th class="z">USt</th><th class="z">Betrag</th></tr></thead><tbody>' +
      b.zeilen.map((z) => "<tr><td>" + z.pos + "</td>" + (b.mitDatum ? "<td>" + h(z.datum) + "</td>" : "") +
        "<td>" + h(z.bezeichnung) + '</td><td class="z">' + h(z.menge + (z.einheit ? " " + z.einheit : "")) +
        '</td><td class="z">' + h(z.einzel) + '</td><td class="z">' + h(z.steuersatz) +
        '</td><td class="z">' + h(z.netto) + "</td></tr>").join("") +
      /*
       * Bei Bruttopreisen stehen in den Zeilen schon die Endbeträge — dann
       * kommt zuerst die Summe und die enthaltene Steuer darunter. Ein
       * "Nettobetrag" über Zeilen, die brutto sind, ergäbe eine Summe, die
       * sich nicht nachrechnen lässt.
       */
      (b.preiseBrutto
        ? '<tr class="summe"><td colspan="' + (b.mitDatum ? 6 : 5) + '">Rechnungsbetrag</td>' +
          '<td class="z">' + h(b.summen.brutto) + "</td></tr>" +
          b.summen.saetze.filter((x) => x.satz).map((x) =>
            '<tr><td colspan="' + (b.mitDatum ? 6 : 5) + '">' + h(x.beschriftung) +
            '</td><td class="z">' + h(x.steuer) + "</td></tr>").join("")
        : '<tr class="zwischensumme"><td colspan="' + (b.mitDatum ? 6 : 5) + '">Nettobetrag</td>' +
          '<td class="z">' + h(b.summen.netto) + "</td></tr>" +
          b.summen.saetze.filter((x) => x.satz).map((x) =>
            '<tr><td colspan="' + (b.mitDatum ? 6 : 5) + '">' + h(x.beschriftung) +
            '</td><td class="z">' + h(x.steuer) + "</td></tr>").join("") +
          '<tr class="summe"><td colspan="' + (b.mitDatum ? 6 : 5) + '">Rechnungsbetrag</td>' +
          '<td class="z">' + h(b.summen.brutto) + "</td></tr>") +
      "</tbody></table>" +
      (r.steuerhinweis ? '<p class="steuerhinweis">' + h(r.steuerhinweis) + "</p>" : "") +
      "<p>Bitte überweisen Sie den Rechnungsbetrag bis zum <b>" + fmtDate(r.faelligAm) + "</b>" +
      (b.nummer ? " unter Angabe der Rechnungsnummer " + h(b.nummer) : "") + ".</p>" +
      (r.schluss ? "<p>" + h(r.schluss) + "</p>" : "") +
      (b.zahlungsdaten ? '<div class="fuss">' + h(b.zahlungsdaten) + "</div>" : "") +
      '<div class="fuss">' + (b.steuernummer ? "Steuernummer: " + h(b.steuernummer) : "") +
      (b.ustid ? (b.steuernummer ? " · " : "") + "USt-IdNr.: " + h(b.ustid) : "") + "</div>" +
      '<p style="margin-top:8mm">Mit freundlichen Grüßen</p>' +
      (b.unterzeichner ? '<p style="margin-top:10mm">' + h(b.unterzeichner) + "</p>" : "") +
      "</div>";
  }

  function rechnungDrucken(bogen) {
    el("druckbogen").innerHTML = bogen.map(rechnungBogenHtml).join("");
    window.print();
  }

  /* ========================================================== Mahnwesen */

  /**
   * Mahnwesen.
   *
   * Die Ansicht zeigt drei Dinge nebeneinander: was gemahnt werden kann, was
   * gemahnt wurde und was daraus geworden ist. Vorgeschlagen wird viel,
   * verschickt wird nichts von selbst — jeder Brief braucht einen Klick, und
   * jeder Klick ist hinterher nachvollziehbar.
   */
  VIEWS.mahnwesen = async function (v) {
    if (!buchBereit(v, "Mahnwesen",
      "Überfällige Forderungen anmahnen — und festhalten, was wann gemahnt wurde.",
      darfBuchen() ? '<button class="ghost" id="mwStufen">Mahnstufen und Brieftext</button>' : "")) return;

    const stichtag = zeitraum().bis;
    const [vs, ml] = await Promise.all([
      apiJson("/buchhaltung/mahnwesen/vorschlaege?stichtag=" + stichtag),
      apiJson("/buchhaltung/mahnungen"),
    ]);
    const mahnungen = ml.wert || [];
    const offeneMahnungen = mahnungen.filter((m) => m.status === "offen");

    /*
     * Fehlt ein Basiszinssatz, steht das ganz oben — nicht unten als Fußnote.
     * Eine Zinsforderung, die auf einem veralteten Satz beruht, ist schlimmer
     * als gar keine: Sie wird bestritten, und dann steht die ganze Mahnung
     * infrage.
     */
    const fehlendeSaetze = vs.basiszins.luecken.length ? vs.basiszins.luecken
      : vs.basiszins.fehlend;
    const zinsWarnung = fehlendeSaetze.length
      ? '<div class="card" style="border-color:var(--warn)"><h2>Basiszinssatz fehlt</h2>' +
        '<p class="hint">Verzugszinsen sind neun Prozentpunkte über dem Basiszinssatz nach § 247 BGB ' +
        "(bei Verbrauchern fünf). Der Satz wird von der Deutschen Bundesbank zum 1. Januar und zum " +
        "1. Juli bekanntgegeben. Für " +
        h(fehlendeSaetze.map((f) => f.slice(8, 10) + "." + f.slice(5, 7) + "." + f.slice(0, 4)).join(", ")) +
        " ist hier keiner hinterlegt. Gerechnet wird deshalb mit dem letzten bekannten Satz — " +
        "die betroffenen Vorschläge sind gekennzeichnet.</p>" +
        (darfBuchen()
          ? '<div class="row" style="margin-top:12px;align-items:flex-end">' +
            '<div class="field narrow"><label for="bzAb">gültig ab</label><select id="bzAb">' +
            fehlendeSaetze.map((f) => '<option value="' + h(f) + '">' + h(f.slice(8, 10) + "." +
              f.slice(5, 7) + "." + f.slice(0, 4)) + "</option>").join("") + "</select></div>" +
            '<div class="field narrow"><label for="bzSatz">Basiszinssatz in Prozent</label>' +
            '<input type="text" id="bzSatz" placeholder="z. B. 1,27" inputmode="decimal"></div>' +
            '<div class="field narrow"><button id="bzSpeichern">Eintragen</button></div></div>'
          : "") +
        "</div>"
      : "";

    const summe = vs.summe;
    el("body").innerHTML = zeitraumHtml() +
      '<p class="hint" style="margin:-6px 0 14px">Stichtag ist das Ende des gewählten Zeitraums: ' +
      fmtDate(stichtag) + ". Zinsen und Fristen werden auf diesen Tag gerechnet.</p>" +
      zinsWarnung +
      '<div class="stats" style="margin-bottom:16px">' +
      kachel(summe.anzahl, "Mahnungen vorgeschlagen", summe.anzahl ? "warn" : "") +
      kachel(fmtEuro(summe.forderungCent), "überfällige Forderungen") +
      kachel(fmtEuro(summe.zinsenCent), "Verzugszinsen") +
      kachel(offeneMahnungen.length, "Mahnungen laufen") +
      "</div>" +
      '<div id="mwVorschlaege"></div>' +
      (vs.uebergangen.length
        ? '<div class="card"><details><summary class="hint" style="cursor:pointer">' +
          vs.uebergangen.length + " überfällige Rechnung(en) werden nicht vorgeschlagen — warum?</summary>" +
          '<div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Beleg</th>' +
          '<th>Geschäftspartner</th><th style="text-align:right">offen</th><th>Grund</th>' +
          "</tr></thead><tbody>" +
          vs.uebergangen.map((u) => "<tr><td>" + h(u.belegnummer) + "</td><td>" + h(u.partner || "–") +
            '</td><td style="text-align:right;white-space:nowrap">' + fmtEuro(u.offenCent, true) +
            "</td><td>" + h(u.grund) + "</td></tr>").join("") +
          "</tbody></table></div></details></div>"
        : "") +
      (vs.verjaehrung.length
        ? '<div class="card" style="border-color:var(--danger)"><h2>Verjährung droht</h2>' +
          '<p class="hint">Die Regelverjährung beträgt drei Jahre, gerechnet ab dem Schluss des Jahres, ' +
          "in dem die Forderung entstanden ist (§§ 195, 199 BGB). Eine Mahnung hemmt sie <b>nicht</b> — " +
          "dafür braucht es einen Mahnbescheid oder ein Anerkenntnis. Für Forderungen gegen " +
          "Sozialleistungsträger gelten teils andere Fristen; das gehört vor den Jahreswechsel mit der " +
          "Kanzlei besprochen.</p>" +
          '<div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Beleg</th><th>Datum</th>' +
          '<th>Geschäftspartner</th><th style="text-align:right">offen</th><th>verjährt zum</th>' +
          "</tr></thead><tbody>" +
          vs.verjaehrung.map((x) => "<tr><td>" + h(x.belegnummer) + "</td><td>" + fmtDate(x.datum) +
            "</td><td>" + h(x.partner || "–") + '</td><td style="text-align:right;white-space:nowrap">' +
            fmtEuro(x.offenCent, true) + "</td><td>" + fmtDate(x.verjaehrtZum) + "</td></tr>").join("") +
          "</tbody></table></div></div>"
        : "") +
      '<div class="card"><h2>Erstellte Mahnungen</h2>' +
      '<div class="msg info" style="margin-bottom:12px">Eine Mahnung ist <b>keine Buchung</b>. ' +
      "Mahnkosten und Verzugszinsen werden erst erfasst, wenn sie tatsächlich bezahlt werden — sonst " +
      "stünden Forderungen in der Bilanz, die zum größten Teil nie kommen.</div>" +
      '<div id="mwListe"></div></div>';

    /* -- Vorschläge -- */
    const vorschlaegeZeichnen = () => {
      el("mwVorschlaege").innerHTML = !vs.vorschlaege.length
        ? '<div class="card"><div class="empty">Nichts zu mahnen. Entweder ist alles bezahlt, oder die ' +
          "Wartezeit der nächsten Mahnstufe ist noch nicht erreicht.</div></div>"
        : '<div class="card"><h2>Mahnvorschläge</h2>' +
          '<p class="hint" style="margin-bottom:12px">Je Zahler und Mahnstufe ein Brief. Wer Rechnungen ' +
          "in zwei Stufen hat, bekommt zwei — sonst würde eine Rechnung stillschweigend höhergestuft, " +
          "die das noch nicht verdient hat.</p>" +
          vs.vorschlaege.map((g, i) =>
            '<div style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px">' +
            '<label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">' +
            '<input type="checkbox" class="mwWahl" data-i="' + i + '" checked ' +
            'style="margin-top:3px;width:15px;height:15px">' +
            "<span style=\"flex:1\"><b>" + h(g.partner) + '</b> <span class="mono hint">' + h(g.partnerKonto) +
            '</span> <span class="pill ' + (g.stufe >= 3 ? "danger" : g.stufe === 2 ? "warn" : "neutral") +
            '">' + h(g.stufeName) + "</span>" +
            (g.verbraucher ? ' <span class="pill neutral">Verbraucher</span>' : "") +
            '<br><span class="hint">' + g.positionen.length + " Rechnung(en) · Frist bis " +
            fmtDate(g.fristAm) + "</span></span>" +
            '<span style="text-align:right;white-space:nowrap"><b>' + fmtEuro(g.summeCent) + "</b>" +
            '<br><span class="hint">' + fmtEuro(g.forderungCent, true) + " Forderung" +
            (g.zinsenCent ? " + " + fmtEuro(g.zinsenCent, true) + " Zinsen" : "") +
            (g.gebuehrCent ? " + " + fmtEuro(g.gebuehrCent, true) + " Kosten" : "") +
            "</span></span></label>" +
            (!g.anschriftVollstaendig
              ? '<div class="msg warn" style="margin-top:10px">Bei diesem Geschäftspartner fehlt die ' +
                "Anschrift. Der Brief lässt sich erstellen, aber nicht adressieren — bitte unter " +
                "Geschäftspartner nachtragen.</div>"
              : "") +
            (g.zinsUnsicher
              ? '<div class="msg warn" style="margin-top:10px">Die Zinsen beruhen zum Teil auf einem ' +
                "fortgeschriebenen Basiszinssatz (" +
                h(g.fehlendeZinssaetze.map((f) => f.slice(5, 7) + "/" + f.slice(0, 4)).join(", ")) +
                "). Bitte oben eintragen, bevor der Brief hinausgeht.</div>"
              : "") +
            '<div class="sammelliste" style="margin-top:10px">' +
            g.positionen.map((p) => "<div><span>" + h(p.belegnummer) +
              (p.teilbezahlt ? ' <span class="pill neutral">teilbezahlt</span>' : "") +
              "</span><span>fällig " + fmtDate(p.faelligAm || p.datum) + " · " + p.tageOffen + " Tage</span>" +
              "<span>" + fmtEuro(p.offenCent, true) +
              (p.zinsCent ? " + " + fmtEuro(p.zinsCent, true) + " Zins" : "") + "</span></div>").join("") +
            "</div></div>").join("") +
          (darfBuchen()
            ? '<div class="btnrow"><button id="mwErstellen">Ausgewählte Mahnungen erstellen</button>' +
              '<button class="ghost" id="mwKeine">Auswahl aufheben</button></div>'
            : '<div class="msg info">Ihre Rolle darf Mahnungen ansehen, aber nicht erstellen.</div>') +
          "</div>";

      if (el("mwKeine")) el("mwKeine").addEventListener("click", () =>
        document.querySelectorAll(".mwWahl").forEach((c) => { c.checked = false; }));
      if (el("mwErstellen")) el("mwErstellen").addEventListener("click", mahnungenErstellen);
    };

    async function mahnungenErstellen() {
      const gewaehlt = Array.from(document.querySelectorAll(".mwWahl"))
        .filter((c) => c.checked).map((c) => vs.vorschlaege[Number(c.dataset.i)]);
      if (!gewaehlt.length) return say("Nichts ausgewählt.", "warn");

      const ohneAnschrift = gewaehlt.filter((g) => !g.anschriftVollstaendig);
      modal("Mahnungen erstellen", gewaehlt.length + " Brief(e)",
        '<div class="msg info">Erstellt werden ' + gewaehlt.length + " Mahnung(en) über zusammen " +
        fmtEuro(gewaehlt.reduce((s, g) => s + g.summeCent, 0)) + ". Gerechnet wird beim Anlegen noch " +
        "einmal neu: Was inzwischen bezahlt wurde, fällt heraus.</div>" +
        (ohneAnschrift.length
          ? '<div class="msg warn">Bei ' + ohneAnschrift.length + " Empfänger(n) fehlt die Anschrift: " +
            h(ohneAnschrift.map((g) => g.partner).join(", ")) + ".</div>"
          : "") +
        '<div class="sammelliste" style="margin-top:10px">' +
        gewaehlt.map((g) => "<div><span>" + h(g.partner) + "</span><span>" + h(g.stufeName) +
          "</span><span>" + fmtEuro(g.summeCent, true) + "</span></div>").join("") + "</div>",
        [
          { label: "Abbrechen", kind: "ghost", onClick: null },
          { label: "Erstellen", onClick: async () => {
            const a = await apiJson("/buchhaltung/mahnwesen/erstellen", { method: "POST",
              body: JSON.stringify({ stichtag,
                auswahl: gewaehlt.map((g) => ({ partnerId: g.partnerId, stufe: g.stufe,
                  rechnungIds: g.positionen.map((p) => p.rechnungId) })) }) });
            closeModal();
            say(a.angelegt.length + " Mahnung(en) erstellt" +
              (a.abgelehnt.length ? ", " + a.abgelehnt.length + " nicht mehr mahnfähig" : "") + ".",
              a.abgelehnt.length ? "warn" : "ok");
            await render();
          }},
        ]);
    }

    /* -- Erstellte Mahnungen -- */
    const listeZeichnen = () => {
      el("mwListe").innerHTML = !mahnungen.length
        ? '<div class="empty">Noch keine Mahnung erstellt.</div>'
        : '<div class="btnrow" style="margin-bottom:10px">' +
          (offeneMahnungen.length
            ? '<button class="ghost" id="mwAlleDrucken">Alle laufenden drucken (' +
              offeneMahnungen.length + ")</button>"
            : "") + "</div>" +
          '<div class="table-wrap"><table><thead><tr><th>Nummer</th><th>Datum</th><th>Empfänger</th>' +
          '<th>Stufe</th><th style="text-align:right">Betrag</th><th>Frist</th><th>Stand</th><th></th>' +
          "</tr></thead><tbody>" +
          mahnungen.map((m) => {
            const stand = m.status === "zurückgenommen"
              ? '<span class="pill neutral">zurückgenommen</span>'
              : m.vollBezahlt ? '<span class="pill ok">bezahlt</span>'
              : m.status === "erledigt" ? '<span class="pill neutral">erledigt</span>'
              : m.fristAbgelaufen ? '<span class="pill danger">Frist abgelaufen</span>'
              : '<span class="pill warn">läuft</span>';
            return "<tr>" +
              '<td class="mono">' + h(m.nummer) + "</td><td>" + fmtDate(m.datum) + "</td>" +
              "<td>" + h(m.partner) + "</td>" +
              "<td>" + h(m.stufe) + (m.zinsUnsicher
                ? ' <span class="pill warn" title="mit fortgeschriebenem Basiszinssatz gerechnet">Zins</span>'
                : "") + "</td>" +
              '<td style="text-align:right;white-space:nowrap">' + fmtEuro(m.summeCent, true) +
              (m.bezahltCent ? '<br><span class="hint">' + fmtEuro(m.bezahltCent, true) +
                " bezahlt</span>" : "") + "</td>" +
              "<td>" + fmtDate(m.fristAm) + "</td><td>" + stand + "</td>" +
              '<td style="white-space:nowrap"><button class="ghost sm" data-brief="' + h(m.id) +
              '">Brief</button>' +
              (darfBuchen() && m.status === "offen"
                ? ' <button class="ghost sm" data-erledigt="' + h(m.id) + '">Erledigt</button>' +
                  ' <button class="ghost sm" data-zurueck="' + h(m.id) + '">Zurücknehmen</button>'
                : "") + "</td></tr>";
          }).join("") + "</tbody></table></div>";

      document.querySelectorAll("[data-brief]").forEach((b) => b.addEventListener("click", () =>
        briefDialog(b.dataset.brief)));
      document.querySelectorAll("[data-erledigt]").forEach((b) => b.addEventListener("click", () =>
        erledigtDialog(mahnungen.find((m) => String(m.id) === b.dataset.erledigt))));
      document.querySelectorAll("[data-zurueck]").forEach((b) => b.addEventListener("click", () =>
        zurueckDialog(mahnungen.find((m) => String(m.id) === b.dataset.zurueck))));
      if (el("mwAlleDrucken")) el("mwAlleDrucken").addEventListener("click", async () => {
        const briefe = [];
        for (const m of offeneMahnungen) briefe.push(await apiJson("/buchhaltung/mahnungen/" + m.id + "/brief"));
        drucken(briefe);
      });
    };

    vorschlaegeZeichnen();
    listeZeichnen();
    zeitraumBinden(() => render());
    if (el("mwStufen")) el("mwStufen").addEventListener("click", stufenDialog);
    if (el("bzSpeichern")) el("bzSpeichern").addEventListener("click", async () => {
      const satz = Number((el("bzSatz").value || "").replace(",", "."));
      if (!Number.isFinite(satz)) return say("Bitte den Satz in Prozent angeben, z. B. 1,27.", "error");
      await apiJson("/buchhaltung/mahnwesen/basiszins", { method: "POST",
        body: JSON.stringify({ gueltigAb: el("bzAb").value, satzProzent: satz }) });
      say("Basiszinssatz eingetragen.", "ok");
      await render();
    });
  };

  /** Ein Brief als Druckbogen — HTML, weil er auf Papier soll, nicht auf den Schirm. */
  function briefHtml(b) {
    const m = b.mahnung;
    return '<div class="brief">' +
      '<div class="anschrift">' + b.anschrift.map(h).join("\n") + "</div>" +
      '<div class="datum">' + fmtDate(m.datum) + "</div>" +
      '<div class="betreff">' + h(b.betreff) + "</div>" +
      '<div class="anrede">Sehr geehrte Damen und Herren,</div>' +
      "<p>" + h(b.einleitung) + "</p>" +
      "<table><thead><tr><th>Rechnung</th><th>vom</th><th>fällig</th>" +
      '<th class="z">offen</th><th class="z">Zinsen</th></tr></thead><tbody>' +
      b.zeilen.map((z) => "<tr><td>" + h(z.belegnummer) + "</td><td>" + h(z.datum) + "</td><td>" +
        h(z.faellig) + '</td><td class="z">' + h(z.offen) + '</td><td class="z">' +
        h(z.zins || "–") + "</td></tr>").join("") +
      '<tr class="summe"><td colspan="3">Gesamtbetrag' +
      (m.gebuehrCent ? " einschließlich Mahnkosten" : "") + '</td><td class="z" colspan="2">' +
      h((m.summeCent / 100).toFixed(2).replace(".", ",") + " €") + "</td></tr>" +
      "</tbody></table>" +

      return modal("Rechnung zuordnen", null,
        '<div class="msg warn">Zu dieser Zahlung gibt es keine passende offene Rechnung. ' +

        "Geschäftspartner.</div>",
        [{ label: "Schließen", kind: "ghost", onClick: null }]);

      '<div class="msg info">Die Zuordnung ändert keine Buchung — sie hält nur fest, welche Rechnung mit ' +

        { label: "Zuordnen", onClick: async () => {

  /* ======================================================== Zuordnungsregeln

     Ein Teil der Umsätze wiederholt sich Monat für Monat. Eine Regel hält die
     Entscheidung fest, die dabei ohnehin jedes Mal zu treffen wäre.
     ======================================================================== */

  VIEWS.regeln = async function (v) {
    if (!buchBereit(v, "Zuordnungsregeln",
      "Wiederkehrende Umsätze immer gleich buchen — Miete, Telefon, Versicherungen.",
      darfBuchen() ? '<button id="neuRegel">Regel anlegen</button>' : "")) return;

    const [antw, konten] = await Promise.all([apiJson("/buchhaltung/regeln"), buchKonten()]);
    const regeln = antw.wert || [];

    const merkmale = (r) => {
      const m = [];
      if (r.richtung) m.push(r.richtung);
      if (r.iban) m.push("IBAN " + r.iban);
      if (r.nameEnthaelt) m.push("Name enthält „" + r.nameEnthaelt + "“");
      if (r.zweckEnthaelt) m.push("Zweck enthält „" + r.zweckEnthaelt + "“");
      if (r.betragCent !== null && r.betragCent !== undefined) m.push("Betrag " + fmtEuro(r.betragCent));
      return m.join(" · ");
    };

    el("body").innerHTML =
      '<div class="msg info">Eine Regel <b>schlägt vor</b> — gebucht wird nach Bestätigung. ' +
      "Nur Regeln, die ausdrücklich „ohne Rückfrage“ tragen, werden von <i>Regeln anwenden</i> " +
      "in der Bankansicht selbst gebucht. Das ist ein eigener Knopf und läuft nicht beim Einlesen mit: " +
      "Was gebucht wurde, soll jemand entschieden haben.</div>" +
      '<div class="card">' + (regeln.length
        ? '<div class="table-wrap"><table><thead><tr><th>Regel</th><th>Erkennt an</th>' +
          "<th>Bucht auf</th><th>Rückfrage</th><th>Verwendet</th><th></th></tr></thead><tbody>" +
          regeln.map((r) => "<tr" + (r.aktiv ? "" : ' style="opacity:.55"') + ">" +
            "<td><b>" + h(r.name) + "</b>" + (r.aktiv ? "" : ' <span class="pill danger">aus</span>') + "</td>" +
            '<td style="max-width:34ch"><span class="hint">' + h(merkmale(r)) + "</span></td>" +
            "<td>" + (r.ziel === "Zahler"
              ? '<span class="pill accent">Zahler</span> ' + h(r.partner || "") +
                '<br><span class="hint">Rechnung entscheidet das Konto</span>'
              : '<span class="mono">' + h(r.gegenkonto) + "</span>" +
                (r.kontoBezeichnung ? '<br><span class="hint">' + h(r.kontoBezeichnung) + "</span>" : "") +
                (r.steuersatz ? ' <span class="pill neutral">' + r.steuersatz + " %</span>" : "")) + "</td>" +
            "<td>" + (r.automatisch ? '<span class="pill warn">ohne Rückfrage</span>'
              : '<span class="pill ok">schlägt vor</span>') + "</td>" +
            "<td>" + (r.treffer ? r.treffer + "×" + (r.zuletztAm
              ? '<br><span class="hint">' + fmtDate(r.zuletztAm) + "</span>" : "") : "–") + "</td>" +
            "<td>" + (darfBuchen() ? '<button class="ghost sm" data-regel="' + h(r.id) + '">Bearbeiten</button>' : "") +
            "</td></tr>").join("") + "</tbody></table></div>"
        : '<div class="empty">Noch keine Regel. Am einfachsten entstehen sie beim Zuordnen eines ' +
          "Umsatzes — dort lässt sich die Entscheidung mit einem Häkchen merken.</div>") + "</div>";

    if (el("neuRegel")) el("neuRegel").addEventListener("click", () => regelDialog(null, konten));
    document.querySelectorAll("[data-regel]").forEach((b) => b.addEventListener("click", () =>
      regelDialog(regeln.find((r) => String(r.id) === String(b.dataset.regel)), konten)));
  };

  async function regelDialog(regel, konten) {
    if (!konten) konten = await buchKonten();
    const alleZahler = await buchPartner();
    const zahler = alleZahler.filter((p) => p.aktiv)
      .map((p) => ({ id: p.id, konto: p.konto, name: p.name + " (" +
        (p.typ === "Debitor" ? "Kunde" : "Lieferant") + ")" }));
    /*
     * Ohne Vorgabe für die Richtung: „nur Ausgänge" träfe bei Gebühren und
     * Miete zu, bei Krankenkassen aber genau daneben — und eine Regel, die
     * stillschweigend die halbe Wirklichkeit ausschließt, sucht man lange.
     */
    const r = regel || { richtung: "", steuersatz: 0, aktiv: true, automatisch: false,
      ziel: "Sachkonto" };
    // Ohne Vorbelegung: Ein stillschweigend gewähltes erstes Konto der Liste
    // wäre bei einer Regel besonders folgenreich — sie bucht ja wiederholt.
    const kontoOptionen = '<option value="">— bitte wählen —</option>' +
      konten.filter((k) => k.aktiv && k.geld !== "Bank")
        .map((k) => '<option value="' + h(k.nummer) + '"' + (k.nummer === r.gegenkonto ? " selected" : "") +
          ">" + h(k.nummer + "  " + k.bezeichnung) + "</option>").join("");

    modal(regel ? "Regel bearbeiten" : "Regel anlegen", regel ? regel.name : null,
      '<div class="msg info">Angegebene Merkmale müssen <b>alle</b> zutreffen; leere werden übergangen. ' +
      "Am beständigsten ist die IBAN — Namen schreiben Banken selten zweimal gleich.</div>" +
      fieldHtml("rName", "Bezeichnung der Regel", "text", r.name || "", ' placeholder="z. B. Miete Büro"') +

      '<h3 style="margin-top:16px">Erkennt einen Umsatz an</h3>' +
      '<div class="row">' +
        fieldHtml("rRichtung", "Richtung", "select", r.richtung || "",
          [{ v: "", l: "beide" }, { v: "Eingang", l: "nur Eingänge" }, { v: "Ausgang", l: "nur Ausgänge" }]) +
        fieldHtml("rIban", "IBAN", "text", r.iban || "", ' placeholder="DE…"') +
      "</div>" +
      '<div class="row" style="margin-top:10px">' +
        fieldHtml("rName2", "Name enthält", "text", r.nameEnthaelt || "") +
        fieldHtml("rZweck", "Verwendungszweck enthält", "text", r.zweckEnthaelt || "") +
      "</div>" +
      '<div class="row" style="margin-top:10px">' +
        fieldHtml("rBetrag", "Betrag genau", "text",
          r.betragCent !== null && r.betragCent !== undefined ? fmtEuro(r.betragCent, true) : "",
          ' inputmode="decimal" placeholder="beliebig"') +
      "</div>" +
      '<div class="msg" id="rProbe" style="margin-top:10px">Wird geprüft…</div>' +

      '<h3 style="margin-top:16px">Und dann</h3>' +
      '<label class="vorschlag"><input type="radio" name="rZiel" value="Sachkonto"' +
        (r.ziel === "Zahler" ? "" : " checked") + ">" +
        "<span><b>Auf ein Sachkonto buchen</b><br>" +
        '<span class="hint">Für alles ohne Rechnung: Gebühren, Miete, Telefon, Versicherungen.' +
        "</span></span></label>" +
      '<label class="vorschlag"><input type="radio" name="rZiel" value="Zahler"' +
        (r.ziel === "Zahler" ? " checked" : "") + ">" +
        "<span><b>Einen Zahler zuordnen</b><br>" +
        '<span class="hint">Für Krankenkassen und andere, die Rechnungen begleichen. Ein festes Konto ' +
        "wäre hier falsch — was gebucht wird, entscheidet die Rechnung dahinter.</span></span></label>" +

      '<div id="rKontoFelder" style="margin-left:26px;margin-top:10px">' +
        '<div class="row">' +
        '<div class="field"><label for="rKonto">Gegenkonto</label><select id="rKonto">' +
        kontoOptionen + "</select></div>" +
        fieldHtml("rSatz", "Umsatzsteuer", "select", String(r.steuersatz || 0),
          STEUERSAETZE.map((x) => ({ v: String(x.v), l: x.l }))) +
        "</div></div>" +
      '<div id="rZahlerFelder" style="margin-left:26px;margin-top:10px;display:none">' +
        '<div class="field"><label for="rPartner">Zahler</label><select id="rPartner">' +
        '<option value="">— bitte wählen —</option>' +
        (zahler || []).map((z) => '<option value="' + h(z.id) + '"' +
          (String(z.id) === String(r.partnerId) ? " selected" : "") + ">" +
          h(z.konto + "  " + z.name) + "</option>").join("") + "</select></div>" +
        '<p class="hint" style="margin-top:6px">Danach werden dessen offene Rechnungen zur Zuordnung ' +
        "angeboten — einzeln oder als Sammelzahlung.</p></div>" +
      '<div style="margin-top:10px">' + fieldHtml("rText", "Buchungstext", "text", r.buchungstext || "",
        ' maxlength="60" placeholder="leer = Verwendungszweck des Umsatzes"') + "</div>" +

      '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">' +
      '<label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">' +
      '<input type="checkbox" id="rAuto"' + (r.automatisch ? " checked" : "") +
      ' style="margin-top:3px;width:15px;height:15px"><span><b>Ohne Rückfrage buchen</b><br>' +
      '<span class="hint">Dann bucht <i>Regeln anwenden</i> solche Umsätze selbst. Nur setzen, wo die ' +
      "Zuordnung wirklich immer dieselbe ist — bei Miete und Telefon ja, bei etwas, das mal so und mal " +
      "anders gehört, nicht.</span></span></label>" +
      '<label style="display:flex;gap:8px;align-items:center;cursor:pointer;margin-top:10px">' +
      '<input type="checkbox" id="rAktiv"' + (r.aktiv !== false ? " checked" : "") +
      ' style="width:15px;height:15px"><span>Regel ist in Kraft</span></label></div>',
      [
        { label: "Abbrechen", kind: "ghost", onClick: null },
      ].concat(regel ? [{ label: "Löschen", kind: "danger", onClick: async () => {
          await apiJson("/buchhaltung/regeln/" + regel.id, { method: "DELETE" });
          buchVergessen(); closeModal(); render(); say("Regel gelöscht.", "ok");
        }}] : []).concat([
        { label: "Speichern", onClick: async () => {
          const daten = regelDaten();
          if (daten.ziel === "Sachkonto" && !daten.gegenkonto) return modalErr("Bitte ein Gegenkonto wählen.");
          if (daten.ziel === "Zahler" && !daten.partnerId) return modalErr("Bitte einen Zahler wählen.");
          await apiJson("/buchhaltung/regeln" + (regel ? "/" + regel.id : ""),
            { method: "POST", body: JSON.stringify(daten) });
          buchVergessen(); closeModal(); render(); say("Regel gespeichert.", "ok");
        }},
      ]));

    function regelDaten() {
      const ziel = (document.querySelector('input[name="rZiel"]:checked') || {}).value || "Sachkonto";
      return {
        name: el("rName").value.trim(), richtung: el("rRichtung").value,
        iban: el("rIban").value.trim(), nameEnthaelt: el("rName2").value.trim(),
        zweckEnthaelt: el("rZweck").value.trim(),
        betragCent: el("rBetrag").value.trim() ? centAus(el("rBetrag").value) : null,
        ziel,
        gegenkonto: ziel === "Sachkonto" ? el("rKonto").value : "",
        partnerId: ziel === "Zahler" ? el("rPartner").value || null : null,
        steuersatz: Number(el("rSatz").value),
        buchungstext: el("rText").value.trim(),
        automatisch: el("rAuto").checked, aktiv: el("rAktiv").checked,
      };
    }

    /*
     * Probelauf. Eine Regel, die auf nichts passt, nützt nichts — und eine,
     * die auf alles passt, richtet Schaden an. Beides soll man sehen, bevor
     * gespeichert wird.
     */
    let probeLauf = null;
    async function probe() {
      clearTimeout(probeLauf);
      probeLauf = setTimeout(async () => {
        const feld = el("rProbe");
        if (!feld) return;
        const d = regelDaten();
        if (!d.iban && !d.nameEnthaelt && !d.zweckEnthaelt && d.betragCent === null) {
          feld.className = "msg warn";
          feld.innerHTML = "Noch kein Erkennungsmerkmal — eine solche Regel würde auf <b>jeden</b> " +
            "Umsatz passen und wird deshalb nicht gespeichert.";
          return;
        }
        try {
          const a = await apiJson("/buchhaltung/regeln/probe", { method: "POST", body: JSON.stringify(d) });
          feld.className = "msg " + (a.anzahl ? "ok" : "info");
          feld.innerHTML = a.anzahl
            ? "Trifft auf <b>" + a.anzahl + "</b> der noch offenen Umsätze zu:<div class=\"sammelliste\">" +
              a.beispiele.map((b) => "<div><span>" + h(fmtDate(b.datum)) + " " +
                h((b.beteiligter || "").slice(0, 30)) + "</span><span>" + fmtEuro(b.centBetrag, true) +
                "</span></div>").join("") + "</div>"
            : "Trifft derzeit auf keinen offenen Umsatz zu. Das kann richtig sein — die Regel greift " +
              "dann beim nächsten Kontoauszug.";
        } catch (e) { feld.className = "msg warn"; feld.textContent = e.message || String(e); }
      }, 300);
    }
    ["rRichtung", "rIban", "rName2", "rZweck", "rBetrag"].forEach((id) => {
      if (el(id)) { el(id).addEventListener("input", probe); el(id).addEventListener("change", probe); }
    });

    const zielUmschalten = () => {
      const ziel = (document.querySelector('input[name="rZiel"]:checked') || {}).value;
      el("rKontoFelder").style.display = ziel === "Zahler" ? "none" : "";
      el("rZahlerFelder").style.display = ziel === "Zahler" ? "" : "none";
    };
    document.querySelectorAll('input[name="rZiel"]').forEach((x) =>
      x.addEventListener("change", zielUmschalten));
    zielUmschalten();
    probe();
  }

  /* =========================================================================
     Start
     ========================================================================= */
  async function ichLaden() {
    state.ich = await apiJson("/me");
    state.firmaId = state.ich.firmaId;
    state.passwortWechseln = !!state.ich.passwortWechseln;
    state.ohneAnmeldung = !!state.ich.ohneAnmeldung;
  }

  /**
   * Beim Laden der Seite pruefen, ob bereits Zugriff besteht - im Einzelplatz-
   * betrieb immer, sonst bei noch gueltiger Sitzung. Erspart die Anmeldemaske
   * und haelt die Sitzung ueber ein Neuladen hinweg.
   */
  async function bestehendenZugangPruefen() {
    try {
      await ichLaden();
      state.modus = "api";
      await designLaden();
      await menuepunkteLaden();
      renderNav();
      if (state.passwortWechseln) { render(); zeigePasswortWechsel(); return true; }
      go("dashboard");
      return true;
    } catch (e) {
      state.modus = null;
      state.ich = null;
      return false;
    }
  }

  /** Meldet lokal ab, ohne den Server zu fragen — für abgelaufene Sitzungen. */
  function abmeldenLokal() {
    state.modus = null; state.ich = null; state.firmaId = null;
    state.design = null; state.passwortWechseln = false;
    invalidate();
    designAnwenden();
    renderNav();
  }

  async function doAuth() {
    if (state.modus) {
      try { if (state.modus === "api") await apiJson("/abmelden", { method: "POST" }); } catch (e) {}
      demo = null;
      abmeldenLokal();
      render();
      return;
    }
    render(); // zeigt die Anmeldemaske
  }

  async function anmeldenAusfuehren(anmeldename, passwort) {
    await login(anmeldename, passwort);
    await ichLaden();
    if (state.passwortWechseln) { renderNav(); zeigePasswortWechsel(); return; }
    await designLaden();
    await menuepunkteLaden();
    renderNav();
    go("dashboard");
    say("Angemeldet als " + state.ich.anmeldename, "ok");
  }

  /** Erzwungener Passwortwechsel: der Server laesst bis dahin nichts anderes zu. */
  function zeigePasswortWechsel() {
    modal("Passwort vergeben", "Bitte legen Sie ein eigenes Passwort fest, bevor es weitergeht.",
      '<div class="msg info">Mindestens 10 Zeichen und drei der vier Arten: Kleinbuchstaben, Großbuchstaben, Ziffern, Sonderzeichen.</div>' +
      fieldHtml("pwAlt", "Bisheriges Passwort", "password", "") +
      '<div style="margin-top:10px">' + fieldHtml("pwNeu", "Neues Passwort", "password", "") + "</div>" +
      '<div style="margin-top:10px">' + fieldHtml("pwNeu2", "Neues Passwort wiederholen", "password", "") + "</div>",
      [
        { label: "Abmelden", kind: "ghost", onClick: async () => {
          try { await apiJson("/abmelden", { method: "POST" }); } catch (e) {}
          closeModal(); abmeldenLokal(); render();
        }},
        { label: "Speichern", onClick: async () => {
          const neu = el("pwNeu").value;
          if (neu !== el("pwNeu2").value) return modalErr("Die beiden Eingaben stimmen nicht überein.");
          await apiJson("/passwort/eigen", { method: "POST",
            body: JSON.stringify({ alt: el("pwAlt").value, neu: neu }) });
          state.passwortWechseln = false;
          closeModal();
          await ichLaden();
          await designLaden();
          await menuepunkteLaden();
          renderNav();
          go("dashboard");
          say("Passwort gespeichert.", "ok");
        }},
      ]);
  }

  async function demoStarten() {
    demo = demoAufbauen();
    state.modus = "demo";
    state.ich = { anmeldename: "a.weber", name: "Anna Weber", firmen: demo.firmen, appRolle: "Administrator" };
    state.firmaId = demo.firmen[0].id;
    invalidate();
    await designLaden();
    await menuepunkteLaden();
    go("dashboard");
  }
  el("demoEnde").addEventListener("click", async () => {
    demo = null; state.modus = null; state.ich = null; state.firmaId = null;
    state.design = null; invalidate();
    designAnwenden();
    renderNav(); render();
  });

  function applyTheme() {
    const t = sGet("vw_theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
  }
  el("themeBtn").addEventListener("click", () => {
    const cur = sGet("vw_theme");
    sSet("vw_theme", cur === "dark" ? "light" : cur === "light" ? "" : "dark");
    applyTheme();
  });
  el("authBtn").addEventListener("click", doAuth);
  el("firmaSelect").addEventListener("change", async (e) => {
    const ziel = e.target.value;
    try {
      if (state.modus === "api") await apiJson("/firma/wechseln", { method: "POST", body: JSON.stringify({ firmaId: Number(ziel) }) });
      state.firmaId = state.modus === "demo" ? ziel : Number(ziel);
      invalidate();
      await designLaden();   // jede Firma hat ihr eigenes Erscheinungsbild
      await menuepunkteLaden();
      go("dashboard");
    } catch (err) {
      say(err.message || String(err), "error");
      renderNav();
    }
  });

  applyTheme();
  designAnwenden();
  renderNav();
  render();
  // Nachtraeglich pruefen, ob schon Zugriff besteht; die Anmeldemaske wird
  // dann durch die Anwendung ersetzt.
  bestehendenZugangPruefen();
})();
</script>
</body>
</html>
