<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verwaltung – maCura Mobil</title>
<style>
  :root {
    --bg: #f2f4f3; --surface: #ffffff; --surface-2: #f7f9f8;
    --border: #dde1de; --border-strong: #c3c9c4;
    --text: #1c2420; --muted: #5c655e; --faint: #8b9189;
    --accent: #1f5c63; --accent-hover: #17474d; --accent-ink: #ffffff; --accent-soft: #e2edec;
    --ok: #2f7d4f; --ok-soft: #e1efe4;
    --warn: #93611f; --warn-soft: #f6ecd9;
    --danger: #a8392f; --danger-soft: #f6e2de;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(28,36,32,.06), 0 8px 24px -12px rgba(28,36,32,.18);
    --sans: "Segoe UI", -apple-system, Roboto, Arial, sans-serif;
    --mono: "Cascadia Mono", Consolas, "SFMono-Regular", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141816; --surface: #1c2220; --surface-2: #232a27;
      --border: #313a35; --border-strong: #46504a;
      --text: #e9ebe4; --muted: #a4ab9f; --faint: #6c736a;
      --accent: #6fc3c1; --accent-hover: #8ad3d1; --accent-ink: #0d2426; --accent-soft: #1f3634;
      --ok: #7fc79a; --ok-soft: #1e3527; --warn: #d9a75c; --warn-soft: #382f1f;
      --danger: #e08b7e; --danger-soft: #3a2622;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 28px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141816; --surface: #1c2220; --surface-2: #232a27;
    --border: #313a35; --border-strong: #46504a;
    --text: #e9ebe4; --muted: #a4ab9f; --faint: #6c736a;
    --accent: #6fc3c1; --accent-hover: #8ad3d1; --accent-ink: #0d2426; --accent-soft: #1f3634;
    --ok: #7fc79a; --ok-soft: #1e3527; --warn: #d9a75c; --warn-soft: #382f1f;
    --danger: #e08b7e; --danger-soft: #3a2622;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 28px -12px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
  #app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }

  .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: -.01em; padding: 0 8px 12px; display: flex; align-items: center; gap: 8px; }
  .brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 12px; }
  .brand.mit-logo { flex-direction: column; align-items: flex-start; gap: 4px; padding-bottom: 14px; }
  .brand.mit-logo img { max-width: 100%; max-height: 62px; object-fit: contain; object-position: left; }
  .brand.mit-logo .anwendungsname { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .firma-switch { padding: 0 8px 14px; }
  .firma-switch label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; display: block; margin-bottom: 5px; }
  .navsec { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; padding: 14px 8px 5px; }
  .navitem { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 13.5px; border: none; background: none; width: 100%; text-align: left; font-family: inherit; }
  .navitem:hover { background: var(--surface-2); color: var(--text); }
  .navitem.active { background: var(--accent-soft); color: var(--accent-text, var(--accent)); font-weight: 600; }
  .navitem .ic { width: 16px; text-align: center; font-size: 13px; }
  /* Eigene Menüpunkte leicht eingerückt, damit der Unterschied zu den festen
     Einträgen sichtbar ist, ohne sie zweitrangig wirken zu lassen. */
  .navitem.eigener { padding-left: 18px; }
  .navitem.hinzufuegen { color: var(--accent-text, var(--accent)); font-weight: 600; }
  .navitem.hinzufuegen .ic { font-size: 15px; font-weight: 700; }
  .navitem.hinzufuegen:hover { background: var(--accent-soft); color: var(--accent-text, var(--accent)); }
  .sidebar-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--border); font-size: 12px; color: var(--faint); }
  .sidebar-foot .who { color: var(--muted); word-break: break-all; margin-bottom: 3px; }
  .sidebar-foot .rolle { margin-bottom: 8px; }

  main { padding: 26px 30px 70px; min-width: 0; }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 21px; margin: 0 0 3px; letter-spacing: -.01em; }
  .page-head .sub { color: var(--muted); font-size: 13px; margin: 0; max-width: 70ch; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  h3 { font-size: 13px; margin: 0 0 8px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
  .card > h2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 190px; }
  .field.narrow { min-width: 130px; flex: 0 1 170px; }
  .field label { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  input[type=text], input[type=date], input[type=email], input[type=search], input[type=file], input[type=password], textarea, select {
    padding: 7px 9px; border: 1px solid var(--border-strong); border-radius: 6px;
    font-size: 13px; font-family: inherit; width: 100%; background: var(--surface); color: var(--text);
  }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, .navitem:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { resize: vertical; }

  button { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
  button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--border-strong); font-weight: 500; }
  button.ghost:hover { background: var(--surface-2); color: var(--text); }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button.sm { padding: 4px 9px; font-size: 12px; }
  .btnrow { display: flex; gap: 7px; flex-wrap: wrap; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  tbody tr:hover { background: var(--surface-2); }
  tr:last-child td { border-bottom: none; }
  .table-wrap { overflow-x: auto; }
  .rowlink { cursor: pointer; }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok-text, var(--ok)); }
  .pill.warn { background: var(--warn-soft); color: var(--warn-text, var(--warn)); }
  .pill.danger { background: var(--danger-soft); color: var(--danger-text, var(--danger)); }
  .pill.neutral { background: var(--surface-2); color: var(--muted); }
  .pill.accent { background: var(--accent-soft); color: var(--accent-text, var(--accent)); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 16px; }
  .stat .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat.acc .n { color: var(--accent); }
  .stat.warn .n { color: var(--warn); }

  .msg { font-size: 13px; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; border: 1px solid transparent; }
  .msg.error { background: var(--danger-soft); color: var(--danger-text, var(--danger)); border-color: var(--danger); }
  .msg.info { background: var(--accent-soft); color: var(--accent-text, var(--accent)); }
  .msg.ok { background: var(--ok-soft); color: var(--ok-text, var(--ok)); }
  .msg.warn { background: var(--warn-soft); color: var(--warn-text, var(--warn)); }

  .empty { text-align: center; color: var(--muted); padding: 34px 10px; font-size: 13px; }
  .hint { font-size: 12px; color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 12px; }

  .demobar { background: var(--warn-soft); color: var(--warn-text, var(--warn)); font-size: 12.5px; font-weight: 600; padding: 7px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; grid-column: 1 / -1; }
  .demobar button { background: none; border: 1px solid currentColor; color: inherit; font-size: 11.5px; padding: 3px 9px; }
  .demobar button:hover { background: rgba(0,0,0,.06); border-color: currentColor; }

  .tree, .tree ul { list-style: none; margin: 0; padding: 0; }
  .tree ul { padding-left: 20px; margin-left: 9px; border-left: 1px dashed var(--border-strong); }
  .tree li { padding: 2px 0; }
  .tnode { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; }
  .tnode:hover { background: var(--surface-2); }
  .tnode .nm { flex: 1; min-width: 0; }
  .tnode.inactive .nm { color: var(--faint); text-decoration: line-through; }
  .tnode .acts { display: none; gap: 5px; }
  .tnode:hover .acts { display: flex; }

  .overlay { position: fixed; inset: 0; background: rgba(15,23,20,.55); display: none; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); width: 620px; max-width: 100%; max-height: 88vh; overflow-y: auto; padding: 22px; }
  .modal h3 { font-size: 16px; margin: 0 0 4px; }
  .modal .msub { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
  .modal-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }

  /* Vorschlagszeilen beim Zuordnen von Bankumsätzen: die ganze Zeile ist
     anklickbar, damit nicht das kleine Auswahlfeld getroffen werden muss. */
  .vorschlag { display: flex; gap: 10px; align-items: flex-start; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; margin-top: 7px; cursor: pointer; font-size: 13px; }
  .vorschlag:hover { background: var(--surface-2); }
  .vorschlag input { margin-top: 3px; accent-color: var(--accent); width: 15px; height: 15px; flex: none; }
  .vorschlag:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .vorschlag span { min-width: 0; }
  /* Die Rechnungen einer Sammelzahlung: schmale Aufstellung innerhalb der Zeile. */
  .sammelliste { margin-top: 6px; border-left: 2px solid var(--border-strong); padding-left: 9px; font-size: 12px; }
  .sammelliste div { display: flex; gap: 10px; justify-content: space-between; color: var(--muted); padding: 1px 0; }
  .sammelliste div span:last-child { font-variant-numeric: tabular-nums; }

  .perm-table th.chk, .perm-table td.chk { text-align: center; width: 66px; }
  .perm-table input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  .perm-table td.lbl { padding-left: 10px; }
  .perm-table td.lbl.d1 { padding-left: 28px; }
  .perm-table td.lbl.d2 { padding-left: 46px; }
  .perm-table td.lbl.d3 { padding-left: 64px; }

  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2s; } }

  .gate { max-width: 620px; margin: 60px auto; }
  /* Druck. Sichtbar ist dann ausschliesslich der Mahnbogen - der Rest der
     Anwendung hat auf Papier nichts verloren. */
  #druckbogen { display: none; }
  @media print {
    body { background: #fff; color: #000; }
    #app, .overlay { display: none !important; }
    #druckbogen { display: block; font-family: "Times New Roman", Georgia, serif; font-size: 11.5pt; line-height: 1.45; color: #000; }
    /* Die Farben und Rahmen der Anwendung haben auf Papier nichts verloren -
       und sie wuerden sonst gewinnen, weil ihre Regeln die spezielleren sind. */
    #druckbogen, #druckbogen * { color: #000 !important; background: none !important;
      box-shadow: none !important; border-radius: 0 !important; }
    .brief { page-break-after: always; padding: 0; }
    .brief:last-child { page-break-after: auto; }
    .brief .anschrift { margin-top: 45mm; white-space: pre-line; }
    .brief .datum { margin-top: 18mm; text-align: right; }
    .brief .betreff { margin-top: 12mm; font-weight: bold; }
    .brief .anrede { margin-top: 8mm; }
    .brief p { margin: 4mm 0; }
    .brief table { width: 100%; border-collapse: collapse; margin: 6mm 0; font-size: 10.5pt; }
    .brief th, .brief td { text-align: left; padding: 1.5mm 2mm; border-bottom: 0.4pt solid #000; }
    .brief td.z, .brief th.z { text-align: right; white-space: nowrap; }
    .brief tr.summe td { font-weight: bold; border-top: 0.8pt solid #000; border-bottom: none; }
    .brief .fuss { margin-top: 10mm; white-space: pre-line; }
    .brief .kopfdaten { margin-top: 4mm; font-size: 10.5pt; }
    .brief .steuerhinweis { margin-top: 4mm; font-size: 10pt; }
    .brief tr.zwischensumme td { border-top: 0.8pt solid #000; }
    .brief .entwurfsvermerk { border: 1pt solid #000 !important; padding: 2mm; text-align: center; font-weight: bold; }
    .brief .absenderzeile { margin-top: 40mm; font-size: 7.5pt; border-bottom: 0.4pt solid #000 !important;
      padding-bottom: 1mm; }
    .brief .absenderzeile + .anschrift { margin-top: 4mm; }
  }
  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .sidebar-foot { width: 100%; margin-top: 8px; }
    main { padding: 20px 16px 60px; }
    .demobar { padding: 7px 16px; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="demobar" id="demobar" style="display:none">
    <span>Demo-Modus — Beispieldaten im Arbeitsspeicher. Keine Verbindung zum Server, nichts wird gespeichert.</span>
    <button id="demoEnde">Beenden</button>
  </div>
  <aside class="sidebar">
    <div class="brand"><span class="mark">V</span><span>Verwaltung</span></div>
    <div class="firma-switch">
      <label for="firmaSelect">Firma</label>
      <select id="firmaSelect"></select>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="who" id="whoami">Nicht angemeldet</div>
      <div class="rolle" id="whorole"></div>
      <div class="btnrow">
        <button class="ghost sm" id="themeBtn" title="Design wechseln">Design</button>
        <button class="ghost sm" id="authBtn">Anmelden</button>
      </div>
    </div>
  </aside>
  <main><div id="view"></div></main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<!-- Der Mahnbrief zum Ausdrucken. Bleibt leer, bis gedruckt wird; beim Druck
     verschwindet alles andere. Gedacht ist er fuer Firmenbriefpapier. -->
<div id="druckbogen"></div>

<script>
(function () {
  "use strict";

  /* =========================================================================
     Grundlagen
     ========================================================================= */
  const RECHTE = ["Lesen", "Bearbeiten", "Versenden", "Loeschen"];
  const RECHT_LABEL = { Lesen: "Lesen", Bearbeiten: "Bearbeiten", Versenden: "Versenden", Loeschen: "Löschen" };
  const DOK_STATUS = ["Entwurf", "gueltig", "abgelaufen", "archiviert"];
  const DOK_STATUS_LABEL = { Entwurf: "Entwurf", gueltig: "gültig", abgelaufen: "abgelaufen", archiviert: "archiviert" };
  const ROLLEN = ["Kunde", "Mitarbeiter", "Bewerber", "Interessent", "Ansprechpartner"];
  const APP_ROLLEN = ["Administrator", "Geschaeftsfuehrung", "Verwaltung", "Einsatzleitung", "Mitarbeiter", "Extern"];
  const APP_ROLLE_LABEL = {
    Administrator: "Administrator", Geschaeftsfuehrung: "Geschäftsführung", Verwaltung: "Verwaltung",
    Einsatzleitung: "Einsatzleitung", Mitarbeiter: "Mitarbeiter", Extern: "Externer Benutzer",
  };
  // Muss zur Matrix im Serverbaustein passen. Steuert hier nur, was angeboten
  // wird - die verbindliche Prüfung macht ausschliesslich der Server.
  const DARF_SCHREIBEN = { Administrator: true, Verwaltung: true };
  const DARF_VERWALTEN = { Administrator: true };
  const DARF_VERSENDEN = { Administrator: true, Geschaeftsfuehrung: true, Verwaltung: true };

  const memStore = {};
  let storageOk = true;
  function sGet(k) {
    try { const v = localStorage.getItem(k); return v === null && k in memStore ? memStore[k] : v; }
    catch (e) { storageOk = false; return k in memStore ? memStore[k] : null; }
  }
  function sSet(k, v) {
    memStore[k] = v;
    try { localStorage.setItem(k, v); return true; } catch (e) { storageOk = false; return false; }
  }

  const state = {
    modus: null,          // "api" | "demo"
    passwortWechseln: false,
    ich: null,            // { mail, name, firmen: [...] }
    firmaId: null,
    view: "dashboard", param: null,
    cache: {},
    design: null,         // { farben: {hell,dunkel}, bilder: {...} }
    menuepunkte: [],      // frei konfigurierbare Einträge der Seitenleiste
  };

  /* =========================================================================
     Erscheinungsbild — Farbmatrix und Grafiken je Firma
     ========================================================================= */
  // Nur diese Rollen werden zur Auswahl gestellt. Alles Weitere (Abstufungen,
  // Schriftfarbe auf farbigen Flächen) wird daraus berechnet, damit keine
  // unlesbare Kombination entstehen kann.
  // Hausfarben Eli die Fee Seniorendienst, abgenommen aus dem Logo: Indigo
  // #2c3370 und Orange #ff6300 auf hellem, warmem Grund. Das Orange steht
  // bewusst auf "Warnung" - dort trägt es Bedeutung, statt nur Dekoration zu
  // sein, und bleibt trotzdem sichtbar.
  const FARBEN_STANDARD = {
    hell: { accent: "#2c3370", bg: "#fff8f2", surface: "#ffffff", text: "#1c2044",
            muted: "#5b5f7d", border: "#efe2d6", ok: "#2f7d4f", warn: "#ff6300", danger: "#a8392f" },
    dunkel: { accent: "#9aa4e8", bg: "#14162b", surface: "#1e2140", text: "#e9eaf4",
              muted: "#a3a7c4", border: "#333760", ok: "#7fc79a", warn: "#ff8a3d", danger: "#e08b7e" },
  };
  const BILD_PLAETZE = [
    { k: "logo", l: "Logo", h: "Links oben neben dem Namen. Kleine, breite Grafiken wirken hier am besten.", max: 256 },
    { k: "anmeldung", l: "Anmeldeseite", h: "Über dem Anmeldebereich, bevor sich jemand angemeldet hat.", max: 800 },
    { k: "dashboard", l: "Dashboard-Kopf", h: "Als Banner über den Kennzahlen der Startseite.", max: 1600 },
  ];

  function hexZuRgb(hex) {
    const m = String(hex || "").trim().replace(/^#/, "");
    const v = m.length === 3 ? m.split("").map((c) => c + c).join("") : m;
    if (!/^[0-9a-f]{6}$/i.test(v)) return null;
    return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16)];
  }
  function rgbZuHex(r) {
    return "#" + r.map((x) => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0")).join("");
  }
  function mischen(a, b, anteil) {
    const x = hexZuRgb(a), y = hexZuRgb(b);
    if (!x || !y) return a;
    return rgbZuHex(x.map((v, i) => v + (y[i] - v) * anteil));
  }
  function helligkeit(hex) {
    const r = hexZuRgb(hex);
    if (!r) return 0;
    const f = r.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * f[0] + 0.7152 * f[1] + 0.0722 * f[2];
  }
  function kontrast(a, b) {
    const l1 = helligkeit(a), l2 = helligkeit(b);
    return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
  }
  /** Schrift auf farbiger Fläche: immer die besser lesbare von hell/dunkel. */
  function schriftAuf(hex) {
    return kontrast(hex, "#ffffff") >= kontrast(hex, "#10100e") ? "#ffffff" : "#10100e";
  }

  /**
   * Schriftfarbe für Kennzeichen wie „gültig“ oder „Administrator“.
   *
   * Die gewählte Farbe kann auf ihrer eigenen gedämpften Fläche unlesbar sein -
   * helles Gelb auf hellem Gelb etwa lässt sich durch Aufhellen der Fläche nicht
   * retten, weil die Schrift selbst zu hell ist. Deshalb wird der Farbton
   * beibehalten und so weit abgedunkelt bzw. aufgehellt, bis 4,5:1 erreicht ist.
   */
  function lesbareSchrift(farbe, hintergrund) {
    const richtung = helligkeit(hintergrund) > 0.4 ? "#000000" : "#ffffff";
    let anteil = 0, ergebnis = farbe;
    while (kontrast(ergebnis, hintergrund) < 4.5 && anteil < 1) {
      anteil = Math.min(1, anteil + 0.04);
      ergebnis = mischen(farbe, richtung, anteil);
    }
    return ergebnis;
  }

  /** Leitet aus den neun gewählten Farben den vollständigen Variablensatz ab. */
  function variablenAus(f, dunkel) {
    const richtungText = dunkel ? "#ffffff" : "#000000";
    const weich = (farbe) => mischen(farbe, f.surface, dunkel ? 0.78 : 0.86);
    const aSoft = weich(f.accent), oSoft = weich(f.ok), wSoft = weich(f.warn), dSoft = weich(f.danger);
    return {
      "--bg": f.bg, "--surface": f.surface,
      "--surface-2": mischen(f.surface, f.bg, 0.55),
      "--border": f.border,
      "--border-strong": mischen(f.border, f.text, 0.28),
      "--text": f.text, "--muted": f.muted,
      "--faint": mischen(f.muted, f.bg, 0.45),
      "--accent": f.accent,
      "--accent-hover": mischen(f.accent, richtungText, 0.18),
      "--accent-ink": schriftAuf(f.accent),
      "--accent-soft": aSoft, "--accent-text": lesbareSchrift(f.accent, aSoft),
      "--ok": f.ok, "--ok-soft": oSoft, "--ok-text": lesbareSchrift(f.ok, oSoft),
      "--warn": f.warn, "--warn-soft": wSoft, "--warn-text": lesbareSchrift(f.warn, wSoft),
      "--danger": f.danger, "--danger-soft": dSoft, "--danger-text": lesbareSchrift(f.danger, dSoft),
    };
  }
  function alsRegel(vars) {
    return Object.keys(vars).map((k) => k + ":" + vars[k] + ";").join("");
  }

  /**
   * Die Farben sind fest: es sind die Hausfarben, keine Einstellung. Frueher
   * gespeicherte eigene Werte werden bewusst nicht mehr beruecksichtigt.
   */
  function farbenJetzt() {
    return {
      hell: Object.assign({}, FARBEN_STANDARD.hell),
      dunkel: Object.assign({}, FARBEN_STANDARD.dunkel),
    };
  }

  /** Schreibt die Farben als Regelsatz - für alle drei Theme-Zustände. */
  function designAnwenden(vorschau) {
    const f = vorschau || farbenJetzt();
    const hell = alsRegel(variablenAus(f.hell, false));
    const dunkel = alsRegel(variablenAus(f.dunkel, true));
    let tag = el("designVars");
    if (!tag) {
      tag = document.createElement("style");
      tag.id = "designVars";
      document.head.appendChild(tag);
    }
    tag.textContent =
      ":root{" + hell + "}" +
      '@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){' + dunkel + "}}" +
      ':root[data-theme="dark"]{' + dunkel + "}" +
      ':root[data-theme="light"]{' + hell + "}";
    bilderAnwenden();
  }

  /** Verkleinert Grafiken vor dem Speichern; SVG bleibt unverändert. */
  function bildEinlesen(datei, maxKante) {
    return new Promise((fertig, fehler) => {
      if (datei.size > 4 * 1024 * 1024) return fehler(new Error("Die Datei ist größer als 4 MB."));
      if (datei.type === "image/svg+xml") {
        const leser = new FileReader();
        leser.onload = () => fertig(leser.result);
        leser.onerror = () => fehler(new Error("Die Datei konnte nicht gelesen werden."));
        return leser.readAsDataURL(datei);
      }
      if (!/^image\//.test(datei.type)) return fehler(new Error("Bitte eine Bilddatei wählen."));
      const url = URL.createObjectURL(datei);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const f = Math.min(1, maxKante / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * f));
        c.height = Math.max(1, Math.round(img.height * f));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const durchsichtig = datei.type === "image/png" || datei.type === "image/webp";
        fertig(c.toDataURL(durchsichtig ? "image/png" : "image/jpeg", 0.88));
      };
      img.onerror = () => { URL.revokeObjectURL(url); fehler(new Error("Die Grafik konnte nicht gelesen werden.")); };
      img.src = url;
    });
  }

  function darfVerwalten() { return !!DARF_VERWALTEN[meineRolle()]; }

  function invalidate(key) {
    if (!key) { state.cache = {}; return; }
    Object.keys(state.cache).forEach((k) => { if (k.indexOf(key) === 0) delete state.cache[k]; });
    // Der Server protokolliert jede Aenderung selbst. Ohne dies zeigte die
    // Historie im Browser weiter den Stand von vorher.
    if (key !== "historie") delete state.cache.historie;
  }

  /* =========================================================================
     Anmeldung — der Browser bekommt bewusst KEIN SharePoint-Recht.
     Das Token gilt nur gegenüber dem eigenen Dienst.
     ========================================================================= */
  /**
   * Anmeldung gegen die Anwendung selbst. Die Sitzungskennung liegt in einem
   * httpOnly-Cookie - dieses Skript kommt gar nicht daran und kann sie deshalb
   * auch nicht versehentlich weitergeben oder ein eingeschleustes Skript sie
   * auslesen. Der Browser schickt es bei jeder Anfrage automatisch mit.
   */
  async function login(anmeldename, passwort) {
    await apiJson("/anmelden", { method: "POST", body: JSON.stringify({ anmeldename, passwort }) });
    state.modus = "api";
  }

  async function apiFetch(pfad, opts) {
    const o = opts || {};
    const headers = {};
    const binaer = o.body instanceof Uint8Array || o.body instanceof ArrayBuffer || o.body instanceof Blob;
    if (o.body && !binaer) headers["Content-Type"] = "application/json";
    Object.assign(headers, o.headers || {});
    const res = await fetch("/api" + pfad, Object.assign({}, o, { headers, credentials: "same-origin" }));
    if (!res.ok) {
      let text = "", koerper = null;
      try { koerper = await res.json(); text = koerper.fehler || JSON.stringify(koerper); }
      catch (e) { text = await res.text().catch(() => ""); }
      const err = new Error(text || ("Fehler " + res.status));
      err.status = res.status;
      err.koerper = koerper;
      // 428 = Passwortwechsel steht aus; 401 = Sitzung abgelaufen.
      if (res.status === 428) { state.passwortWechseln = true; zeigePasswortWechsel(); }
      if (res.status === 401 && state.modus === "api") { abmeldenLokal(); }
      throw err;
    }
    return res;
  }
  async function apiJson(pfad, opts) {
    const res = await apiFetch(pfad, opts);
    if (res.status === 204) return null;
    const t = await res.text();
    return t ? JSON.parse(t) : null;
  }

  /**
   * Rechte eines Benutzers setzen. Weil ausschliesslich der Server an die Daten
   * kommt, ist dieser Eintrag die tatsächliche Sperre — nicht bloss eine Anzeige.
   * Erteilen und Entziehen geschieht in einem Vorgang.
   */
  async function rechteAnwenden(benutzerId, gewuenscht) {
    if (state.modus === "demo") {
      const kats = await items("kategorien");
      const speicher = demoDaten().zugriffsrechte;
      const bilanz = { erteilt: 0, geaendert: 0, entzogen: 0 };
      for (const [katId, liste] of gewuenscht.entries()) {
        const vorhanden = speicher.find((r) => String(r.benutzerId) === String(benutzerId) &&
          String(r.fields.KategorieLookupId) === String(katId) && r.fields.Status === "aktiv");
        const vorher = vorhanden ? (vorhanden.fields.Recht || []) : [];
        if (vorher.length === liste.length && vorher.every((x) => liste.includes(x))) continue;
        const kat = kats.find((k) => String(k.id) === String(katId));
        const pfad = kat ? kat.fields.Ordnerpfad : katId;
        const wer = (demoDaten().benutzer.find((b) => String(b.id) === String(benutzerId)) || {}).anmeldename || benutzerId;
        if (liste.length === 0) {
          if (vorhanden) { vorhanden.fields.Status = "entzogen"; vorhanden.fields.Recht = [];
            await historieSchreiben("Zugriffsrecht", katId, "entzogen", "Kategorie „" + pfad + "“ für " + wer + " entzogen.");
            bilanz.entzogen++; }
          continue;
        }
        if (vorhanden) { vorhanden.fields.Recht = liste; bilanz.geaendert++; }
        else {
          speicher.push({ id: demoNeueId(), benutzerId: benutzerId, fields: { BenutzerMail: wer, Recht: liste,
            KategorieLookupId: katId, ErteiltVonMail: state.ich.anmeldename, Status: "aktiv" } });
          bilanz.erteilt++;
        }
        await historieSchreiben("Zugriffsrecht", katId, vorhanden ? "geändert" : "erteilt",
          "Kategorie „" + pfad + "“ für " + wer + ": " + liste.map((r) => RECHT_LABEL[r]).join(", ") + ".");
      }
      invalidate("zugriffsrechte");
      return bilanz;
    }

    const wunsch = {};
    gewuenscht.forEach((liste, katId) => { wunsch[katId] = liste; });
    const bilanz = await apiJson("/benutzer/" + benutzerId + "/rechte",
      { method: "POST", body: JSON.stringify({ rechte: wunsch }) });
    invalidate("zugriffsrechte");
    invalidate("historie");
    return bilanz;
  }

     ========================================================================= */
  const h = (s) => { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };
  const el = (id) => document.getElementById(id);
  function fmtDate(v) { if (!v) return "–"; try { return new Date(v).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }); } catch (e) { return v; } }
  function fmtDateTime(v) { if (!v) return "–"; try { return new Date(v).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" }); } catch (e) { return v; } }
  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function daysUntil(v) { if (!v) return null; return Math.ceil((new Date(v) - new Date()) / 86400000); }
  function arr(v) { return Array.isArray(v) ? v : (v ? [v] : []); }
  function newId(p) { return p + "-" + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase(); }

  function bereichFor(person) {
    const r = arr(person.fields.Rolle);
    if (r.includes("Kunde")) return "Kunde";
    if (r.includes("Mitarbeiter") || r.includes("Bewerber")) return "Mitarbeiter";
    return "Allgemein";
  }
  function buildTree(kats) {
    const byId = new Map(kats.map((k) => [String(k.id), { row: k, kinder: [] }]));
    const roots = [];
    kats.forEach((k) => {
      const p = k.fields.UebergeordneteKategorieLookupId;
      const node = byId.get(String(k.id));
      if (p && byId.has(String(p))) byId.get(String(p)).kinder.push(node);
      else roots.push(node);
    });
    const sortRec = (ns) => {
      ns.sort((a, b) => (a.row.fields.Sortierung || 0) - (b.row.fields.Sortierung || 0) ||
        String(a.row.fields.Title).localeCompare(String(b.row.fields.Title)));
      ns.forEach((n) => sortRec(n.kinder));
    };
    sortRec(roots);
    return roots;
  }
  function flattenTree(nodes, depth, out) {
    out = out || []; depth = depth || 0;
    nodes.forEach((n) => { out.push({ row: n.row, depth: depth }); flattenTree(n.kinder, depth + 1, out); });
    return out;
  }

  let msgTimer = null;
  function say(text, type) {
    const box = el("msgbox");
    if (!box) return;
    box.innerHTML = text ? '<div class="msg ' + (type || "info") + '">' + h(text) + "</div>" : "";
    clearTimeout(msgTimer);
    if (text && type !== "error") msgTimer = setTimeout(() => { if (el("msgbox")) el("msgbox").innerHTML = ""; }, 6000);
  }

  function modal(title, sub, bodyHtml, actions) {
    const m = el("modal");
    m.innerHTML = "<h3>" + h(title) + "</h3>" + (sub ? '<div class="msub">' + h(sub) + "</div>" : "") +
      '<div id="modalBody">' + bodyHtml + '</div><div class="modal-acts" id="modalActs"></div>';
    (actions || []).forEach((a) => {
      const b = document.createElement("button");
      b.textContent = a.label;
      if (a.kind) b.className = a.kind;
      b.addEventListener("click", async () => {
        if (!a.onClick) return closeModal();
        b.disabled = true; const old = b.textContent;
        b.innerHTML = '<span class="spin"></span>' + old;
        try { await a.onClick(); }
        catch (e) { console.error(e); modalErr(e.message || String(e)); }
        finally { if (b.isConnected) { b.disabled = false; b.textContent = old; } }
      });
      el("modalActs").appendChild(b);
    });
    el("overlay").classList.add("open");
  }
  function modalErr(text) {
    const b = el("modalBody"); if (!b) return;
    let box = b.querySelector(".modal-err");
    if (!box) { box = document.createElement("div"); box.className = "msg error modal-err"; b.prepend(box); }
    box.textContent = text;
  }
  function closeModal() { el("overlay").classList.remove("open"); el("modal").innerHTML = ""; }
  el("overlay").addEventListener("click", (e) => { if (e.target === el("overlay")) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  function fieldHtml(id, label, type, value, extra) {
    if (type === "textarea") return '<div class="field"><label for="' + id + '">' + h(label) + '</label><textarea id="' + id + '" rows="3">' + h(value || "") + "</textarea></div>";
    if (type === "select") {
      const opts = (extra || []).map((o) => '<option value="' + h(o.v) + '"' + (String(o.v) === String(value) ? " selected" : "") + ">" + h(o.l) + "</option>").join("");
      return '<div class="field"><label for="' + id + '">' + h(label) + '</label><select id="' + id + '">' + opts + "</select></div>";
    }
    return '<div class="field"><label for="' + id + '">' + h(label) + '</label><input type="' + type + '" id="' + id + '" value="' + h(value || "") + '"' + (extra || "") + "></div>";
  }

      return block;

        eigene.map((m) => '<button class="navitem eigener' + (state.view === "menue" && String(state.param) === String(m.id) ? " active" : "") +
          '" data-menue="' + h(m.id) + '" title="' + h(m.kategoriePfad || "") + '">' +
          '<span class="ic">▹</span>' + h(m.titel) + "</button>").join("") +
        (darfVerwalten()
          ? '<button class="navitem hinzufuegen" id="menueHinzufuegen"><span class="ic">+</span>Menüpunkt hinzufügen</button>'
          : "");
      while (stueck.firstChild) el("nav").insertBefore(stueck.firstChild, einfuegenVor);
    }

    el("nav").querySelectorAll(".navitem[data-k]").forEach((b) => b.addEventListener("click", () => go(b.dataset.k)));
    el("nav").querySelectorAll(".navitem[data-menue]").forEach((b) =>
      b.addEventListener("click", () => go("menue", b.dataset.menue)));
    if (el("menueHinzufuegen")) el("menueHinzufuegen").addEventListener("click", menuepunktDialog);

    const firmen = (state.ich && state.ich.firmen) || [];
    el("firmaSelect").innerHTML = firmen.length
      ? firmen.map((f) => '<option value="' + h(f.id) + '"' + (f.id === state.firmaId ? " selected" : "") + ">" + h(f.name) + "</option>").join("")
      : '<option value="">— keine —</option>';

    el("whoami").textContent = state.ich ? state.ich.anmeldename : "Nicht angemeldet";
    el("whorole").innerHTML = meineRolle() ? '<span class="pill accent">' + h(APP_ROLLE_LABEL[meineRolle()] || meineRolle()) + "</span>" : "";
    // Ohne Anmeldung gibt es nichts abzumelden - der Knopf waere irrefuehrend.
    el("authBtn").style.display = state.ohneAnmeldung ? "none" : "";
    el("authBtn").textContent = state.ich ? "Abmelden" : "Anmelden";
    el("demobar").style.display = state.modus === "demo" ? "flex" : "none";
  }

  function go(view, param) {
    state.view = view; state.param = param || null;
    renderNav(); render(); window.scrollTo(0, 0);
  }

  /* =========================================================================
     Views
     ========================================================================= */
  function shell(title, sub, actionsHtml) {
    return '<div class="page-head"><div><h1>' + h(title) + "</h1>" + (sub ? '<p class="sub">' + h(sub) + "</p>" : "") +
      '</div><div class="btnrow">' + (actionsHtml || "") + '</div></div><div id="msgbox"></div><div id="body"></div>';
  }
  function loading() { return '<div class="empty"><span class="spin"></span>Lade…</div>'; }

  async function render() {
    const v = el("view");
    if (!state.modus) return anmeldeGate(v);
    if (state.view !== "einstellungen" && !firma()) {
      v.innerHTML = shell("Keine Firma freigegeben",
        "Ihr Konto ist in keiner Firma als Benutzer angelegt. Ein Administrator muss Sie zunächst anlegen und eine Zugriffsrolle vergeben.", "");
      return;
    }
    const fn = VIEWS[state.view] || VIEWS.dashboard;
    try { await fn(v); }
    catch (e) {
      console.error(e);
      v.innerHTML = shell("Fehler", null, "");
      say(e.message || String(e), "error");
    }
  }

  function anmeldeGate(v) {
    const grafik = bild("anmeldung");
    v.innerHTML = '<div class="gate card">' +
      (grafik ? '<img src="' + grafik + '" alt="" style="display:block;max-width:100%;max-height:180px;object-fit:contain;margin:0 auto 18px">' : "") +
      "<h2>Anmeldung</h2>" +
      '<p class="hint">Zugang nur mit einem Benutzerkonto, das ein Administrator in dieser Anwendung angelegt hat.</p>' +
      '<div id="msgbox" style="margin-top:12px"></div>' +
      '<form id="anmeldeForm" style="margin-top:14px">' +
      fieldHtml("anName", "Anmeldename", "text", "", ' autocomplete="username" autofocus') +
      '<div style="margin-top:10px">' + fieldHtml("anPass", "Passwort", "password", "", ' autocomplete="current-password"') + "</div>" +
      '<div class="btnrow" style="margin-top:14px">' +
      '<button type="submit" id="gateLogin">Anmelden</button>' +
      '<button type="button" class="ghost" id="gateDemo">Demo ansehen</button></div></form>' +
      '<p class="hint" style="margin-top:14px">Die Demo zeigt die Anwendung mit Beispieldaten im Arbeitsspeicher — ohne Server, ohne Verbindung nach außen.</p></div>';

    el("anmeldeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const knopf = el("gateLogin");
      const name = el("anName").value.trim();
      const pass = el("anPass").value;
      if (!name || !pass) return say("Bitte Anmeldename und Passwort eingeben.", "error");
      knopf.disabled = true; knopf.innerHTML = '<span class="spin"></span>Anmelden…';
      try {
        await anmeldenAusfuehren(name, pass);
      } catch (err) {
        console.error(err);
        say(err.message || String(err), "error");
        if (el("anPass")) el("anPass").value = "";
        if (knopf.isConnected) { knopf.disabled = false; knopf.textContent = "Anmelden"; }
      }
    });
    el("gateDemo").addEventListener("click", demoStarten);
  }

  const VIEWS = {};

  VIEWS.dashboard = async function (v) {
    v.innerHTML = shell(firma().name, "Überblick über Akten, Unterlagen und anstehende Fristen.", "");
    el("body").innerHTML = loading();
    const [pers, doks, hist] = await Promise.all([items("personen"), loadDokumente(), items("historie")]);
    const zahl = (r) => pers.filter((p) => arr(p.fields.Rolle).includes(r)).length;
    const ablaufend = doks.filter((d) => { const t = daysUntil(d.fields.GueltigBis); return t !== null && t >= 0 && t <= 30 && d.fields.Status !== "archiviert"; });
    const abgelaufen = doks.filter((d) => { const t = daysUntil(d.fields.GueltigBis); return t !== null && t < 0 && d.fields.Status !== "archiviert"; });

    const banner = bild("dashboard");
    el("body").innerHTML =
      (banner ? '<img src="' + banner + '" alt="" style="display:block;width:100%;max-height:180px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:16px">' : "") +
      '<div class="stats" style="margin-bottom:16px">' +
        '<div class="stat acc"><div class="n">' + zahl("Kunde") + '</div><div class="l">Kunden</div></div>' +
        '<div class="stat acc"><div class="n">' + zahl("Mitarbeiter") + '</div><div class="l">Mitarbeiter</div></div>' +
        '<div class="stat"><div class="n">' + zahl("Bewerber") + '</div><div class="l">Bewerber</div></div>' +
        '<div class="stat"><div class="n">' + doks.length + '</div><div class="l">Dokumente</div></div>' +
        '<div class="stat warn"><div class="n">' + (ablaufend.length + abgelaufen.length) + '</div><div class="l">Fristen offen</div></div>' +
      "</div>" +
      '<div class="card"><h2>Fristen</h2>' + fristenTable(abgelaufen.concat(ablaufend)) + "</div>" +
      '<div class="card"><h2>Letzte Aktivitäten</h2>' + histTable(hist.slice(0, 12)) + "</div>";
  };

  function fristenTable(rows) {
    if (!rows.length) return '<div class="empty">Keine ablaufenden Dokumente.</div>';
    return '<div class="table-wrap"><table><thead><tr><th>Dokument</th><th>Person</th><th>Gültig bis</th><th>Status</th></tr></thead><tbody>' +
      rows.map((d) => {
        const t = daysUntil(d.fields.GueltigBis);
        const pill = t < 0
          ? '<span class="pill danger">seit ' + Math.abs(t) + " Tagen abgelaufen</span>"
          : '<span class="pill warn">noch ' + t + " Tage</span>";
        return "<tr><td>" + h(d.name) + "</td><td>" + h(d.fields.Person || "–") + "</td><td>" +
          fmtDate(d.fields.GueltigBis) + "</td><td>" + pill + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }
  function histTable(rows) {
    if (!rows.length) return '<div class="empty">Noch keine Einträge.</div>';
    return '<div class="table-wrap"><table><thead><tr><th>Zeitpunkt</th><th>Aktion</th><th>Bezug</th><th>Benutzer</th><th>Details</th></tr></thead><tbody>' +
      rows.map((r) => "<tr><td>" + fmtDateTime(r.createdDateTime) + "</td><td>" + h(r.fields.Aktion) + "</td><td>" + h(r.fields.BezugTyp) +
        ' <span class="mono">' + h(r.fields.BezugID) + "</span></td><td>" + h(r.fields.BenutzerMail) + "</td><td>" + h(r.fields.Details) + "</td></tr>").join("") +
      "</tbody></table></div>";
  }

  function personenView(rolle, titel, sub) {
    return async function (v) {
      v.innerHTML = shell(titel, sub, darfSchreiben() ? '<button id="neu">Neu anlegen</button>' : "");
      if (el("neu")) el("neu").addEventListener("click", () => personDialog(null, rolle));
      el("body").innerHTML = loading();
      const pers = (await items("personen")).filter((p) => arr(p.fields.Rolle).includes(rolle));
      el("body").innerHTML = '<div class="card"><div class="row" style="margin-bottom:12px"><div class="field">' +
        '<label for="q">Suche</label><input type="search" id="q" placeholder="Name, E-Mail, Ort…"></div></div><div id="tbl"></div></div>';
      const draw = () => {
        const q = (el("q").value || "").toLowerCase();
        const rows = pers.filter((p) => !q || JSON.stringify(p.fields).toLowerCase().includes(q));
        el("tbl").innerHTML = rows.length
          ? '<div class="table-wrap"><table><thead><tr><th>Name</th><th>ID</th><th>Kontakt</th><th>Ort</th><th>Status</th></tr></thead><tbody>' +
            rows.map((p) => '<tr class="rowlink" data-id="' + h(p.id) + '"><td><b>' + h(p.fields.Title) + '</b></td><td class="mono">' +
              h(p.fields.PersonenID || "–") + "</td><td>" + h(p.fields.EMail || "–") +
              (p.fields.Telefon ? '<br><span class="hint">' + h(p.fields.Telefon) + "</span>" : "") + "</td><td>" + h(p.fields.Ort || "–") +
              "</td><td>" + (p.fields.Aktiv === false ? '<span class="pill danger">inaktiv</span>' : '<span class="pill ok">aktiv</span>') + "</td></tr>").join("") +
            "</tbody></table></div>"
          : '<div class="empty">Keine Einträge.</div>';
        el("tbl").querySelectorAll("[data-id]").forEach((r) => r.addEventListener("click", () => go("akte", r.dataset.id)));
      };
      el("q").addEventListener("input", draw);
      draw();
    };
  }
  VIEWS.kunden = personenView("Kunde", "Kunden", "Alle Kunden dieser Firma. Ein Klick öffnet die Kundenakte.");
  VIEWS.mitarbeiter = personenView("Mitarbeiter", "Mitarbeiter", "Alle Mitarbeiter dieser Firma. Ein Klick öffnet die Personalakte.");

  async function personDialog(person, defaultRolle) {
    const f = person ? person.fields : {};
    const rollen = arr(f.Rolle).length ? arr(f.Rolle) : (defaultRolle ? [defaultRolle] : []);
    modal(person ? "Person bearbeiten" : "Neue Person anlegen",
      person ? f.Title : "Nach dem Speichern steht die Akte mit den konfigurierten Untermenüs bereit.",
      '<div class="row">' + fieldHtml("pName", "Name", "text", f.Title) +
        fieldHtml("pId", "Personen-ID", "text", f.PersonenID, ' placeholder="wird automatisch vergeben"') + "</div>" +
      '<div class="row" style="margin-top:10px">' + fieldHtml("pMail", "E-Mail", "email", f.EMail) + fieldHtml("pTel", "Telefon", "text", f.Telefon) + "</div>" +
      '<div class="row" style="margin-top:10px">' + fieldHtml("pStr", "Straße", "text", f.Strasse) + fieldHtml("pPlz", "PLZ", "text", f.PLZ) + fieldHtml("pOrt", "Ort", "text", f.Ort) + "</div>" +
      '<div class="row" style="margin-top:10px">' +
        fieldHtml("pGeb", "Geburtsdatum", "date", f.Geburtsdatum ? String(f.Geburtsdatum).slice(0, 10) : "") +
        fieldHtml("pEin", "Eintrittsdatum", "date", f.Eintrittsdatum ? String(f.Eintrittsdatum).slice(0, 10) : "") + "</div>" +
      (darfVerwalten() ? '<p class="hint" style="margin-top:6px">Ein Zugang zur Anwendung wird getrennt davon unter „Benutzer“ angelegt und dort einer Person zugeordnet.</p>' : "") +
      '<div class="field" style="margin-top:10px"><label>Rollen</label><div class="btnrow">' +
        ROLLEN.map((r) => '<label class="pill neutral" style="cursor:pointer"><input type="checkbox" class="rolle" value="' + r + '"' +
          (rollen.includes(r) ? " checked" : "") + ' style="margin-right:5px">' + h(r) + "</label>").join("") + "</div></div>" +
      '<div style="margin-top:10px">' + fieldHtml("pNotiz", "Notiz", "textarea", f.Notiz) + "</div>",
      [
        { label: "Abbrechen", kind: "ghost", onClick: null },
        { label: person ? "Speichern" : "Anlegen", onClick: async () => {
          const name = el("pName").value.trim();
          if (!name) return modalErr("Bitte einen Namen angeben.");
          const rl = Array.from(document.querySelectorAll(".rolle")).filter((c) => c.checked).map((c) => c.value);
          if (!rl.length) return modalErr("Bitte mindestens eine Rolle wählen.");
          const fields = {
            Title: name,
            PersonenID: el("pId").value.trim() || newId(rl.includes("Kunde") ? "KD" : (rl.includes("Bewerber") && !rl.includes("Mitarbeiter")) ? "BW" : "MA"),
            Rolle: rl, EMail: el("pMail").value.trim(), Telefon: el("pTel").value.trim(),
            Strasse: el("pStr").value.trim(), PLZ: el("pPlz").value.trim(), Ort: el("pOrt").value.trim(),
            Notiz: el("pNotiz").value,
            Aktiv: person ? (f.Aktiv !== false) : true,
          };
          if (el("pGeb").value) fields.Geburtsdatum = el("pGeb").value;
          if (el("pEin").value) fields.Eintrittsdatum = el("pEin").value;

          if (person) await personSpeichern(person.id, fields);
          else await personSpeichern(null, fields);
          await historieSchreiben("Person", fields.PersonenID, person ? "geändert" : "erstellt",
            "Person „" + name + "“ (" + rl.join(", ") + ").");
          closeModal();
          go(person ? "akte" : (rl.includes("Kunde") ? "kunden" : "mitarbeiter"), person ? person.id : null);
          say(person ? "Gespeichert." :
            (rl.includes("Mitarbeiter") && darfVerwalten()
              ? "Person angelegt. Ein Zugang zur Anwendung wird unter „Benutzer“ eingerichtet."
              : "Gespeichert."), "ok");
        }},
      ]);
  }

  VIEWS.akte = async function (v) {
    const pers = await items("personen");
    const p = pers.find((x) => String(x.id) === String(state.param));
    if (!p) { v.innerHTML = shell("Akte", "Person nicht gefunden.", ""); return; }
    const bereich = bereichFor(p);
    // Zugang gibt es nur, wenn dieser Person ein Benutzer zugeordnet ist.
    const benutzerListe = darfVerwalten() ? await items("benutzer") : [];
    const zugang = benutzerListe.find((b) => String(b.personId) === String(p.id));

    v.innerHTML = shell(p.fields.Title, "Akte · " + bereich + " · " + (p.fields.PersonenID || ""),
      (darfSchreiben() ? '<button class="ghost" id="edit">Stammdaten bearbeiten</button>' : "") +
      (darfVerwalten() ? '<button class="ghost" id="perm">Zugriffsrechte</button>' : "") +
      (darfSchreiben() ? '<button id="add">Dokument hinzufügen</button>' : ""));
    if (el("edit")) el("edit").addEventListener("click", () => personDialog(p));
    if (el("perm")) el("perm").addEventListener("click", () => freigabeDialog(zugang));
    el("body").innerHTML = loading();

    const [kats, doks] = await Promise.all([items("kategorien"), loadDokumente()]);
    const meine = doks.filter((d) => String(d.fields.PersonLookupId) === String(p.id));
    const relevant = kats.filter((k) => k.fields.Bereich === bereich && k.fields.Aktiv !== false);
    if (el("add")) el("add").addEventListener("click", () => uploadDialog(p, relevant));

    const flat = flattenTree(buildTree(relevant));
    el("body").innerHTML =
      '<div class="card"><h2>Stammdaten</h2><div class="table-wrap"><table><tbody>' +
        stammRow("E-Mail", p.fields.EMail) + stammRow("Telefon", p.fields.Telefon) +
        stammRow("Anschrift", [p.fields.Strasse, [p.fields.PLZ, p.fields.Ort].filter(Boolean).join(" ")].filter(Boolean).join(", ")) +
        stammRow("Geburtsdatum", p.fields.Geburtsdatum ? fmtDate(p.fields.Geburtsdatum) : "") +
        stammRow("Eintrittsdatum", p.fields.Eintrittsdatum ? fmtDate(p.fields.Eintrittsdatum) : "") +
        stammRow("Zugang zur Anwendung", zugang ? zugang.anmeldename + " (" + (APP_ROLLE_LABEL[zugang.appRolle] || zugang.appRolle) + ")" : "") +
        stammRow("Notiz", p.fields.Notiz) +
      "</tbody></table></div></div>" +
      '<div class="card"><h2>Dokumente <span class="pill neutral">' + meine.length + "</span></h2>" +
      (flat.length ? flat.map((n) => {
        const inCat = meine.filter((d) => String(d.fields.KategorieLookupId) === String(n.row.id));
        if (!inCat.length && n.depth > 0) return "";
        return '<div style="margin:' + (n.depth ? "10px 0 4px " + (n.depth * 16) + "px" : "16px 0 6px") + '"><h3>' + h(n.row.fields.Title) +
          (inCat.length ? ' <span class="pill neutral">' + inCat.length + "</span>" : "") + "</h3>" +
          (inCat.length ? dokTable(inCat) : '<div class="hint" style="padding:4px 0 8px">Keine Dokumente.</div>') + "</div>";
      }).join("") : '<div class="empty">Für den Bereich ' + h(bereich) + " sind keine Kategorien konfiguriert.</div>") + "</div>";
    bindDokActions(doks);
  };
  function stammRow(l, v) { return v ? '<tr><th style="width:180px">' + h(l) + "</th><td>" + h(v) + "</td></tr>" : ""; }

  /* Kurzkennzeichen des Dateityps, damit auf einen Blick erkennbar ist, was
     hinter dem Namen steckt - besonders bei abgeschnittenen langen Namen. */
  const TYP_KURZ = {
    pdf: "PDF", jpg: "Bild", jpeg: "Bild", png: "Bild", gif: "Bild", webp: "Bild",
    bmp: "Bild", tif: "Bild", tiff: "Bild", heic: "Bild",
    doc: "Word", docx: "Word", odt: "Text", rtf: "Text", txt: "Text",
    xls: "Excel", xlsx: "Excel", ods: "Tabelle", csv: "Tabelle",
    ppt: "Folien", pptx: "Folien",
    msg: "E-Mail", eml: "E-Mail",
    zip: "Archiv", "7z": "Archiv", rar: "Archiv",
    mp3: "Audio", wav: "Audio", mp4: "Video", mov: "Video",
  };
  function typKennzeichen(d) {
    const endung = String(d.name || "").split(".").pop().toLowerCase();
    const kurz = TYP_KURZ[endung] || (endung.length <= 5 ? endung.toUpperCase() : "Datei");
    return ' <span class="hint mono">' + h(kurz) + "</span>";
  }

  /**
   * Versandstatus. Grün, wenn das Dokument nachweislich per E-Mail hinausging;
   * rot, solange nicht. Der Status haengt an der Fassung: nach einer neuen
   * Version steht das Dokument wieder auf "nicht gesendet", weil der Empfaenger
   * dann die alte Fassung hat.
   */
  function versandKennzeichen(d) {
    const am = d.fields.GesendetAm;
    if (!am) return '<span class="pill danger">nicht gesendet</span>';
    const an = d.fields.GesendetAn ? " an " + d.fields.GesendetAn : "";
    return '<span class="pill ok" title="' + h(fmtDateTime(am) + an) + '">gesendet</span>' +
      '<div class="hint" style="margin-top:2px">' + h(fmtDate(am)) + "</div>";
  }

  function dokTable(rows) {
    return '<div class="table-wrap"><table><thead><tr><th>Datei</th><th>Dokument-ID</th><th>Version</th>' +
      '<th>Status</th><th>Gültig bis</th><th>Versand</th><th></th></tr></thead><tbody>' +
      rows.map((d) => {
        const t = daysUntil(d.fields.GueltigBis);
        const st = d.fields.Status || "gueltig";
        const pill = st === "archiviert" ? '<span class="pill neutral">archiviert</span>'
          : (t !== null && t < 0) ? '<span class="pill danger">abgelaufen</span>'
          : (t !== null && t <= 30) ? '<span class="pill warn">läuft ab</span>'
          : '<span class="pill ok">' + h(DOK_STATUS_LABEL[st] || st) + "</span>";
        return '<tr><td><b>' + h(d.name) + "</b>" + typKennzeichen(d) + '</td><td class="mono">' + h(d.fields.DokumentID || "–") +
          '</td><td class="mono">' + h(d.fields.Version || "–") + "</td><td>" + pill + "</td><td>" + fmtDate(d.fields.GueltigBis) +
          "</td><td>" + versandKennzeichen(d) +
          '</td><td><div class="btnrow">' +
          '<button class="ghost sm" data-act="open" data-id="' + h(d.id) + '">Öffnen</button>' +
          (darfSchreiben() ? '<button class="ghost sm" data-act="version" data-id="' + h(d.id) + '">Neue Version</button>' : "") +
          (darfVersenden() ? '<button class="ghost sm" data-act="mail" data-id="' + h(d.id) + '">E-Mail</button>' : "") +
          (darfSchreiben() ? '<button class="ghost sm" data-act="arch" data-id="' + h(d.id) + '">' + (st === "archiviert" ? "Reaktivieren" : "Archivieren") + "</button>" : "") +
          "</div></td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function bindDokActions(alle) {
    document.querySelectorAll("[data-act]").forEach((b) => {
      b.addEventListener("click", async () => {
        const d = alle.find((x) => String(x.id) === String(b.dataset.id));
        if (!d) return;
        const act = b.dataset.act;
        const alt = b.textContent;
        b.disabled = true; b.innerHTML = '<span class="spin"></span>';
        try {
          if (act === "open") await dokumentOeffnen(d);
          else if (act === "version") versionDialog(d);
          else if (act === "mail") mailDialog(d);
          else if (act === "arch") {
            const next = d.fields.Status === "archiviert" ? "gueltig" : "archiviert";
            await patchDokument(d, { Status: next });
            await historieSchreiben("Dokument", d.fields.DokumentID, next === "archiviert" ? "archiviert" : "reaktiviert",
              "Status auf „" + DOK_STATUS_LABEL[next] + "“ gesetzt.");
            say("Status geändert.", "ok");
            return render();
          }
        } catch (e) { console.error(e); say(e.message || String(e), "error"); }
        finally { if (b.isConnected) { b.disabled = false; b.textContent = alt; } }
      });
    });
  }

  async function patchDokument(d, fields) {
    if (state.modus === "demo") { Object.assign(d.fields, fields); invalidate("dokumente"); return; }
    await apiJson("/dokumente/" + d.id, { method: "PATCH", body: JSON.stringify({
      status: fields.Status, gueltigBis: fields.GueltigBis, notiz: fields.Notiz }) });
    invalidate("dokumente");
  }

  function uploadDialog(person, kats) {
    const flat = flattenTree(buildTree(kats));
    modal("Dokument hinzufügen", person ? "Akte: " + person.fields.Title : null,
      '<div class="field"><label for="uFile">Datei</label><input type="file" id="uFile"></div>' +
      '<p class="hint" style="margin-top:4px">Alle gängigen Formate: PDF, Word, Excel, Bilder und Scans, ' +

      '<div class="field"><label for="q">Suche</label><input type="search" id="q" placeholder="Dateiname, Dokument-ID…"></div>' +
      '<div class="field narrow"><label for="fs">Status</label><select id="fs"><option value="">alle</option>' +
        DOK_STATUS.map((s) => '<option value="' + s + '">' + h(DOK_STATUS_LABEL[s]) + "</option>").join("") + "</select></div>" +
      '<div class="field narrow"><label for="ff">Frist</label><select id="ff"><option value="">alle</option>' +
        '<option value="30">läuft in 30 Tagen ab</option><option value="0">abgelaufen</option></select></div>' +
      '<div class="field narrow"><label for="fv">Versand</label><select id="fv"><option value="">alle</option>' +
        '<option value="offen">nicht gesendet</option><option value="gesendet">gesendet</option></select></div>' +
      '<div class="field"><label for="fk">Kategorie</label><select id="fk"><option value="">alle</option>' +
        flattenTree(buildTree(kats)).map((n) => '<option value="' + h(n.row.id) + '">' + "&nbsp;".repeat(n.depth * 4) + h(n.row.fields.Title) + "</option>").join("") +
      '</select></div></div><div id="tbl"></div></div>';

    const draw = () => {
      const q = (el("q").value || "").toLowerCase(), fs = el("fs").value,
            ff = el("ff").value, fk = el("fk").value, fv = el("fv").value;
      let rows = doks;
      if (q) rows = rows.filter((d) => (d.name + " " + (d.fields.DokumentID || "") + " " + (d.fields.Person || "")).toLowerCase().includes(q));
      if (fs) rows = rows.filter((d) => (d.fields.Status || "gueltig") === fs);
      if (fk) rows = rows.filter((d) => String(d.fields.KategorieLookupId) === fk);
      if (ff === "30") rows = rows.filter((d) => { const t = daysUntil(d.fields.GueltigBis); return t !== null && t >= 0 && t <= 30; });
      if (ff === "0") rows = rows.filter((d) => { const t = daysUntil(d.fields.GueltigBis); return t !== null && t < 0; });
      if (fv === "offen") rows = rows.filter((d) => !d.fields.GesendetAm);
      if (fv === "gesendet") rows = rows.filter((d) => !!d.fields.GesendetAm);
      el("tbl").innerHTML = rows.length ? dokTable(rows) : '<div class="empty">Keine Dokumente gefunden.</div>';
      bindDokActions(doks);
    };
    ["q", "fs", "ff", "fk", "fv"].forEach((id) => el(id).addEventListener("input", draw));
    draw();
  };

  /** Ansicht hinter einem eigenen Menüpunkt: die Unterlagen seiner Kategorie. */
  VIEWS.menue = async function (v) {
    const punkt = (state.menuepunkte || []).find((m) => String(m.id) === String(state.param));
    if (!punkt) { v.innerHTML = shell("Menüpunkt", "Dieser Eintrag existiert nicht mehr.", ""); return; }

    v.innerHTML = shell(punkt.titel, punkt.kategoriePfad || "",
      (darfSchreiben() ? '<button id="add">Dokument hinzufügen</button>' : "") +
      (darfVerwalten()
        ? '<button class="ghost" id="hoch" title="Im Menü nach oben">▲</button>' +
          '<button class="ghost" id="runter" title="Im Menü nach unten">▼</button>' +
          '<button class="ghost" id="weg">Menüpunkt entfernen</button>'
        : ""));
    el("body").innerHTML = loading();

    const [doks, kats] = await Promise.all([loadDokumente(), items("kategorien")]);

    // Kategorie samt untergeordneten - ein Menüpunkt auf "Abwesenheiten" soll
    // auch die Krankmeldungen darunter zeigen.
    const kinder = new Map();
    kats.forEach((k) => {
      const p = k.fields.UebergeordneteKategorieLookupId;
      if (!p) return;
      if (!kinder.has(String(p))) kinder.set(String(p), []);
      kinder.get(String(p)).push(String(k.id));
    });
    const erlaubt = new Set();
    const stapel = [String(punkt.kategorieId)];
    while (stapel.length) {
      const id = stapel.pop();
      if (erlaubt.has(id)) continue;
      erlaubt.add(id);
      (kinder.get(id) || []).forEach((k) => stapel.push(k));
    }
    const meine = doks.filter((d) => erlaubt.has(String(d.fields.KategorieLookupId)));

    if (el("add")) el("add").addEventListener("click", () =>
      uploadDialog(null, kats.filter((k) => erlaubt.has(String(k.id)) && k.fields.Aktiv !== false)));
    if (el("hoch")) el("hoch").addEventListener("click", async () => {
      await menuepunktVerschieben(punkt.id, "hoch"); renderNav(); say("Verschoben.", "ok");
    });
    if (el("runter")) el("runter").addEventListener("click", async () => {
      await menuepunktVerschieben(punkt.id, "runter"); renderNav(); say("Verschoben.", "ok");
    });
    if (el("weg")) el("weg").addEventListener("click", () => {
      modal("Menüpunkt entfernen", punkt.titel,
        '<div class="msg info">Entfernt nur den Eintrag aus der Seitenleiste. Die Kategorie und alle ' +
        "Unterlagen darin bleiben unverändert bestehen.</div>",
        [{ label: "Abbrechen", kind: "ghost", onClick: null },
         { label: "Entfernen", kind: "danger", onClick: async () => {
           await menuepunktEntfernen(punkt.id);
           closeModal(); renderNav(); go("dokumente");
           say("Menüpunkt entfernt.", "ok");
         }}]);
    });

    el("body").innerHTML = '<div class="card"><h2>Unterlagen <span class="pill neutral">' + meine.length + "</span></h2>" +
      (meine.length ? dokTable(meine)
        : '<div class="empty">In dieser Kategorie liegen noch keine Unterlagen — oder Sie sind für Sie nicht freigegeben.</div>') +
      "</div>";
    bindDokActions(doks);
  };

  function freigabePicker(benutzer) {
    const auswahl = benutzer.filter((b) => b.aktiv);

  async function freigabeDialog(benutzer) {
    if (!benutzer) {
      return modal("Zugriffsrechte", null,
        '<div class="msg warn">Für diese Person ist kein Zugang angelegt. Unter „Benutzer“ lässt sich einer einrichten und dieser Person zuordnen.</div>',
        [{ label: "Schließen", kind: "ghost", onClick: null }]);
    }
    const [kats, rechte] = await Promise.all([items("kategorien"), items("zugriffsrechte")]);
    const flat = flattenTree(buildTree(kats.filter((k) => k.fields.Aktiv !== false)));
    const cur = new Map();
    rechte.filter((r) => String(r.benutzerId) === String(benutzer.id) && r.fields.Status === "aktiv")
      .forEach((r) => cur.set(String(r.fields.KategorieLookupId), arr(r.fields.Recht)));

    modal("Zugriffsrechte — " + benutzer.anmeldename,
      (benutzer.person ? benutzer.person + " · " : "") + (APP_ROLLE_LABEL[benutzer.appRolle] || benutzer.appRolle),
      '<div class="msg info">Ein Häkchen gilt für die Kategorie und alle darunterliegenden. Rechte lassen sich jederzeit erneut öffnen, ergänzen oder entziehen.</div>' +
      '<div class="table-wrap"><table class="perm-table"><thead><tr><th>Kategorie</th>' +
        RECHTE.map((r) => '<th class="chk">' + h(RECHT_LABEL[r]) + "</th>").join("") + "</tr></thead><tbody>" +
      flat.map((n) => {
        const have = cur.get(String(n.row.id)) || [];
        return '<tr><td class="lbl d' + Math.min(n.depth, 3) + '">' + h(n.row.fields.Title) +
          (n.depth === 0 ? ' <span class="hint">(' + h(n.row.fields.Bereich) + ")</span>" : "") + "</td>" +
          RECHTE.map((r) => '<td class="chk"><input type="checkbox" data-k="' + h(n.row.id) + '" data-r="' + r + '"' +
            (have.includes(r) ? " checked" : "") + "></td>").join("") + "</tr>";
      }).join("") + "</tbody></table></div>",
      [
        { label: "Abbrechen", kind: "ghost", onClick: null },
        { label: "Speichern", onClick: async () => {
          const gewuenscht = new Map();
          flat.forEach((n) => gewuenscht.set(String(n.row.id), []));
          document.querySelectorAll("#modalBody input[type=checkbox]").forEach((cb) => {
            if (cb.checked) gewuenscht.get(cb.dataset.k).push(cb.dataset.r);
          });
          const bilanz = await rechteAnwenden(benutzer.id, gewuenscht);
          closeModal();
          say("Gespeichert (" + bilanz.erteilt + " neu, " + bilanz.geaendert + " geändert, " + bilanz.entzogen + " entzogen).", "ok");
          if (state.view === "zugriff" || state.view === "benutzer") render();
        }},
      ]);
  }

  /* =========================================================================
     Buchhaltung — Belege erfassen und gebündelt an den Steuerberater geben

     Die Anwendung erstellt keinen Jahresabschluss; das bleibt Aufgabe der
     Kanzlei. Sie sorgt dafür, dass unterjährig nichts verlorengeht und am
     Ende ein Paket herauskommt, das DATEV einlesen kann.
     ========================================================================= */

  /**
   * Belegarten. Jede bringt ihren Buchungssatz mit, damit nicht bei jedem
   * Beleg neu überlegt werden muss, was ins Soll und was ins Haben gehört.
   *
   *   soll/haben: "partner" | "ertrag" | "aufwand" | "geld" | "kasse" | "frei"
   */
  const BELEGARTEN = [
    { k: "Ausgangsrechnung", l: "Ausgangsrechnung (Kunde)", partner: "Debitor",
      soll: "partner", haben: "ertrag",
      hilfe: "Was Sie in Rechnung stellen: Forderung an den Kunden, dagegen Ihre Erlöse." },
    { k: "Eingangsrechnung", l: "Eingangsrechnung (Lieferant)", partner: "Kreditor",
      soll: "aufwand", haben: "partner",
      hilfe: "Was Ihnen in Rechnung gestellt wird: Aufwand, dagegen die Verbindlichkeit." },
    { k: "Zahlungseingang", l: "Zahlungseingang (Bank)", partner: "Debitor",
      soll: "geld", haben: "partner", ohneSteuer: true,
      hilfe: "Der Kunde zahlt. Die Steuer steckte bereits in der Rechnung — hier keine mehr." },
    { k: "Zahlungsausgang", l: "Zahlungsausgang (Bank)", partner: "Kreditor",
      soll: "partner", haben: "geld", ohneSteuer: true,
      hilfe: "Sie zahlen eine Rechnung. Die Steuer stand schon in der Eingangsrechnung." },
    { k: "Kasseneinnahme", l: "Kasseneinnahme (bar)", soll: "kasse", haben: "ertrag",
      hilfe: "Bargeld kommt in die Kasse." },
    { k: "Kassenausgabe", l: "Kassenausgabe (bar)", soll: "aufwand", haben: "kasse",
      hilfe: "Bar bezahlt. Die Kasse kann dabei nie unter null fallen." },
    { k: "Sonstiges", l: "Sonstige Buchung", soll: "frei", haben: "frei",
      hilfe: "Freie Buchung, wenn keine der Vorlagen passt." },
  ];
  const BELEGART = Object.fromEntries(BELEGARTEN.map((a) => [a.k, a]));
  const STEUERSAETZE = [{ v: 19, l: "19 % (Regelsatz)" }, { v: 7, l: "7 % (ermäßigt)" },
    { v: 0, l: "ohne Umsatzsteuer" }];

  function darfBuchhaltungSehen() {
    return ["Administrator", "Geschaeftsfuehrung", "Verwaltung"].includes(meineRolle());
  }
  function darfBuchen() { return ["Administrator", "Verwaltung"].includes(meineRolle()); }

  /* --------------------------------------------------------- Beträge */

  function fmtEuro(cent, ohneWaehrung) {
    const n = (Math.round(Number(cent) || 0) / 100).toLocaleString("de-DE",
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return ohneWaehrung ? n : n + " €";
  }

  /**
   * Eingabe in Cent umrechnen.
   *
   * Angenommen werden die Schreibweisen, die tatsächlich eingetippt werden:
   * "1234,56", "1.234,56", "1234.56", "1234". Was sich nicht eindeutig lesen
   * lässt, ergibt null — dann wird nichts gespeichert, statt einen falschen
   * Betrag zu buchen.
   */
  function centAus(eingabe) {
    const s = String(eingabe == null ? "" : eingabe).trim().replace(/[\s €]/g, "");
    if (!s || !/^[-+]?[\d.,]+$/.test(s)) return null;
    let zahl = s;
    if (s.includes(",")) {
      // Komma ist das Dezimaltrennzeichen; Punkte trennen dann die Tausender.
      zahl = s.replace(/\./g, "").replace(",", ".");
    } else if (/^[-+]?\d{1,3}(\.\d{3})+$/.test(s)) {
      // "1.234" ist zweideutig. Drei Stellen hinter jedem Punkt sprechen für
      // Tausender — so steht es auf deutschen Rechnungen.
      zahl = s.replace(/\./g, "");
    }
    const n = Number(zahl);
    if (!isFinite(n)) return null;
    return Math.round(n * 100);
  }

  /* ------------------------------------------------------- Datenzugriff */

  async function buchLaden(pfad, schluessel) {
    const k = "buch:" + (schluessel || pfad);
    if (state.cache[k]) return state.cache[k];
    const antw = await apiJson("/buchhaltung/" + pfad);
    state.cache[k] = antw;
    return antw;
  }
  function buchVergessen() {
    Object.keys(state.cache).forEach((k) => { if (k.indexOf("buch:") === 0) delete state.cache[k]; });
    delete state.cache.historie;
    delete state.cache.dokumente;
  }
  const buchKonten = () => buchLaden("konten").then((a) => a.wert || []);
  const buchPartner = () => buchLaden("partner").then((a) => a.wert || []);
  const buchEinstellungen = () => buchLaden("einstellungen");

  /* ----------------------------------------------------------- Zeitraum */

  function zeitraum() {
    if (!state.buchZeitraum) {
      const gespeichert = sGet("vw_buch_zeitraum");
      const jahr = new Date().getFullYear();
      state.buchZeitraum = gespeichert ? JSON.parse(gespeichert)
        : { von: jahr + "-01-01", bis: jahr + "-12-31" };
    }
    return state.buchZeitraum;
  }
  function zeitraumSetzen(von, bis) {
    state.buchZeitraum = { von, bis };
    sSet("vw_buch_zeitraum", JSON.stringify(state.buchZeitraum));
    buchVergessen();
  }
  function quartal(jahr, n) {
    const ersterMonat = (n - 1) * 3 + 1;
    const letzter = new Date(Date.UTC(jahr, ersterMonat + 2, 0)).getUTCDate();
    return { von: jahr + "-" + String(ersterMonat).padStart(2, "0") + "-01",
      bis: jahr + "-" + String(ersterMonat + 2).padStart(2, "0") + "-" + letzter };
  }

  /** Zeitraumwahl über allen Buchhaltungsansichten — überall dieselbe. */
  function zeitraumHtml() {
    const z = zeitraum();
    const jahr = Number(z.von.slice(0, 4));
    return '<div class="card zeitraum"><div class="row" style="align-items:flex-end">' +
      '<div class="field narrow"><label for="zVon">Zeitraum von</label>' +
      '<input type="date" id="zVon" value="' + h(z.von) + '"></div>' +
      '<div class="field narrow"><label for="zBis">bis</label>' +
      '<input type="date" id="zBis" value="' + h(z.bis) + '"></div>' +
      '<div class="btnrow" style="padding-bottom:1px">' +
      '<button class="ghost sm" data-z="jahr">' + jahr + "</button>" +
      [1, 2, 3, 4].map((n) => '<button class="ghost sm" data-z="q' + n + '">Q' + n + "</button>").join("") +
      '<button class="ghost sm" data-z="vorjahr">' + (jahr - 1) + "</button>" +
      "</div></div></div>";
  }
  function zeitraumBinden(neuZeichnen) {
    const uebernehmen = () => {
      const von = el("zVon").value, bis = el("zBis").value;
      if (!von || !bis) return;
      if (von > bis) return say("Das Ende des Zeitraums liegt vor seinem Anfang.", "error");
      zeitraumSetzen(von, bis);
      neuZeichnen();
    };
    el("zVon").addEventListener("change", uebernehmen);
    el("zBis").addEventListener("change", uebernehmen);
    document.querySelectorAll("[data-z]").forEach((b) => b.addEventListener("click", () => {
      const jahr = Number(zeitraum().von.slice(0, 4));
      const wahl = b.dataset.z;
      if (wahl === "jahr") zeitraumSetzen(jahr + "-01-01", jahr + "-12-31");
      else if (wahl === "vorjahr") zeitraumSetzen((jahr - 1) + "-01-01", (jahr - 1) + "-12-31");
      else { const q = quartal(jahr, Number(wahl.slice(1))); zeitraumSetzen(q.von, q.bis); }
      neuZeichnen();
    }));
  }

  /** Im Demo-Modus gibt es keine Buchhaltung — echte Zahlen gehören nicht in eine Vorführung. */
